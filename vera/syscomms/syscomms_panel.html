<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* vera theme boot — paint cached theme before CSS parses, avoids flash */
  (function(){try{var d=document.documentElement,S=window.localStorage;
  var t=S.getItem('vera:ui:theme');if(t)d.setAttribute('data-theme',t);
  var v=JSON.parse(S.getItem('vera:ui:themeVars')||'null');
  if(v)for(var k in v)d.style.setProperty(k,v[k]);}catch(e){}})();</script>
<meta charset="UTF-8">
<title>Vera · System Comms</title>
<style>
:root{
  --bg:#0d0f12; --bg1:#14181d; --bg2:#1a1f26; --bg3:#20262e;
  --border:#232a33; --border2:#2e3742;
  --fg:#d8dde3; --fg2:#9aa3ad; --dim:#5f6975;
  --acc:#4a9eff; --ok:#28c28a; --warn:#f5b341; --err:#ef5b5b;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--fg);
  overflow:hidden;font:12px/1.5 -apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif}
#root{display:flex;flex-direction:column;height:100vh;min-height:0}
#bar{flex-shrink:0;border-bottom:1px solid var(--border);background:var(--bg1);
  padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#bar h1{margin:0;font-size:12px;font-weight:600}
#bar .sub{font-size:10px;color:var(--dim)}
.spacer{margin-left:auto}
.chip{padding:3px 9px;border-radius:20px;font-size:10px;cursor:pointer;
  border:1px solid var(--border2);background:var(--bg2);color:var(--fg2);user-select:none}
.chip:hover{border-color:var(--acc);color:var(--fg)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:600}
#list{flex:1;overflow-y:auto;padding:10px 16px 40px;min-height:0}
.row{display:flex;gap:11px;padding:9px 10px;border-bottom:1px solid var(--border);
  align-items:flex-start}
.row:hover{background:var(--bg1)}
.sev{width:3px;flex:0 0 3px;border-radius:2px;align-self:stretch;background:var(--dim)}
.sev.critical{background:var(--err)} .sev.warning{background:var(--warn)}
.sev.info{background:var(--acc);opacity:.5}
.meta{flex:0 0 116px;color:var(--dim);font-size:10px;font-family:var(--mono);
  padding-top:1px;line-height:1.45}
.src{display:inline-block;padding:0 5px;border-radius:3px;background:var(--bg3);
  color:var(--fg2);font-size:9px;margin-top:3px}
.body{min-width:0;flex:1}
.title{font-size:12px;color:var(--fg);word-break:break-word}
.detail{font-size:11px;color:var(--fg2);margin-top:3px;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.open .detail{-webkit-line-clamp:unset}
.empty{color:var(--dim);text-align:center;padding:34px;font-size:11px}
.warnbar{background:var(--bg2);border:1px solid var(--border2);border-radius:6px;
  padding:7px 10px;margin:8px 0;color:var(--warn);font-size:10px}
.count{font-size:10px;color:var(--dim);font-family:var(--mono)}
</style>
<link rel="stylesheet" href="/ui/vera-panel.css">
</head>
<body>
<div id="root">
  <div id="bar">
    <h1>System Comms</h1>
    <span class="sub">everything the system has said or flagged</span>
    <span class="spacer"></span>
    <span class="chip on" data-src="">all</span>
    <span class="chip" data-src="telegram">telegram</span>
    <span class="chip" data-src="actions">actions</span>
    <span class="chip" data-src="n8n">n8n</span>
    <span class="chip" data-src="reports">reports</span>
    <span class="chip" data-sev="warning" id="sevchip">issues only</span>
    <span class="count" id="count"></span>
  </div>
  <div id="list"><div class="empty">loading…</div></div>
</div>
<script>
const $ = s => document.querySelector(s);
let SRC = '', SEV = '';

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function when(ts){
  if(!ts) return 'unknown';
  const t = Date.parse(ts);
  if (isNaN(t)) return esc(String(ts).slice(0,16));
  const mins = Math.round((Date.now()-t)/60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  if (mins < 1440) return Math.round(mins/60) + 'h ago';
  return new Date(t).toISOString().slice(0,10);
}

async function cap(name, args){
  const r = await fetch('/mcp/call', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name, arguments: args||{}})});
  const j = await r.json();
  return (j && j.content !== undefined) ? j.content : j;
}

async function load(){
  const c = await cap('syscomms.feed',
    {limit:120, sources:SRC, min_severity:SEV});
  const feed = (c && c.feed) || [];
  const s = (c && c.summary) || {};
  $('#count').textContent = s.total
    ? s.total + ' items · ' + (s.by_severity?.critical||0) + ' critical'
    : '';

  let html = '';
  // A source that is unavailable is stated, not silently omitted — otherwise
  // an empty pane reads as "nothing happened".
  for (const u of (c.unavailable||[]))
    html += '<div class="warnbar">source unavailable — ' + esc(u) + '</div>';

  if (!feed.length) {
    html += '<div class="empty">Nothing to show'
         + (SEV ? ' at this severity.' : '.') + '</div>';
  } else {
    for (const e of feed) {
      html += '<div class="row" onclick="this.classList.toggle(\'open\')">'
        + '<div class="sev ' + esc(e.severity) + '"></div>'
        + '<div class="meta">' + esc(when(e.ts))
        + '<br><span class="src">' + esc(e.source) + '</span></div>'
        + '<div class="body"><div class="title">' + esc(e.title) + '</div>'
        + (e.detail && e.detail !== e.title
            ? '<div class="detail">' + esc(e.detail) + '</div>' : '')
        + '</div></div>';
    }
  }
  $('#list').innerHTML = html;
}

document.querySelectorAll('.chip[data-src]').forEach(ch => {
  ch.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-src]').forEach(o =>
      o.classList.toggle('on', o === ch));
    SRC = ch.dataset.src; load();
  });
});
$('#sevchip').addEventListener('click', () => {
  SEV = SEV ? '' : 'warning';
  $('#sevchip').classList.toggle('on', !!SEV);
  load();
});

load();
// Poll only while this pane is actually showing: a hidden iframe has no box, and
// every reload runs memory.seek, which embeds the query on the CPU nodes.
function _onScreen() { return document.visibilityState === 'visible' && document.body.offsetWidth > 0; }
setInterval(() => { if (_onScreen()) load(); }, 45000);
document.addEventListener('visibilitychange', () => { if (_onScreen()) load(); });
</script>
<script src="/ui/vera-panel.js"></script>
<script src="/ui/vera-panel-bridge.js"></script>
<script src="/ui/vera-ui.js"></script>
</body>
</html>
