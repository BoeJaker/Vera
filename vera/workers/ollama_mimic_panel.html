<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vera — Ollama Mimic</title>
<style>
:root{
  --bg0:#181614;--bg1:#1f1d1a;--bg2:#272421;--bg3:#302c29;
  --border:#3a3530;--border2:#4a4540;
  --acc:#5a9e8f;--acc2:#8fb87a;--acc3:#c9955a;--gpu:#c97a5a;
  --ok:#6db87a;--err:#c96b6b;--warn:#c9a35a;
  --text:#ddd5c8;--dim:#6a6058;--dim2:#8a7e70;
  --mono:'JetBrains Mono','Fira Mono',monospace;--sans:'Inter',system-ui,sans-serif;
  --radius:5px;--radius-lg:8px;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--text);font-family:var(--sans);font-size:12px}
body{overflow-y:auto;padding:12px}
.pane-tb{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pane-tb-title{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gpu)}
.tb-sep{width:1px;height:15px;background:var(--border2)}
.status-hint{font-size:9px;color:var(--dim2);font-family:var(--mono);margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:3px;border:1px solid var(--border);background:var(--bg2);color:var(--dim2);cursor:pointer;font-size:10.5px;font-weight:500;transition:all .14s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.warn-btn{border-color:var(--warn);color:var(--warn)}
.btn.err-btn{border-color:var(--err);color:var(--err)}
.btn.sm{padding:2px 7px;font-size:9.5px}
.banner{background:var(--bg1);border:1px solid var(--border);border-left:3px solid var(--dim);border-radius:var(--radius);padding:8px 12px;font-size:10px;color:var(--dim2);font-family:var(--mono);margin-bottom:12px}
.banner.on{border-left-color:var(--ok);color:var(--text)}
.banner.paused{border-left-color:var(--warn)}
.banner.off{border-left-color:var(--err)}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:12px}
.kpi{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius-lg);padding:9px 11px}
.kpi-val{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--gpu)}
.kpi-sub{font-size:8.5px;color:var(--dim2);font-family:var(--mono);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
@media(max-width:760px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 12px;margin-bottom:14px}
.ctl label{font-size:9px;font-family:var(--mono);color:var(--dim2);text-transform:uppercase;letter-spacing:.6px}
.ctl input{background:var(--bg0);border:1px solid var(--border2);color:var(--text);padding:4px 7px;border-radius:3px;font-family:var(--mono);font-size:11px;width:64px}
.sec-title{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--dim2);text-transform:uppercase;margin:4px 0 8px}
table{width:100%;border-collapse:collapse;font-size:10px}
th{font-family:var(--mono);font-size:7.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);padding:5px 8px;text-align:left;border-bottom:1px solid var(--border);font-weight:600;position:sticky;top:0;background:var(--bg2)}
td{padding:5px 8px;border-bottom:1px solid rgba(58,53,48,.3);font-family:var(--mono);color:var(--text)}
tr:hover td{background:rgba(201,122,90,.05)}
.tbl-wrap{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.tbl-wrap .inner{max-height:420px;overflow-y:auto}
.prompt{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim2)}
.badge{font-size:7.5px;padding:1px 6px;border-radius:7px;font-family:var(--mono);font-weight:600}
.b-ok{background:rgba(109,184,122,.1);color:var(--ok);border:1px solid rgba(109,184,122,.22)}
.b-err{background:rgba(201,107,107,.1);color:var(--err);border:1px solid rgba(201,107,107,.22)}
.b-run{background:rgba(201,163,90,.1);color:var(--warn);border:1px solid rgba(201,163,90,.22)}
.empty{padding:18px;text-align:center;color:var(--dim);font-size:11px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}
</style>
</head>
<body>

<div class="pane-tb">
  <span class="pane-tb-title">OLLAMA MIMIC</span>
  <span class="tb-sep"></span>
  <button class="btn sm" onclick="M.refresh()">↻ Refresh</button>
  <button class="btn sm" id="auto-btn" onclick="M.toggleAuto()">Auto 5s</button>
  <span class="status-hint" id="ts"></span>
</div>

<div class="banner" id="banner">Loading proxy status…</div>

<div class="kpi-row">
  <div class="kpi"><div class="kpi-val" id="k-state">—</div><div class="kpi-sub">state</div></div>
  <div class="kpi"><div class="kpi-val" id="k-active">0</div><div class="kpi-sub">active</div></div>
  <div class="kpi"><div class="kpi-val" id="k-queue">0</div><div class="kpi-sub">queued</div></div>
  <div class="kpi"><div class="kpi-val" id="k-conc">0</div><div class="kpi-sub">max concurrency</div></div>
  <div class="kpi"><div class="kpi-val" id="k-log">0</div><div class="kpi-sub">logged requests</div></div>
</div>

<div class="sec-title">Controls</div>
<div class="ctl">
  <button class="btn warn-btn" id="pause-btn" onclick="M.togglePause()">Pause</button>
  <span class="tb-sep"></span>
  <label>Max concurrency</label>
  <input id="conc-input" type="number" min="1" value="3">
  <button class="btn primary" onclick="M.applyConc()">Apply</button>
  <span style="flex:1"></span>
  <button class="btn err-btn" onclick="M.clearLog()">Clear log</button>
</div>

<div class="sec-title">Prompts &amp; jobs through the mimic</div>
<div class="tbl-wrap">
  <div class="inner">
    <table>
      <thead><tr><th>Time</th><th>Model</th><th>Caller</th><th>Prompt</th><th>Elapsed</th><th>Status</th></tr></thead>
      <tbody id="log-tbody"></tbody>
    </table>
    <div class="empty" id="log-empty" style="display:none">No requests logged yet. Point an Ollama client at <code>/ollama</code> on this host, or run a capability that calls the cluster.</div>
  </div>
</div>

<script>
'use strict';
const M = (function(){
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = n => (n||0).toLocaleString();
let _paused=false, _timer=null, _auto=true;

async function api(path, method='GET', body=null){
  const opts={method, headers:{'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(path, opts); return r.json();
}

async function refresh(){
  $('ts').textContent='…';
  try{
    const s=await api('/cluster/mimic/status');
    _paused=!!s.paused;
    const banner=$('banner');
    if(!s.mounted){
      banner.className='banner off';
      banner.innerHTML='⛔ Mimic proxy <b>not mounted</b> — set the <code>LOCAL_OLLAMA_INSTANCE</code> env var (e.g. <code>gpu-250</code>) and restart Vera to expose <code>/ollama/*</code>.';
      $('k-state').textContent='off'; $('k-state').style.color='var(--err)';
    }else if(_paused){
      banner.className='banner paused';
      banner.innerHTML='⏸ Mimic proxy is <b>paused</b> — incoming <code>/ollama/*</code> requests get 503. Targeting <b>'+esc(s.local_instance)+'</b>.';
      $('k-state').textContent='paused'; $('k-state').style.color='var(--warn)';
    }else{
      banner.className='banner on';
      banner.innerHTML='✓ Mimic proxy <b>active</b> on <code>/ollama/*</code> → <b>'+esc(s.local_instance)+'</b>. Clients use this host instead of :11434; every prompt is logged below.';
      $('k-state').textContent='active'; $('k-state').style.color='var(--ok)';
    }
    $('k-active').textContent=fmt(s.active);
    $('k-queue').textContent=fmt(s.queue_depth)+' / '+fmt(s.queue_max);
    $('k-conc').textContent=fmt(s.max_concurrency);
    const pb=$('pause-btn');
    pb.textContent=_paused?'Resume':'Pause';
    pb.className='btn '+(_paused?'primary':'warn-btn');
    if(document.activeElement!==$('conc-input')) $('conc-input').value=s.max_concurrency;
  }catch(e){ $('banner').className='banner off'; $('banner').textContent='Error: '+e.message; }
  await loadLog();
  $('ts').textContent='updated '+new Date().toLocaleTimeString();
}

async function loadLog(){
  try{
    const j=await api('/cluster/mimic/requests?limit=100');
    $('k-log').textContent=fmt(j.total||0);
    const rows=j.entries||[];
    $('log-empty').style.display=rows.length?'none':'block';
    $('log-tbody').innerHTML=rows.map(r=>{
      const st=(r.status||'').toLowerCase();
      const cls=st==='ok'||st==='done'?'b-ok':(st==='error'||st==='timeout'?'b-err':'b-run');
      const t=(r.ts||'').replace('T',' ').slice(11,19);
      const el=r.elapsed_s!=null?r.elapsed_s+'s':(r.duration!=null?r.duration+'s':'…');
      return `<tr>
        <td>${esc(t)}</td>
        <td>${esc(r.model||'')}</td>
        <td>${esc(r.caller_file||r.caller||'')}</td>
        <td class="prompt" title="${esc(r.prompt_preview||r.prompt||'')}">${esc(r.prompt_preview||r.prompt||'')}</td>
        <td>${esc(el)}</td>
        <td><span class="badge ${cls}">${esc(r.status||'?')}</span></td>
      </tr>`;}).join('');
  }catch(e){ /* leave */ }
}

async function togglePause(){
  await api('/cluster/mimic/config','POST',{paused:!_paused});
  refresh();
}
async function applyConc(){
  const v=parseInt($('conc-input').value)||1;
  await api('/cluster/mimic/config','POST',{max_concurrency:v});
  refresh();
}
async function clearLog(){
  if(!confirm('Clear the Ollama request log?')) return;
  await api('/cluster/mimic/requests/clear','POST',{});
  refresh();
}
function toggleAuto(){
  _auto=!_auto;
  $('auto-btn').textContent=_auto?'Auto 5s':'Auto off';
  $('auto-btn').style.color=_auto?'var(--acc)':'var(--dim2)';
  if(_timer){clearInterval(_timer);_timer=null;}
  if(_auto) _timer=setInterval(refresh,5000);
}

window.addEventListener('DOMContentLoaded', ()=>{ refresh(); _timer=setInterval(refresh,5000); });
return { refresh, togglePause, applyConc, clearLog, toggleAuto };
})();
</script>
</body>
</html>
