<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vera — Tests</title>
<script>/* vera theme boot — paint cached theme before CSS parses, avoids flash */
(function(){try{var d=document.documentElement,S=window.localStorage;
var t=S.getItem('vera:ui:theme');if(t)d.setAttribute('data-theme',t);
var v=JSON.parse(S.getItem('vera:ui:themeVars')||'null');
if(v)for(var k in v)d.style.setProperty(k,v[k]);}catch(e){}})();</script>
<style>
:root{
  --bg0:#181614;--bg1:#1f1d1a;--bg2:#272421;--bg3:#302c29;
  --border:#3a3530;--border2:#4a4540;
  --acc:#5a9e8f;--acc2:#8fb87a;--acc3:#c9955a;--acc4:#b98adf;
  --ok:#6db87a;--err:#c96b6b;--warn:#c9a35a;
  --text:#ddd5c8;--fg2:#b8ad9e;--dim:#6a6058;--dim2:#8a7e70;
  --mono:'JetBrains Mono','Fira Mono',monospace;--sans:'Inter',system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--text);font-family:var(--sans);font-size:12px}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--bg1);flex-wrap:wrap}
header h1{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:2px;color:var(--acc)}
header .sub{font-size:10px;color:var(--dim2)}
.flex{flex:1}
main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:1100px;width:100%;margin:0 auto}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:8px;padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.card.h-failed,.card.h-interrupted,.card.h-missed{border-color:color-mix(in srgb,var(--err) 55%,var(--border))}
.card.h-recovering,.card.h-never{border-color:color-mix(in srgb,var(--warn) 50%,var(--border))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.name{font-weight:600;font-size:12.5px}
.pkg{font-family:var(--mono);font-size:10px;color:var(--dim2)}
.badge{font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:9px;background:var(--bg3);color:var(--fg2);text-transform:uppercase;letter-spacing:.4px}
.b-ok{background:color-mix(in srgb,var(--ok) 22%,var(--bg2));color:var(--ok)}
.b-running{background:color-mix(in srgb,var(--acc) 22%,var(--bg2));color:var(--acc)}
.b-failed,.b-interrupted,.b-missed{background:color-mix(in srgb,var(--err) 22%,var(--bg2));color:var(--err)}
.b-recovering,.b-never{background:color-mix(in srgb,var(--warn) 22%,var(--bg2));color:var(--warn)}
.b-disabled,.b-scheduled{background:var(--bg3);color:var(--dim2)}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;font-weight:500;color:var(--dim2);font-size:10px;padding:3px 6px;border-bottom:1px solid var(--border)}
td{padding:3px 6px;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent);vertical-align:top}
td.m{font-family:var(--mono);font-size:10.5px;white-space:nowrap}
.flag{font-family:var(--mono);font-size:9.5px;color:var(--acc2);margin-right:4px}
.head{display:grid;grid-template-columns:max-content 1fr;gap:2px 10px;font-size:11px}
.head .k{color:var(--dim2);font-family:var(--mono);font-size:10.5px}
.head .v{font-family:var(--mono);font-size:10.5px;word-break:break-word}
details summary{cursor:pointer;color:var(--dim2);font-size:10.5px}
.empty{color:var(--dim);font-style:italic}
.err{color:var(--err);font-size:11px}
.scroll{overflow-x:auto}
@media (max-width:640px){main{padding:10px}.hide-sm{display:none}}
</style>
</head>
<body>
<header>
  <h1>TESTS</h1>
  <span class="sub">four-minds · every test on the Loop Lab schedule · health, last runs, what each found</span>
  <span class="flex"></span>
  <span id="counts" class="row"></span>
  <span id="when" class="sub"></span>
</header>
<main id="main"><div class="empty">loading…</div></main>
<script>
(function(){
  const BASE=(window._veraBase||'').replace(/\/$/,'');
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const t=s=>{if(!s)return '—';const d=new Date(s);if(isNaN(d))return esc(s);
    return d.toLocaleString([], {weekday:'short',hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short'});};
  const badge=h=>`<span class="badge b-${esc(h)}">${esc(h)}</span>`;
  function headline(h){
    if(!h) return '';
    const rows=Object.entries(h).filter(([k,v])=>v!==null&&v!==undefined&&v!==''&&!(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length));
    if(!rows.length) return '';
    return '<div class="head">'+rows.map(([k,v])=>`<span class="k">${esc(k)}</span><span class="v">${esc(typeof v==='object'?JSON.stringify(v):v)}</span>`).join('')+'</div>';
  }
  function card(x){
    const ents=(x.entries||[]).map(e=>`<tr><td>${esc(e.title||e.id)}<div class="pkg">${esc(e.when)}</div></td>
      <td class="m">${t(e.next)}</td><td class="m">${t(e.last_started_at)}</td><td class="m">${esc(e.last_result||'—')}</td>
      <td>${badge(e.health)}</td><td class="hide-sm">${e.recover?'<span class="flag">recover</span>':''}${e.protect?'<span class="flag">protect</span>':''}${e.recover_due?'<span class="flag" style="color:var(--warn)">recovery due</span>':''}</td></tr>`).join('');
    const runs=(x.runs||[]).map(r=>`<tr><td class="m">${t(r.started_at)}</td><td class="m">${r.finished_at?t(r.finished_at):'running'}</td>
      <td class="m">${esc(r.result||'')}</td><td>${esc(r.detail||'')}</td></tr>`).join('');
    return `<div class="card h-${esc(x.health)}">
      <div class="row"><span class="name">${esc(x.name)}</span><span class="pkg">${esc(x.package)}</span>${badge(x.health)}
        ${x.report?`<span class="pkg">report: ${esc(x.report)}</span>`:''}</div>
      ${ents?`<div class="scroll"><table><tr><th>entry</th><th>next</th><th>last start</th><th>last result</th><th>health</th><th class="hide-sm"></th></tr>${ents}</table></div>`:'<div class="empty">no schedule entry</div>'}
      ${headline(x.headline)}
      ${runs?`<details><summary>last runs</summary><div class="scroll"><table><tr><th>started</th><th>finished</th><th>result</th><th>detail</th></tr>${runs}</table></div></details>`:''}
    </div>`;
  }
  const ORDER=['failed','interrupted','missed','recovering','running','never','ok','scheduled','disabled'];
  async function load(){
    let d;
    try{
      const r=await fetch(BASE+'/mcp/call',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:'decide.tests.status',arguments:{}})});
      const j=await r.json(); d=(j&&j.type==='tool_result')?j.content:j;
    }catch(e){ document.getElementById('main').innerHTML=`<div class="err">could not load: ${esc(e)}</div>`; return; }
    if(!d||!Array.isArray(d.tests)){ document.getElementById('main').innerHTML=`<div class="err">${esc((d&&d.error)||'no data')}</div>`; return; }
    const tests=d.tests.slice().sort((a,b)=>ORDER.indexOf(a.health)-ORDER.indexOf(b.health));
    document.getElementById('main').innerHTML=(d.error?`<div class="err">${esc(d.error)}</div>`:'')+tests.map(card).join('');
    document.getElementById('counts').innerHTML=Object.entries(d.counts||{}).sort((a,b)=>ORDER.indexOf(a[0])-ORDER.indexOf(b[0]))
      .map(([h,n])=>`${badge(h)}<span class="pkg">${n}</span>`).join(' ');
    document.getElementById('when').textContent='at '+t(d.at)+(d.headlines_at?' · findings '+t(d.headlines_at):'');
  }
  load(); setInterval(load,60000);
})();
</script>
</body>
</html>
