<!DOCTYPE html>
<html lang="en" data-theme="ash">
<head>
  <script>/* vera theme boot — paint cached theme before CSS parses, avoids flash */
  (function(){try{var d=document.documentElement,S=window.localStorage;
  var t=S.getItem('vera:ui:theme');if(t)d.setAttribute('data-theme',t);
  var v=JSON.parse(S.getItem('vera:ui:themeVars')||'null');
  if(v)for(var k in v)d.style.setProperty(k,v[k]);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vera / Notebooks</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/shell/shell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/yaml/yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/rust/rust.min.js"></script>
<style>
/* ── Themes ──────────────────────────────────────────────────────────────── */
[data-theme="ash"]  {--bg:#f0ede8;--s1:#e8e5df;--s2:#dedbd4;--s3:#d4d1c8;--bd:rgba(0,0,0,.08);--bd2:rgba(0,0,0,.15);--t1:#1a1a18;--t2:#6a6860;--t3:#a8a69e;--ac:#2e6da4;--ac2:#228060;--ac3:#c47020;--ac4:#c03030;--ac5:#6040a0}
[data-theme="dusk"] {--bg:#0e0f12;--s1:#13151a;--s2:#1a1d24;--s3:#222630;--bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.14);--t1:#d4dae4;--t2:#6b7585;--t3:#3b4252;--ac:#6ea8d8;--ac2:#5ec9a0;--ac3:#e09a55;--ac4:#e06060;--ac5:#a78bfa}
[data-theme="void"] {--bg:#000;--s1:#070707;--s2:#0d0d0d;--s3:#141414;--bd:rgba(255,255,255,.05);--bd2:rgba(255,255,255,.1);--t1:#e0e0e0;--t2:#484848;--t3:#282828;--ac:#9b8dfa;--ac2:#5ecab0;--ac3:#dba355;--ac4:#e06060;--ac5:#f472b6}
[data-theme="chalk"]{--bg:#1c1c1e;--s1:#242428;--s2:#2c2c32;--s3:#34343c;--bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.16);--t1:#e8e4d8;--t2:#7a7468;--t3:#3a3830;--ac:#d4a96a;--ac2:#80c090;--ac3:#c08878;--ac4:#e07070;--ac5:#9080c0}
[data-theme="ice"]  {--bg:#090f18;--s1:#0d1620;--s2:#121e2c;--s3:#182638;--bd:rgba(80,160,255,.1);--bd2:rgba(80,160,255,.2);--t1:#c0d8f0;--t2:#406880;--t3:#1e3850;--ac:#5ab0f0;--ac2:#38d0b0;--ac3:#e0b060;--ac4:#e06868;--ac5:#8070e0}

/* ── Reset ───────────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t1);font:13px/1.5 'ui-monospace','SFMono-Regular','Menlo',monospace;overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}

#rainbow{height:3px;background:linear-gradient(90deg,#e03030 0%,#e06020 12%,#e0a020 24%,#50a830 36%,#2080c8 50%,#5040c0 62%,#9030a0 74%,#c02870 86%,#e03030 100%);opacity:.75;flex-shrink:0}
#shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── Topbar ──────────────────────────────────────────────────────────────── */
#topbar{height:44px;background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0}
.tb-logo{color:var(--ac);font-weight:500;font-size:13px;letter-spacing:.05em;cursor:pointer;white-space:nowrap}
.tb-sep{width:1px;height:20px;background:var(--bd)}
#nb-title-input{flex:1;font-size:14px;font-weight:500;color:var(--t1);min-width:60px}
#nb-title-input::placeholder{color:var(--t3)}
.tbtn{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;font-size:11px;color:var(--t2);transition:.12s;border:1px solid transparent;white-space:nowrap}
.tbtn:hover{background:var(--bd);color:var(--t1)}
.tbtn.primary{background:var(--ac);color:#fff;border-color:var(--ac)}
.tbtn.primary:hover{opacity:.85}
.tbtn.on{border-color:var(--ac);color:var(--ac)}
.tbtn svg{width:13px;height:13px;flex-shrink:0}
#theme-sel{background:var(--s2);border:1px solid var(--bd);border-radius:5px;padding:3px 7px;font-size:11px;color:var(--t2)}
.conn-dot{width:7px;height:7px;border-radius:50%;background:var(--t3);flex-shrink:0}
.conn-dot.ok{background:var(--ac2)}
.conn-dot.bad{background:var(--ac4)}

/* ── Body layout ─────────────────────────────────────────────────────────── */
#body{display:grid;grid-template-columns:210px 168px 1fr;flex:1;overflow:hidden;min-height:0;transition:grid-template-columns .18s}
#body.drawer-open{grid-template-columns:210px 168px 1fr 320px}
#body.sidebar-collapsed{grid-template-columns:0 168px 1fr}

/* ── Sidebar — notebook list ─────────────────────────────────────────────── */
#sidebar{background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
/* Embed / focus mode — a single notebook with no notebook-list chrome. */
html.nb-embed #sidebar{display:none}
#sidebar-head{padding:9px 11px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:7px;flex-shrink:0}
#sidebar-head span{font-size:10px;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;flex:1}
#nb-search{padding:6px 11px;border-bottom:1px solid var(--bd)}
#nb-search input{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:5px;padding:4px 8px;font-size:11px;color:var(--t1)}
.nb-list{flex:1;overflow-y:auto;padding:6px}
.nb-item{padding:7px 9px;border-radius:6px;cursor:pointer;transition:.1s;border:1px solid transparent;margin-bottom:3px}
.nb-item:hover{background:var(--s2);border-color:var(--bd)}
.nb-item.active{background:var(--s2);border-color:var(--ac)}
.nb-item-title{font-size:12px;color:var(--t1);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-item-meta{font-size:10px;color:var(--t3);margin-top:2px}

/* ── Pages sidebar ───────────────────────────────────────────────────────── */
#pages-sidebar{border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;background:var(--s1)}
#pages-head{height:34px;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 8px;gap:5px;flex-shrink:0}
#pages-head span{font-size:10px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;flex:1}
#pages-list{flex:1;overflow-y:auto;padding:5px}
.page-item{padding:5px 8px;border-radius:5px;cursor:pointer;border:1px solid transparent;margin-bottom:2px;display:flex;align-items:center;gap:5px}
.page-item:hover{background:var(--s2);border-color:var(--bd)}
.page-item.active{background:var(--s2);border-color:var(--ac)}
.page-item-title{font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t2)}
.page-item input{font:inherit;font-size:12px;color:var(--t1);flex:1;min-width:0}
.page-del{opacity:0;color:var(--ac4);font-size:11px;padding:0 2px;cursor:pointer}
.page-item:hover .page-del{opacity:1}
.icon-btn{width:20px;height:20px;border-radius:4px;background:var(--s2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--t2);cursor:pointer;flex-shrink:0}
.icon-btn:hover{color:var(--ac);border-color:var(--ac)}
.icon-btn svg{width:11px;height:11px}
.layout-toggle{display:flex;gap:2px}
.layout-toggle button{font-size:9px;width:22px;height:20px;border-radius:3px;border:1px solid var(--bd);background:var(--s2);color:var(--t3)}
.layout-toggle button.active{border-color:var(--ac);color:var(--ac)}

/* ── Editor ──────────────────────────────────────────────────────────────── */
#editor{display:flex;flex-direction:column;overflow:hidden;min-height:0;flex:1}
#cell-scroll{flex:1;overflow-y:auto;padding:18px 0;min-height:0}
#cells-container{max-width:900px;margin:0 auto;padding:0 20px}
#cells-container.canvas{max-width:none;padding:0}
#cells-list.canvas-grid{position:relative;min-height:800px}

/* Doc view */
#doc-view{flex:1;overflow-y:auto;min-height:0;display:none;flex-direction:column}
#doc-view-content h2{font-size:1.45em;font-weight:600;margin:1.6em 0 .5em}
#doc-view-content h3{font-size:1.15em;font-weight:600;margin:1.3em 0 .4em;color:var(--t2)}
#doc-view-content p{margin:.65em 0}
#doc-view-content ul,#doc-view-content ol{margin:.5em 0 .5em 1.5em}
#doc-view-content strong{color:var(--t1);font-weight:600}
#doc-view-content a{color:var(--ac)}
#doc-view-content code{font:inherit;font-size:12px;background:var(--s2);border:1px solid var(--bd);border-radius:4px;padding:1px 5px;color:var(--ac)}
#doc-view-content pre{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:13px;overflow-x:auto;font-size:12px;margin:1em 0}
.doc-section{margin-bottom:2.4em}
.doc-section+.doc-section{border-top:1px solid var(--bd);padding-top:2em}

/* ── Cell ────────────────────────────────────────────────────────────────── */
.cell{position:relative;margin-bottom:10px;border-radius:9px;border:1px solid var(--bd);transition:border-color .15s,box-shadow .15s;background:var(--s1)}
.cell:hover{border-color:var(--bd2)}
.cell.focused{border-color:var(--ac)}
.cell.generating{border-color:var(--ac3);animation:cellpulse 1.2s ease-in-out infinite}
.cell.running{border-color:var(--ac2)}
@keyframes cellpulse{0%,100%{border-color:var(--ac3)}50%{border-color:rgba(196,112,32,.3)}}
.canvas-grid .cell{position:absolute;margin:0;overflow:hidden;display:flex;flex-direction:column}

.cell-head{display:flex;align-items:center;gap:6px;padding:5px 9px;border-bottom:1px solid var(--bd);background:var(--s2);border-radius:8px 8px 0 0}
.cell-kind{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);display:flex;align-items:center;gap:4px}
.cell-kind svg{width:11px;height:11px}
.cell-title-input{font-size:11px;font-weight:500;color:var(--t2);flex:1;min-width:0;padding:1px 0}
.cell-title-input::placeholder{color:var(--t3)}
.cell-title-input:focus{color:var(--t1)}
.cell-head .drag-handle{cursor:grab;color:var(--t3);padding:0 2px}
.cell-head .drag-handle:active{cursor:grabbing}
.cell-sel{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--s3);border:1px solid var(--bd);color:var(--t2)}
.cell-btn{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--t3);transition:.1s;flex-shrink:0}
.cell-btn:hover{background:var(--bd);color:var(--t1)}
.cell-btn.run{color:var(--ac2)}
.cell-btn.run:hover{background:rgba(34,128,96,.12)}
.cell-btn.stop{color:var(--ac4)}
.cell-btn svg{width:12px;height:12px}
.cell-body{padding:0}
.canvas-grid .cell-body{flex:1;overflow:auto}

.cell-input{padding:9px 12px}
.cell-input textarea{width:100%;color:var(--t1);resize:none;font-size:13px;line-height:1.6;font-family:inherit;min-height:38px}
.cell-input textarea::placeholder{color:var(--t3)}

.cell-code .CodeMirror{background:var(--s2)!important;border:none;font-size:12px;line-height:1.6;min-height:56px;max-height:560px}
.cell-code .CodeMirror-scroll{padding:8px 12px}
[data-theme="ash"] .cell-code .CodeMirror{background:#f8f6f0!important;color:#1a1a18!important}

/* Exec output */
.cell-exec-out{border-top:1px solid var(--bd);background:#0c0d10;color:#cdd3dc;font-size:11.5px;line-height:1.5;font-family:'ui-monospace',monospace;padding:9px 12px;max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word;display:none}
.cell-exec-out.show{display:block}
.cell-exec-out .o-err{color:#e88}
.cell-exec-out .o-info{color:#7aa7d0}
.cell-exec-out .o-ok{color:#7ec99b}

/* Generated output */
.cell-generated{border-top:1px solid var(--bd);padding:11px 13px;background:var(--bg)}
.cell-generated-label{font-size:9px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.cell-generated-label .gen-actions{display:flex;gap:4px;margin-left:auto}
.gen-action-btn{font-size:10px;padding:1px 7px;border-radius:4px;background:var(--s2);border:1px solid var(--bd);color:var(--t2);transition:.1s}
.gen-action-btn:hover{border-color:var(--bd2);color:var(--t1)}
.gen-content{font-size:13px;line-height:1.7;color:var(--t2)}
.gen-content h1{font-size:16px;color:var(--t1);margin:.8em 0 .3em}
.gen-content h2{font-size:14px;color:var(--t1);margin:.7em 0 .3em}
.gen-content h3{font-size:13px;color:var(--t2);margin:.6em 0 .2em}
.gen-content p{margin:.3em 0}
.gen-content ul,.gen-content ol{margin:.3em 0;padding-left:1.4em}
.gen-content strong{color:var(--t1)}
.gen-content a{color:var(--ac)}
.gen-content code{font:inherit;font-size:12px;background:var(--s2);border:1px solid var(--bd);border-radius:3px;padding:1px 4px;color:var(--ac)}
.gen-content pre{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:10px 12px;overflow-x:auto;margin:.6em 0;font-size:12px}
.gen-content pre code{background:none;border:none;padding:0;color:var(--t1)}
.gen-cursor{display:inline-block;width:2px;height:13px;background:var(--ac);margin-left:2px;vertical-align:middle;animation:blink .7s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Mermaid / illustrate / image / embed */
.cell-render{padding:8px 10px;background:var(--bg);border-top:1px solid var(--bd)}
.cell-render vera-mermaid{display:block;width:100%;min-height:80px}
.cell-render img{max-width:100%;border-radius:6px;display:block}
.cell-embed{border-top:1px solid var(--bd);background:var(--bg);position:relative}
.cell-embed iframe{width:100%;border:none;display:block;background:var(--s1)}
.cell-embed-bar{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--s2);border-top:1px solid var(--bd);font-size:10px;color:var(--t3)}
.iframe-html{width:100%;border:none;background:#fff;border-radius:6px;min-height:220px}
.cell-image-drop{border:2px dashed var(--bd2);border-radius:6px;padding:16px;text-align:center;font-size:11px;color:var(--t3);margin:8px;cursor:pointer}
.cell-image-drop.dragover{border-color:var(--ac);color:var(--ac)}
.cell-mini-input{width:100%;background:var(--s3);border:1px solid var(--bd);border-radius:5px;padding:5px 8px;font-size:11px;color:var(--t1);margin-bottom:6px}

/* Thread */
.cell-thread{border-top:1px solid var(--bd);background:var(--bg)}
.thread-toggle{display:flex;align-items:center;gap:6px;padding:6px 13px;cursor:pointer;font-size:10px;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;user-select:none}
.thread-toggle:hover{color:var(--t2)}
.thread-toggle svg{width:10px;height:10px;transition:.15s}
.thread-toggle.open svg{transform:rotate(90deg)}
.thread-messages{display:none;padding:9px 13px;border-top:1px solid var(--bd)}
.thread-toggle.open + .thread-messages{display:flex;flex-direction:column;gap:8px}
.thread-msg-role{font-size:9px;color:var(--t3);letter-spacing:.07em;text-transform:uppercase}
.thread-msg-role.user{color:var(--ac)}
.thread-msg-content{font-size:12px;color:var(--t2);line-height:1.55;background:var(--s1);border-radius:5px;padding:7px 10px}
.thread-input-row{display:flex;gap:7px;margin-top:6px;border-top:1px solid var(--bd);padding-top:8px}
.thread-input{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--t1);resize:none;min-height:32px;max-height:100px}
.thread-send{width:28px;height:28px;border-radius:5px;background:var(--ac);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;align-self:flex-end}
.thread-send svg{width:11px;height:11px}
.thread-mode-sel{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--s2);border:1px solid var(--bd);color:var(--t2);align-self:flex-end}

/* Add-cell bar / block menu */
.add-cell-row{display:flex;align-items:center;gap:8px;padding:5px 0;opacity:.35;transition:opacity .15s}
.add-cell-row:hover{opacity:1}
.add-cell-line{flex:1;height:1px;background:var(--bd)}
.add-cell-btn{font-size:10px;padding:3px 12px;border-radius:14px;background:var(--s2);border:1px solid var(--bd);color:var(--t2);display:flex;align-items:center;gap:5px}
.add-cell-btn:hover{border-color:var(--ac);color:var(--ac)}
.add-cell-btn svg{width:11px;height:11px}

/* Popovers / menus */
.pop{position:fixed;z-index:900;background:var(--s1);border:1px solid var(--bd2);border-radius:9px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:6px;display:none;min-width:220px;max-height:70vh;overflow-y:auto}
.pop.show{display:block}
.pop-title{font-size:9px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px 3px}
.pop-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--t1)}
.pop-item:hover,.pop-item.sel{background:var(--s2)}
.pop-item .pi-ico{width:20px;text-align:center;color:var(--ac)}
.pop-item .pi-desc{font-size:10px;color:var(--t3)}
.pop-item .pi-main{flex:1;min-width:0}

/* Command palette */
#palette{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
#palette.show{display:flex}
#palette-box{width:min(560px,92vw);background:var(--s1);border:1px solid var(--bd2);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.45);overflow:hidden}
#palette-input{width:100%;padding:14px 16px;font-size:14px;color:var(--t1);border-bottom:1px solid var(--bd);background:var(--s2)}
#palette-results{max-height:52vh;overflow-y:auto;padding:6px}

/* Settings popover */
#settings-pop .sr{display:flex;flex-direction:column;gap:3px;padding:6px 8px}
#settings-pop label{font-size:10px;color:var(--t3)}
#settings-pop input{background:var(--s2);border:1px solid var(--bd);border-radius:5px;padding:5px 8px;font-size:11px;color:var(--t1)}

/* Sources drawer */
#drawer{background:var(--s1);border-left:1px solid var(--bd);display:none;flex-direction:column;overflow:hidden}
#body.drawer-open #drawer{display:flex}
#drawer-head{height:40px;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--bd);flex-shrink:0}
#drawer-head span{flex:1;font-size:11px;color:var(--ac);font-weight:500}
.drawer-tabs{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0}
.drawer-tab{flex:1;padding:7px 4px;font-size:10px;color:var(--t3);border-bottom:2px solid transparent;text-align:center}
.drawer-tab.active{color:var(--ac);border-bottom-color:var(--ac)}
#drawer-search{padding:7px 9px;border-bottom:1px solid var(--bd)}
#drawer-search input,#drawer-ds{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:5px;padding:5px 8px;font-size:11px;color:var(--t1)}
#drawer-ds{margin-top:5px}

<script>
/* ══════════════════════════════════════════════════════════════════════════
   Base URL resolution — two bases:
     NB_API : researcher_api (notebook CRUD + per-cell WS)
     ORCH   : capability orchestrator (fabric / memory / entity / panels / exec)
   Embedded in the harness → both = parent._veraBase (which proxies both).
   Standalone → both default to this page's origin; overridable in settings.
   (No more hardcoded researcher_api port — that was why standalone loads failed.)
══════════════════════════════════════════════════════════════════════════ */
let EMBEDDED = false, PARENT_BASE = '';
try { if (window.parent !== window && window.parent._veraBase) { EMBEDDED = true; PARENT_BASE = String(window.parent._veraBase).replace(/\/$/, ''); } } catch(e){}
const _ORIGIN = location.origin.replace(/\/$/, '');
// A saved base is only trustworthy if it isn't a stale standalone :8765 base
// (dead in Vera mode → 404) or an http:// base on an https:// page (mixed-
// content-blocked). Otherwise fall back to the harness base / this origin.
function _nbBase(key){
  const fb = PARENT_BASE || _ORIGIN;
  const v = (localStorage.getItem(key) || '').replace(/\/$/, '');
  if(!v) return fb;
  try{
    const u = new URL(v);
    if(location.protocol==='https:' && u.protocol==='http:') return fb;   // mixed-content
    if(u.port==='8765' && location.port!=='8765') return fb;              // dead standalone port
    return v;
  }catch(_){ return fb; }
}
let NB_API = _nbBase('nb:base:api');
let ORCH   = _nbBase('nb:base:orch');
const WS_BASE = () => NB_API.replace(/^http/, 'ws');

let currentNb = null, cells = [], editors = {}, cellWS = {}, execRuns = {};
let currentPage = null, nbPages = [], _nbAll = [];
let _sessionCits = [];

/* ── fetch helpers ─────────────────────────────────────────────────────── */
async function nbJson(path, opts){ const r = await fetch(NB_API + path, opts); if(!r.ok) throw new Error(r.status+' '+path); return r.json(); }
async function nbPost(path, body){ return nbJson(path, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}); }
async function nbPatch(path, body){ return nbJson(path, {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}); }
async function nbDelete(path){ return fetch(NB_API + path, {method:'DELETE'}); }
async function orchJson(path){ const r = await fetch(ORCH + path); return r.json(); }
async function orchPost(path, body){ const r = await fetch(ORCH + path, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}); return r.json(); }

/* ══════════════════════════════════════════════════════════════════════════
   Cell type registry — pluggable. Each entry drives the block menu, slash
   commands, and rendering. `render(cell)` returns the body HTML; `init(cell)`
   runs after insertion; `runnable` shows a ▶ button wired to run(cell).
══════════════════════════════════════════════════════════════════════════ */
const LANGS = ['python','javascript','typescript','bash','shell','sql','json','yaml','html','css','rust','go','java','cpp','text'];

const CELL_TYPES = {
  markdown:  {label:'Text',      icon:'¶',  group:'write',  desc:'Markdown / notes'},
  ai:        {label:'AI write',  icon:'✦',  group:'write',  desc:'Note → AI fleshes it out', tag:'flesh_out'},
  research:  {label:'Research',  icon:'⊕',  group:'write',  desc:'Investigate a question live', tag:'research'},
  code:      {label:'Code',      icon:'{}', group:'run',    desc:'Executable code cell'},
  mermaid:   {label:'Mermaid',   icon:'◇',  group:'render', desc:'Diagram from mermaid source'},
  illustrate:{label:'Illustrate',icon:'▤',  group:'render', desc:'AI-generated HTML/SVG diagram'},
  'image-gen':{label:'Image gen',icon:'✷',  group:'render', desc:'Generate an image (SD)'},
  image:     {label:'Image',     icon:'▣',  group:'render', desc:'Paste / drop / URL image'},
  object:    {label:'Object',    icon:'⚙',  group:'embed',  desc:'Embed & run a DAG / dream / ML'},
  panel:     {label:'Panel',     icon:'▥',  group:'embed',  desc:'Embed any Vera panel / widget'},
};
const OBJECT_KINDS = {
  dream:  {label:'Dream',           route:'/dream/panel'},
  ml:     {label:'ML Lab',          route:'/ml/panel'},
  graph:  {label:'Knowledge Graph', route:'/memgraph/panel'},
  fabric: {label:'Data Fabric',     route:'/fabric/panel'},
  exec:   {label:'Execution',       route:'/exec/panel'},
};

/* ══════════════════════════════════════════════════════════════════════════
   Init
══════════════════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  setTheme(localStorage.getItem('theme') || 'ash', false);
  loadNotebooks();
  const _qs = new URLSearchParams(location.search);
  const nbId = _qs.get('nb');
  // Embed / focus mode (used by the Workspaces "notebook" widget): show just
  // ONE notebook — hide the notebook-list sidebar and the "new notebook" chrome
  // so the tile is a single notebook, not the whole notebook UI.
  if (_qs.get('embed') === '1' || _qs.get('focus') === '1') {
    document.documentElement.classList.add('nb-embed');
  }
  if (nbId) openNotebook(nbId);
  document.addEventListener('keydown', globalKeys);
  // load the mermaid element (served by the orchestrator)
  loadScriptOnce(ORCH + '/ui/elements/vera_mermaid.js');
});

function loadScriptOnce(src){ if(document.querySelector('script[data-src="'+src+'"]'))return; const s=document.createElement('script'); s.src=src; s.dataset.src=src; s.onerror=()=>{}; document.head.appendChild(s); }

function globalKeys(e){
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); }
  if (e.key==='Escape'){ closePalette(); closeAllPops(); }
}

/* ══════════════════════════════════════════════════════════════════════════
   Theme
══════════════════════════════════════════════════════════════════════════ */
function setTheme(t, save=true){
  document.documentElement.setAttribute('data-theme', t);
  const sel=document.getElementById('theme-sel'); if(sel) sel.value=t;
  if (save) localStorage.setItem('theme', t);
  Object.values(editors).forEach(cm => { try{ cm.setOption('theme', t==='ash'?'default':'dracula'); }catch(e){} });
}

/* ══════════════════════════════════════════════════════════════════════════
   Settings popover (base URLs)
══════════════════════════════════════════════════════════════════════════ */
function openSettings(ev){
  const pop=document.getElementById('settings-pop');
  pop.innerHTML = `
    <div class="pop-title">Backend connection ${EMBEDDED?'(embedded — auto)':'(standalone)'}</div>
    <div class="sr"><label>Notebook API (researcher_api)</label><input id="set-nb" value="${esc(NB_API)}"></div>
    <div class="sr"><label>Orchestrator (fabric / memory / panels)</label><input id="set-orch" value="${esc(ORCH)}"></div>
    <div style="display:flex;gap:6px;padding:8px">
      <button class="tbtn primary" style="flex:1" onclick="saveSettings()">Save & reload</button>
      <button class="tbtn" onclick="resetSettings()">Reset</button>
    </div>
    <div style="font-size:9.5px;color:var(--t3);padding:0 8px 6px">Origin: ${esc(_ORIGIN)}</div>`;
  showPopAt(pop, ev);
}
function saveSettings(){
  localStorage.setItem('nb:base:api', document.getElementById('set-nb').value.trim());
  localStorage.setItem('nb:base:orch', document.getElementById('set-orch').value.trim());
  location.reload();
}
function resetSettings(){ localStorage.removeItem('nb:base:api'); localStorage.removeItem('nb:base:orch'); location.reload(); }

function showPopAt(pop, ev){
  closeAllPops(); pop.classList.add('show');
  const x = ev ? Math.min(ev.clientX, innerWidth-260) : innerWidth-280;
  const y = ev ? Math.min(ev.clientY+8, innerHeight-40) : 52;
  pop.style.left = Math.max(8,x)+'px'; pop.style.top = y+'px';
  setTimeout(()=>document.addEventListener('mousedown', popOutside), 0);
}
function popOutside(e){ if(!e.target.closest('.pop')){ closeAllPops(); document.removeEventListener('mousedown', popOutside); } }
function closeAllPops(){ document.querySelectorAll('.pop.show').forEach(p=>p.classList.remove('show')); }

/* ══════════════════════════════════════════════════════════════════════════
   Notebook list
══════════════════════════════════════════════════════════════════════════ */
async function loadNotebooks(){
  const dot=document.getElementById('conn-dot');
  try {
    _nbAll = await nbJson('/api/notebooks');
    if(dot){ dot.classList.add('ok'); dot.classList.remove('bad'); }
    renderNbList(_nbAll);
  } catch(e){ if(dot){ dot.classList.add('bad'); } console.error(e);
    document.getElementById('nb-list').innerHTML='<div class="src-empty">Backend unreachable.<br>Check ⚙ settings.</div>'; }
}
function filterNotebooks(q){
  q=(q||'').toLowerCase();
  renderNbList(_nbAll.filter(nb => (nb.title||'').toLowerCase().includes(q)));
}
function renderNbList(nbs){
  const el=document.getElementById('nb-list');
  if(!nbs.length){ el.innerHTML='<div class="src-empty">No notebooks</div>'; return; }
  el.innerHTML = nbs.map(nb => `
    <div class="nb-item ${currentNb&&currentNb.id===nb.id?'active':''}" onclick="openNotebook('${nb.id}')">
      <div class="nb-item-title">${esc(nb.title)}</div>
      <div class="nb-item-meta">${formatAge((Date.now()/1000)-(nb.updated_at||nb.created_at||0))} ago</div>
    </div>`).join('');
}
async function createNotebook(){
  const title = prompt('Notebook title:', 'Untitled Notebook'); if(!title) return;
  try { const nb = await nbPost('/api/notebooks', {title, description:'', tags:[]}); await loadNotebooks(); openNotebook(nb.id); }
  catch(e){ toast('Error creating notebook'); }
}

/* ══════════════════════════════════════════════════════════════════════════
   Open notebook
══════════════════════════════════════════════════════════════════════════ */
async function openNotebook(id){
  Object.values(cellWS).forEach(ws=>{ try{ws.close();}catch(e){} });
  cellWS={}; editors={};
  try {
    currentNb = await nbJson('/api/notebooks/'+id);
    nbPages = (currentNb.pages||[]).sort((a,b)=>a.sort_order-b.sort_order);
    cells = (currentNb.cells||[]).sort((a,b)=>a.sort_order-b.sort_order);
    cells.forEach(c => { if(!c.props) c.props={}; });
    currentPage = null;
    document.getElementById('nb-title-input').value = currentNb.title;
    document.getElementById('autobackup-btn').classList.toggle('on', !!getAutoBackup());
    history.replaceState({},'','?nb='+id);
    renderPages(); renderVisibleCells(); renderNbList(_nbAll);
    try { if(window.opener&&window.opener.S) _sessionCits=window.opener.S.cits||[]; } catch(e){}
  } catch(e){ toast('Failed to open notebook'); console.error(e); }
}

async function deleteCurrentNotebook(){
  if(!currentNb) return;
  if(!confirm('Delete "'+currentNb.title+'"? Cannot be undone.')) return;
  await nbDelete('/api/notebooks/'+currentNb.id).catch(()=>{});
  currentNb=null; cells=[]; nbPages=[]; currentPage=null;
  document.getElementById('nb-title-input').value='';
  renderPages(); renderVisibleCells(); await loadNotebooks(); toast('Deleted');
}

async function saveNotebookMeta(){
  if(!currentNb) return;
  const title=document.getElementById('nb-title-input').value.trim()||'Untitled';
  currentNb.title=title;
  try { await nbPatch('/api/notebooks/'+currentNb.id, {title}); loadNotebooks(); } catch(e){}
}

/* ══════════════════════════════════════════════════════════════════════════
   Pages + layout
══════════════════════════════════════════════════════════════════════════ */
function layoutKey(){ return 'nb:layout:'+(currentNb?currentNb.id:'')+':'+(currentPage||'all'); }
function getLayout(){ return localStorage.getItem(layoutKey()) || 'flow'; }
function setLayout(mode){ localStorage.setItem(layoutKey(), mode); renderVisibleCells(); }

function renderPages(){
  const list=document.getElementById('pages-list'); if(!list) return;
  list.innerHTML='';
  const all=document.createElement('div');
  all.className='page-item'+(currentPage===null?' active':'');
  all.innerHTML='<span class="page-item-title">All cells</span>';
  all.onclick=()=>selectPage(null); list.appendChild(all);
  nbPages.forEach(p=>{
    const div=document.createElement('div');
    div.className='page-item'+(currentPage===p.id?' active':''); div.dataset.pageId=p.id;
    const inp=document.createElement('input'); inp.value=p.title;
    inp.onblur=()=>renamePage(p.id,inp.value); inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();};
    inp.onclick=e=>e.stopPropagation();
    const del=document.createElement('span'); del.className='page-del'; del.textContent='✕';
    del.onclick=e=>{e.stopPropagation();deletePage(p.id);};
    div.appendChild(inp); div.appendChild(del);
    div.onclick=()=>selectPage(p.id); list.appendChild(div);
  });
  const lt=document.getElementById('layout-toggle'); if(lt) lt.style.display = currentNb?'flex':'none';
  syncLayoutToggle();
}
function syncLayoutToggle(){
  const m=getLayout();
  const f=document.getElementById('lt-flow'), c=document.getElementById('lt-canvas');
  if(f) f.classList.toggle('active', m==='flow');
  if(c) c.classList.toggle('active', m==='canvas');
}
function selectPage(id){ currentPage=id; renderPages(); renderVisibleCells(); }
async function addPage(){
  if(!currentNb) return;
  try { const page=await nbPost('/api/notebooks/'+currentNb.id+'/pages',{title:'New Page',sort_order:nbPages.length});
    nbPages.push(page); currentPage=page.id; renderPages(); renderVisibleCells();
    setTimeout(()=>{const i=document.querySelector('[data-page-id="'+page.id+'"] input'); if(i){i.focus();i.select();}},50);
  } catch(e){ toast('Error adding page'); }
}
async function renamePage(id,title){
  const p=nbPages.find(x=>x.id===id); if(!p||!title.trim())return; p.title=title.trim();
  await nbPatch('/api/notebooks/'+currentNb.id+'/pages/'+id,{title:p.title}).catch(()=>{}); renderPages();
}
async function deletePage(id){
  if(!confirm('Delete this page? Cells are kept.'))return;
  await nbDelete('/api/notebooks/'+currentNb.id+'/pages/'+id).catch(()=>{});
  nbPages=nbPages.filter(p=>p.id!==id); cells.forEach(c=>{if(c.page_id===id)c.page_id=null;});
  if(currentPage===id)currentPage=null; renderPages(); renderVisibleCells();
}

/* ══════════════════════════════════════════════════════════════════════════
   Render cells
══════════════════════════════════════════════════════════════════════════ */
function visibleCells(){ return currentPage ? cells.filter(c=>c.page_id===currentPage) : cells; }

function renderVisibleCells(){
  const empty=document.getElementById('empty-nb'), list=document.getElementById('cells-list');
  const cont=document.getElementById('cells-container');
  if(!list) return;
  if(document.body.classList.contains('view-mode')){ return; }
  const vis=visibleCells();
  if(empty) empty.style.display = (currentNb&&vis.length)?'none':(currentNb?'none':'');
  list.style.display='block'; list.innerHTML='';
  const canvas = currentNb && getLayout()==='canvas';
  cont.classList.toggle('canvas', canvas);
  list.classList.toggle('canvas-grid', canvas);
  if(!currentNb){ if(empty)empty.style.display=''; return; }

  vis.forEach((cell,i)=>list.appendChild(buildCellEl(cell,i)));
  if(!canvas){ list.appendChild(buildAddBar()); }
  updateCellCount();
  vis.forEach(cell=>initCell(cell));
  if(canvas){ layoutCanvas(vis); } else { initDragDrop(); }
  setTimeout(initPageDrag,50);
}

function buildCellEl(cell,idx){
  const el=document.createElement('div');
  el.className='cell'; el.id='cell-'+cell.id; el.dataset.id=cell.id; el.draggable=true;
  el.innerHTML=buildCellHTML(cell,idx);
  return el;
}

function buildCellHTML(cell){
  const meta=CELL_TYPES[cell.cell_type] || CELL_TYPES.markdown;
  const runnable = cell.cell_type==='code' || cell.cell_type==='mermaid' || cell.cell_type==='illustrate' || cell.cell_type==='image-gen' || cell.tag==='flesh_out' || cell.tag==='research' || cell.tag==='to_code' || cell.tag==='summarise';
  const head = `
  <div class="cell-head">
    <span class="drag-handle" title="drag to reorder"><svg width="9" height="13" viewBox="0 0 10 14" fill="currentColor"><circle cx="3" cy="3" r="1.4"/><circle cx="7" cy="3" r="1.4"/><circle cx="3" cy="7" r="1.4"/><circle cx="7" cy="7" r="1.4"/><circle cx="3" cy="11" r="1.4"/><circle cx="7" cy="11" r="1.4"/></svg></span>
    <span class="cell-kind">${esc(meta.icon)} ${esc(meta.label)}</span>
    <input class="cell-title-input" placeholder="title…" value="${esc(cell.title||'')}" onblur="updateCellField('${cell.id}','title',this.value)" onkeydown="if(event.key==='Enter')this.blur()">
    ${cell.cell_type==='code' ? langSelect(cell) : ''}
    ${runnable ? `<button class="cell-btn run" title="Run (Shift+Enter)" onclick="runCell('${cell.id}')"><svg viewBox="0 0 12 12" fill="currentColor"><polygon points="2,1 11,6 2,11"/></svg></button>` : ''}
    <button class="cell-btn" title="Convert / actions" onclick="openCellMenu(event,'${cell.id}')"><svg viewBox="0 0 12 12" fill="currentColor"><circle cx="2.5" cy="6" r="1.1"/><circle cx="6" cy="6" r="1.1"/><circle cx="9.5" cy="6" r="1.1"/></svg></button>
    <button class="cell-btn" title="Delete" onclick="deleteCell('${cell.id}')"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/></svg></button>
  </div>`;
  const body = renderCellBody(cell);
  const thread = threadHTML(cell);
  const resize = '<svg class="resize-h" viewBox="0 0 16 16" fill="currentColor" onmousedown="startResize(event,\''+cell.id+'\')"><path d="M14 2v12H2z" opacity=".4"/></svg>';
  return head + '<div class="cell-body">'+body+'</div>' + thread + resize;
}

function langSelect(cell){
  return `<select class="cell-sel" onchange="updateCellField('${cell.id}','lang',this.value);remapMode('${cell.id}',this.value)">`
    + LANGS.map(l=>`<option value="${l}" ${cell.lang===l?'selected':''}>${l}</option>`).join('') + '</select>';
}

/* ── Body renderers per type ─────────────────────────────────────────────── */
function renderCellBody(cell){
  switch(cell.cell_type){
    case 'code':       return codeBody(cell);
    case 'mermaid':    return mermaidBody(cell);
    case 'illustrate': return illustrateBody(cell);
    case 'image-gen':  return imageGenBody(cell);
    case 'image':      return imageBody(cell);
    case 'object':     return embedBody(cell,'object');
    case 'panel':      return embedBody(cell,'panel');
    default:           return textBody(cell);   // markdown / ai / research
  }
}

function textBody(cell){
  const ph = {flesh_out:'Write a brief note — ▶ to have AI flesh it out…',
    to_code:'Describe what the code should do — ▶ to generate…',
    research:'Research topic or question — ▶ to investigate…',
    summarise:'Paste content to summarise — ▶ to condense…',
    none:'Write markdown here…'}[cell.tag||'none'];
  return `<div class="cell-input">
      <textarea placeholder="${esc(ph)}" oninput="autoGrow(this);cellChanged('${cell.id}',this.value)" onkeydown="cellKeydown(event,'${cell.id}')">${esc(cell.content)}</textarea>
    </div>` + generatedHTML(cell);
}

function codeBody(cell){
  return `<div class="cell-code" id="code-${cell.id}"><textarea id="cell-ta-${cell.id}" style="display:none">${esc(cell.content)}</textarea></div>
    <div class="cell-exec-out" id="exec-${cell.id}"></div>`;
}

function mermaidBody(cell){
  return `<div class="cell-input"><textarea placeholder="Mermaid source — e.g. graph TD; A-->B  (or ▶ to AI-generate from the title)" oninput="autoGrow(this);cellChanged('${cell.id}',this.value);liveMermaid('${cell.id}',this.value)" onkeydown="cellKeydown(event,'${cell.id}')">${esc(cell.content)}</textarea></div>
    <div class="cell-render"><vera-mermaid id="mm-${cell.id}" bare></vera-mermaid></div>`;
}

function illustrateBody(cell){
  const html = cell.generated || '';
  return `<div class="cell-input"><textarea placeholder="Describe a diagram / illustration — ▶ to generate a self-contained HTML/SVG figure" oninput="autoGrow(this);cellChanged('${cell.id}',this.value)" onkeydown="cellKeydown(event,'${cell.id}')">${esc(cell.content)}</textarea></div>
    <div class="cell-render" id="ill-wrap-${cell.id}" style="${html?'':'display:none'}">
      ${html ? `<iframe class="iframe-html" id="ill-${cell.id}" sandbox="allow-scripts" srcdoc="${esc(html)}"></iframe>` : ''}
    </div>`;
}

function imageGenBody(cell){
  const p=cell.props||{};
  const img = cell.generated || '';
  return `<div class="cell-input">
      <input class="cell-mini-input" placeholder="width x height (e.g. 768x512)" value="${esc(p.size||'768x512')}" onchange="setProp('${cell.id}','size',this.value)">
      <textarea placeholder="Image prompt — ▶ to generate with Stable Diffusion" oninput="autoGrow(this);cellChanged('${cell.id}',this.value)">${esc(cell.content)}</textarea>
    </div>
    <div class="cell-render" id="ig-wrap-${cell.id}" style="${img?'':'display:none'}">${img?`<img id="ig-${cell.id}" src="${esc(img)}">`:''}</div>`;
}

function imageBody(cell){
  const url=cell.content||'';
  return `<div style="padding:8px 10px">
    ${url?`<img style="max-width:100%;border-radius:6px;display:block;margin-bottom:6px" src="${esc(url)}" onerror="this.style.display='none'">`:''}
    <div class="cell-image-drop" id="img-drop-${cell.id}" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="handleImageDrop(event,'${cell.id}')" onclick="document.getElementById('img-file-${cell.id}').click()">Drop / paste an image, or click to choose</div>
    <input type="file" id="img-file-${cell.id}" accept="image/*" style="display:none" onchange="handleImageFile(event,'${cell.id}')">
    <input class="cell-mini-input" placeholder="…or paste an image URL" value="${esc(url.startsWith('data:')?'':url)}" onchange="setImageUrl('${cell.id}',this.value)">
  </div>`;
}

function embedBody(cell, kind){
  const p=cell.props||{};
  let src='';
  if(kind==='panel' && p.panelId) src = ORCH + '/ui/panel/window?id=' + encodeURIComponent(p.panelId);
  else if(kind==='object' && p.route) src = ORCH + p.route + (p.hash?('#'+p.hash):'');
  const h = p.h || 360;
  if(!src){
    return `<div style="padding:16px;text-align:center">
      <button class="tbtn primary" onclick="openEmbedPicker(event,'${cell.id}','${kind}')">Pick a ${kind==='object'?'system object':'panel'} to embed…</button>
    </div>`;
  }
  return `<div class="cell-embed">
    <iframe id="emb-${cell.id}" src="${esc(src)}" style="height:${h}px" allow="clipboard-read; clipboard-write"></iframe>
    <div class="cell-embed-bar">
      <span>${esc((kind==='panel'?p.panelId:(OBJECT_KINDS[p.kind]?OBJECT_KINDS[p.kind].label:p.route))||'')}</span>
      <div style="flex:1"></div>
      <button class="icon-btn" title="Taller" onclick="embResize('${cell.id}',80)">＋</button>
      <button class="icon-btn" title="Shorter" onclick="embResize('${cell.id}',-80)">－</button>
      <button class="icon-btn" title="Reload" onclick="document.getElementById('emb-${cell.id}').src=document.getElementById('emb-${cell.id}').src">⟳</button>
      <button class="icon-btn" title="Pop out" onclick="window.open('${esc(src)}','_blank','noopener')">⇱</button>
      <button class="icon-btn" title="Change" onclick="openEmbedPicker(event,'${cell.id}','${kind}')">⚙</button>
    </div>
  </div>`;
}

/* Generated block (for text/AI cells) */
function generatedHTML(cell){
  if(!cell.generated) return `<div class="cell-generated" id="gen-wrap-${cell.id}" style="display:none"><div class="cell-generated-label">Generated<div class="gen-actions"><button class="gen-action-btn" onclick="acceptGenerated('${cell.id}')">Accept ↑</button><button class="gen-action-btn" onclick="clearGenerated('${cell.id}')">✕</button></div></div><div class="gen-content" id="gen-${cell.id}"></div></div>`;
  return `<div class="cell-generated"><div class="cell-generated-label">Generated<div class="gen-actions">
    <button class="gen-action-btn" onclick="acceptGenerated('${cell.id}')">Accept ↑</button>
    <button class="gen-action-btn" onclick="runCell('${cell.id}')">↺ Regen</button>
    <button class="gen-action-btn" style="color:var(--ac)" onclick="openDivePanel('${cell.id}')">⊕ Dive</button>
    <button class="gen-action-btn" style="color:var(--ac2)" onclick="genToCell('${cell.id}')">↓ Cell</button>
    <button class="gen-action-btn" onclick="clearGenerated('${cell.id}')">✕</button>
  </div></div><div class="gen-content" id="gen-${cell.id}">${renderMD(cell.generated)}</div></div>`;
}

/* Thread */

  const count=(cell.thread||[]).filter(m=>m.role==='user').length;

    <div class="thread-toggle ${count?'open':''}" onclick="this.classList.toggle('open')">
      <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3"><polyline points="3,2 6,5 3,8"/></svg>
      ${count?`${count} message${count!==1?'s':''}`:'Chat about this cell'}
    </div>
    <div class="thread-messages" id="thread-${cell.id}">
      ${(cell.thread||[]).filter(m=>m.role!=='system').map(m=>`<div class="thread-msg"><div class="thread-msg-role ${m.role}">${m.role}</div><div class="thread-msg-content ${m.role}">${m.role==='assistant'?renderMD(m.content):esc(m.content)}</div></div>`).join('')}
      <div class="thread-input-row">
        <textarea class="thread-input" id="thread-ta-${cell.id}" placeholder="Ask, request changes, iterate…" onkeydown="threadKeydown(event,'${cell.id}')" rows="1" oninput="autoGrow(this)"></textarea>
        <select class="thread-mode-sel" id="thread-mode-${cell.id}"><option value="chat">Chat</option><option value="research">Research</option></select>
        <button class="thread-send" onclick="sendThreadMsg('${cell.id}')"><svg viewBox="0 0 12 12" fill="currentColor"><path d="M1 1l10 5L1 11V7l7-1-7-1V1z"/></svg></button>
      </div>
    </div>
  </div>`;
}

function buildAddBar(){
  const el=document.createElement('div'); el.className='add-cell-row';
  el.innerHTML=`<div class="add-cell-line"></div>
    <button class="add-cell-btn" onclick="openBlockMenu(event,null)"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><line x1="6" y1="2" x2="6" y2="10"/><line x1="2" y1="6" x2="10" y2="6"/></svg>Add block</button>
    <div class="add-cell-line"></div>`;
  return el;
}

function initCell(cell){
  if(cell.cell_type==='code') initCodeMirror(cell);
  if(cell.cell_type==='mermaid') liveMermaid(cell.id, cell.content);
}

/* ══════════════════════════════════════════════════════════════════════════
   CodeMirror
══════════════════════════════════════════════════════════════════════════ */
function initCodeMirror(cell){
  const ta=document.getElementById('cell-ta-'+cell.id);
  if(!ta||editors[cell.id]) return;
  const t=localStorage.getItem('theme')||'ash';
  const cm=CodeMirror.fromTextArea(ta,{mode:langToMode(cell.lang),theme:t==='ash'?'default':'dracula',
    lineNumbers:true,lineWrapping:false,indentUnit:2,tabSize:2,
    extraKeys:{'Shift-Enter':()=>runCell(cell.id),'Cmd-Enter':()=>runCell(cell.id),'Ctrl-Enter':()=>runCell(cell.id),Tab:cm=>cm.execCommand('indentMore')}});
  cm.on('change',()=>cellChanged(cell.id,cm.getValue()));
  editors[cell.id]=cm; cm.setSize(null,'auto');
}
function remapMode(id,lang){ if(editors[id]) editors[id].setOption('mode',langToMode(lang)); }
function langToMode(lang){
  const m={python:'python',javascript:'javascript',typescript:'javascript',bash:'shell',shell:'shell',sql:'sql',json:'javascript',yaml:'yaml',html:'htmlmixed',css:'css',rust:'rust',go:'go',java:'clike',cpp:'clike'};
  return m[lang]||'text/plain';
}

/* ══════════════════════════════════════════════════════════════════════════
   Cell operations
══════════════════════════════════════════════════════════════════════════ */
function cellChanged(id,v){ const c=cells.find(x=>x.id===id); if(c){ c.content=v; c._dirty=true; } }
function setProp(id,k,v){ const c=cells.find(x=>x.id===id); if(c){ c.props=c.props||{}; c.props[k]=v; c._dirty=true; saveSingleCell(c); } }
function updateCellField(id,field,value){
  const c=cells.find(x=>x.id===id); if(!c)return; c[field]=value; c._dirty=true; saveSingleCell(c);
}

async function addCell(type='markdown', opts={}){
  if(!currentNb){ toast('Open a notebook first'); return; }
  const meta=CELL_TYPES[type]||{};
  const tag=opts.tag||meta.tag||'none';
  const cellType = (type==='ai'||type==='research') ? 'markdown' : type;
  const maxOrder=cells.reduce((m,c)=>Math.max(m,c.sort_order||0),-1);
  const body={cell_type:cellType, lang:opts.lang||'python', tag, content:opts.content||'',
    sort_order:opts.after!=null?opts.after+0.5:maxOrder+1, page_id:currentPage||undefined,
    title:opts.title||'', props:opts.props||{}};
  try {
    const cell=await nbPost('/api/notebooks/'+currentNb.id+'/cells', body);
    cell.props=cell.props||{};
    if(opts.after!=null){ const i=cells.findIndex(c=>c.sort_order>opts.after); if(i<0)cells.push(cell); else cells.splice(i,0,cell); }
    else cells.push(cell);
    cells.forEach((c,i)=>c.sort_order=i);
    renderVisibleCells();
    setTimeout(()=>{ const el=document.querySelector('#cell-'+cell.id+' textarea'); if(el)el.focus();
      document.getElementById('cell-'+cell.id)?.scrollIntoView({block:'center',behavior:'smooth'}); },60);
    return cell;
  } catch(e){ toast('Error adding cell'); }
}

async function deleteCell(id){
  if(!confirm('Delete this cell?'))return;
  await nbDelete('/api/notebooks/'+currentNb.id+'/cells/'+id).catch(()=>{});
  cells=cells.filter(c=>c.id!==id);
  if(editors[id]){ delete editors[id]; } if(cellWS[id]){ try{cellWS[id].close();}catch(e){} delete cellWS[id]; }
  renderVisibleCells();
}

function cellKeydown(e,id){
  if(e.key==='Enter'&&e.shiftKey){ e.preventDefault(); runCell(id); }
  if(e.key==='/' && e.target.value===''){ e.preventDefault(); openBlockMenu(e,id); }
}

async function changeCellType(id,newType){
  const c=cells.find(x=>x.id===id); if(!c)return;
  const meta=CELL_TYPES[newType]||{};
  c.cell_type=(newType==='ai'||newType==='research')?'markdown':newType;
  if(meta.tag) c.tag=meta.tag; else if(newType==='markdown') c.tag='none';
  c._dirty=true; await saveSingleCell(c); renderVisibleCells();
}

/* ══════════════════════════════════════════════════════════════════════════
   Run dispatch
══════════════════════════════════════════════════════════════════════════ */
function runCell(id){
  const c=cells.find(x=>x.id===id); if(!c)return;
  if(c.cell_type==='code')       return runCodeCell(c);
  if(c.cell_type==='mermaid')    return generateMermaid(c);
  if(c.cell_type==='illustrate') return runIllustrate(c);
  if(c.cell_type==='image-gen')  return runImageGen(c);
  return runAgentCell(c);   // markdown/ai/research
}

/* ── Agent cells (WS generate / research) ────────────────────────────────── */
function runAgentCell(cell){
  setGenerating(cell.id,true);
  const content = editors[cell.id]?editors[cell.id].getValue():cell.content;
  cell.content=content;
  const ws=getCellWS(cell.id);
  const action = cell.tag==='research'?'research':'generate';
  const send=()=>ws.send(JSON.stringify({action,message:content}));
  if(ws.readyState===1) send(); else ws.onopen=send;
}

function getCellWS(cellId){
  if(cellWS[cellId]&&cellWS[cellId].readyState<=1) return cellWS[cellId];
  const ws=new WebSocket(WS_BASE()+'/ws/notebook/'+currentNb.id+'/cell/'+cellId);
  cellWS[cellId]=ws; let genBuf=''; let genTimer=null;
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==='token'){ genBuf+=m.text; if(genTimer)return; genTimer=setTimeout(()=>{genTimer=null;updateGenContent(cellId,genBuf,false);},40); }
    else if(m.type==='done'){ clearTimeout(genTimer);genTimer=null;
      const c=cells.find(x=>x.id===cellId); if(c){c.generated=m.generated||m.response||genBuf;c._dirty=true;saveSingleCell(c);}
      updateGenContent(cellId,m.generated||m.response||genBuf,true);
      if(m.thread)updateThreadCount(cellId,m.thread); setGenerating(cellId,false); genBuf=''; }
    else if(m.type==='citations'){ if(m.citations&&m.citations.length){ _sessionCits=_sessionCits.concat(m.citations.filter(c=>!_sessionCits.some(x=>x.url===c.url))); } addStepToCell(cellId,'✓ '+(m.citations||[]).length+' sources'); }
    else if(m.type==='status'){ addStepToCell(cellId,m.text); }
    else if(m.type==='crawl_progress'){ addStepToCell(cellId,'Crawling '+(m.domain||m.url)); }
    else if(m.type==='error'){ toast('Error: '+m.text); setGenerating(cellId,false); }
  };
  ws.onerror=()=>{ setGenerating(cellId,false); };
  return ws;
}
function setGenerating(id,on){ const el=document.getElementById('cell-'+id); if(el)el.classList.toggle('generating',on); }
function updateGenContent(cellId,content,final){
  let wrap=document.getElementById('gen-wrap-'+cellId); if(!wrap)wrap=document.querySelector('#cell-'+cellId+' .cell-generated');
  if(wrap)wrap.style.display=''; const el=document.getElementById('gen-'+cellId); if(!el)return;
  el.innerHTML=renderMD(content)+(final?'':'<span class="gen-cursor"></span>');
}
function addStepToCell(cellId,text){
  let wrap=document.getElementById('gen-wrap-'+cellId); if(!wrap)wrap=document.querySelector('#cell-'+cellId+' .cell-generated');
  if(wrap)wrap.style.display=''; const el=document.getElementById('gen-'+cellId);
  if(el)el.innerHTML+='<div style="font-size:10px;color:var(--t3);margin:3px 0">'+esc(text)+'</div>';
}
async function acceptGenerated(id){
  const c=cells.find(x=>x.id===id); if(!c||!c.generated)return;
  c.content=c.generated; const ta=document.querySelector('#cell-'+id+' .cell-input textarea');
  if(ta){ta.value=c.generated;autoGrow(ta);} if(editors[id])editors[id].setValue(c.generated);
  c.generated=''; c._dirty=true; await saveSingleCell(c); renderVisibleCells(); toast('Accepted');
}

/* ── Executable code cells (via IDE exec sandbox SSE) ────────────────────── */
function langRunCmd(lang, code){
  const eof='VERA_NB_EOF_'+Math.random().toString(36).slice(2,8);
  const py = i => i+" - <<'"+eof+"'\n"+code+"\n"+eof;
  switch((lang||'').toLowerCase()){
    case 'python': case 'python3': return py('python3');
    case 'javascript': case 'js': case 'node': return "node - <<'"+eof+"'\n"+code+"\n"+eof;
    case 'bash': case 'shell': case 'sh': return code;
    case 'ruby': return py('ruby');
    default: return code;   // treat as a shell snippet
  }
}
function runCodeCell(cell){
  const code = editors[cell.id]?editors[cell.id].getValue():cell.content;
  cell.content=code; cell._dirty=true; saveSingleCell(cell);
  const out=document.getElementById('exec-'+cell.id); if(!out)return;
  out.classList.add('show'); out.innerHTML='<span class="o-info">$ running…</span>\n';
  const el=document.getElementById('cell-'+cell.id); if(el)el.classList.add('running');
  const cmd=langRunCmd(cell.lang, code);
  const cwd=(cell.props&&cell.props.cwd)||'';
  let pid=null;
  streamSSE(NB_API+'/ide-api/exec/run', {cmd, cwd, session_id:'notebook:'+currentNb.id},
    ev=>{
      if(ev.event==='pid'){ pid=parseInt(ev.data); execRuns[cell.id]=pid; }
      else if(ev.event==='stdout'){ appendExec(out, ev.data, ''); }
      else if(ev.event==='stderr'){ appendExec(out, ev.data, 'o-err'); }
      else if(ev.event==='exit'){ const code2=parseInt(ev.data);
        appendExec(out, (code2===0?'\n✓ done':'\n✗ exit '+code2), code2===0?'o-ok':'o-err');
        if(el)el.classList.remove('running'); delete execRuns[cell.id]; }
    },
    ()=>{ if(el)el.classList.remove('running'); });
}
function appendExec(out, text, cls){
  const span=document.createElement('span'); if(cls)span.className=cls; span.textContent=text;
  out.appendChild(span); out.scrollTop=out.scrollHeight;
}
function stopCode(id){
  const pid=execRuns[id]; if(!pid)return;
  fetch(NB_API+'/ide-api/exec/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pid})}).catch(()=>{});
}
function streamSSE(url, body, onEvent, onDone){
  fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(async resp=>{
      if(!resp.ok){ onEvent({event:'stderr',data:'HTTP '+resp.status}); onEvent({event:'exit',data:'-1'}); onDone&&onDone(); return; }
      const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf='';
      while(true){ const {done,value}=await reader.read(); if(done)break;
        buf+=dec.decode(value,{stream:true}); const parts=buf.split('\n\n'); buf=parts.pop();
        for(const part of parts){ const dl=part.split('\n').find(l=>l.startsWith('data:')); if(!dl)continue;
          try{ onEvent(JSON.parse(dl.slice(5))); }catch(e){} } }
      onDone&&onDone();
    }).catch(e=>{ onEvent({event:'stderr',data:'stream error: '+e.message}); onDone&&onDone(); });
}

/* ── Mermaid cells ───────────────────────────────────────────────────────── */
function liveMermaid(id, src){
  const el=document.getElementById('mm-'+id); if(!el)return;
  const draw=()=>{ try{ el.render ? el.render(src||'') : (el.textContent=src||''); }catch(e){} };
  if(el.render) draw(); else setTimeout(draw,300);
}
function generateMermaid(cell){
  // Ask the notebook agent (WS chat) to author mermaid source from the title/prompt.
  const prompt = 'Produce ONLY valid Mermaid diagram source (no prose, no ``` fences) for: '
    + (cell.title || cell.content || 'a diagram');
  setGenerating(cell.id,true);
  const ws=getCellWS(cell.id); let buf='';
  const orig=ws.onmessage;
  ws.onmessage=e=>{ const m=JSON.parse(e.data);
    if(m.type==='token'){ buf+=m.text; }
    else if(m.type==='done'){ let src=(m.response||buf||'').replace(/```(mermaid)?/g,'').trim();
      cell.content=src; cell._dirty=true; saveSingleCell(cell);
      const ta=document.querySelector('#cell-'+cell.id+' textarea'); if(ta)ta.value=src;
      liveMermaid(cell.id,src); setGenerating(cell.id,false); ws.onmessage=orig; }
    else if(orig) orig(e);
  };
  const send=()=>ws.send(JSON.stringify({action:'chat',message:prompt}));
  if(ws.readyState===1)send(); else ws.onopen=send;
}

/* ── Illustrate cells (AI → self-contained HTML/SVG in sandboxed iframe) ──── */
function runIllustrate(cell){
  const prompt = 'Return ONLY a single self-contained HTML document (inline CSS + inline SVG, no '
    + 'external resources, no scripts required) that visually illustrates: '
    + (cell.content||cell.title||'a concept') + '. Output raw HTML only, no markdown fences, no commentary.';
  setGenerating(cell.id,true);
  const ws=getCellWS(cell.id); let buf='';
  const orig=ws.onmessage;
  ws.onmessage=e=>{ const m=JSON.parse(e.data);
    if(m.type==='token'){ buf+=m.text; }
    else if(m.type==='done'){ let html=(m.response||buf||'');
      html=html.replace(/^```(html)?/i,'').replace(/```$/,'').trim();
      cell.generated=html; cell._dirty=true; saveSingleCell(cell);
      const wrap=document.getElementById('ill-wrap-'+cell.id);
      if(wrap){ wrap.style.display=''; wrap.innerHTML='<iframe class="iframe-html" sandbox="allow-scripts" srcdoc="'+esc(html)+'"></iframe>'; }
      setGenerating(cell.id,false); ws.onmessage=orig; }
    else if(orig) orig(e);
  };
  const send=()=>ws.send(JSON.stringify({action:'chat',message:prompt}));
  if(ws.readyState===1)send(); else ws.onopen=send;
}

/* ── Image-gen cells (image.generate over ORCH) ──────────────────────────── */
async function runImageGen(cell){
  const prompt=(editors[cell.id]?editors[cell.id].getValue():cell.content)||cell.content;
  if(!prompt.trim()){ toast('Enter a prompt'); return; }
  const [w,h]=((cell.props&&cell.props.size)||'768x512').split('x').map(n=>parseInt(n)||512);
  setGenerating(cell.id,true);
  try{
    const r=await orchPost('/image/generate',{prompt,width:w,height:h,steps:24});
    const b64=r.image_b64||r.b64||(r.images&&r.images[0]);
    const src = b64 ? (b64.startsWith('data:')?b64:'data:image/png;base64,'+b64) : (r.url||r.image_url||'');
    if(!src) throw new Error(r.error||'no image returned');
    cell.generated=src; cell._dirty=true; saveSingleCell(cell);
    const wrap=document.getElementById('ig-wrap-'+cell.id);
    if(wrap){ wrap.style.display=''; wrap.innerHTML='<img src="'+esc(src)+'">'; }
  }catch(e){ toast('Image gen failed: '+e.message); }
  setGenerating(cell.id,false);
}

function threadKeydown(e,id){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendThreadMsg(id); } }
function sendThreadMsg(id){
  const ta=document.getElementById('thread-ta-'+id); const msg=ta&&ta.value.trim(); if(!msg)return;
  ta.value=''; ta.style.height='auto';
  const mode=(document.getElementById('thread-mode-'+id)||{}).value||'chat';
  appendThreadMsg(id,{role:'user',content:msg});
  const ws=getCellWS(id); let resp=''; const orig=ws.onmessage;
  appendThreadMsg(id,{role:'assistant',content:''});
  ws.onmessage=e=>{ const m=JSON.parse(e.data);
    if(m.type==='token'){ resp+=m.text; updateLastThread(id,resp); }
    else if(m.type==='done'){ finaliseLastThread(id,m.response||resp);
      const c=cells.find(x=>x.id===id); if(c&&m.thread)c.thread=m.thread; ws.onmessage=orig; }
    else if(orig) orig(e); };
  const send=()=>ws.send(JSON.stringify({action:mode,message:msg}));
  if(ws.readyState===1)send(); else ws.onopen=send;
}
function appendThreadMsg(cellId,msg){
  const el=document.getElementById('thread-'+cellId); if(!el)return;

function updateLastThread(cellId,content){ const el=document.getElementById('thread-'+cellId); if(!el)return;

  add('user'); const ad=add('assistant'); const ce=ad.querySelector('.dive-msg-content');
  const ws=getCellWS(DIVE.cellId); let buf=''; const orig=ws.onmessage;

  const c=cells.find(x=>x.id===DIVE.cellId);
  const message=tab==='variant'?('Generate a variant: '+msg+'\n\nOriginal:\n'+((c&&c.generated)||'')):msg;
  const send=()=>ws.send(JSON.stringify({action,message}));
  if(ws.readyState===1)send(); else ws.onopen=send;
}

/* ══════════════════════════════════════════════════════════════════════════
   Save
══════════════════════════════════════════════════════════════════════════ */
async function saveSingleCell(cell){
  const content = editors[cell.id]?editors[cell.id].getValue():cell.content;
  try {
    await nbPatch('/api/notebooks/'+currentNb.id+'/cells/'+cell.id, {
      content, generated:cell.generated||'', tag:cell.tag, cell_type:cell.cell_type, lang:cell.lang,
      sort_order:cell.sort_order||0, title:cell.title||'', page_id:cell.page_id||null,
      citations:cell.citations||[], props:cell.props||{}
    });
    cell._dirty=false;
    if(getAutoBackup()) scheduleAutoBackup();
  } catch(e){ toast('Save failed'); }
}
async function saveAllCells(){
  cells.forEach(c=>{ if(editors[c.id]) c.content=editors[c.id].getValue(); });
  const dirty=cells.filter(c=>c._dirty);
  for(const c of dirty) await saveSingleCell(c);
  toast(dirty.length?('Saved '+dirty.length+' cell'+(dirty.length!==1?'s':'')):'All up to date');
}
setInterval(()=>{ if(currentNb) saveAllCells(); }, 30000);

  {label:'Backup to Gitea', run:()=>backupGitea(false)},

  {label:'New page', run:addPage},
  {label:'Layout: flow', run:()=>setLayout('flow')},
  {label:'Layout: canvas', run:()=>setLayout('canvas')},
  {label:'View as document', run:enterViewMode},
  {label:'Export Markdown', run:()=>exportNotebook('md')},

  {label:'Delete this notebook', run:deleteCurrentNotebook},
];
let _palFiltered=PALETTE_CMDS, _palSel=0;
function openPalette(){ document.getElementById('palette').classList.add('show'); const i=document.getElementById('palette-input'); i.value=''; i.focus(); paletteFilter(''); }
function closePalette(){ document.getElementById('palette').classList.remove('show'); }
function paletteFilter(q){ q=(q||'').toLowerCase(); _palFiltered=PALETTE_CMDS.filter(c=>c.label.toLowerCase().includes(q)); _palSel=0; renderPalette(); }
function renderPalette(){ const el=document.getElementById('palette-results');
  el.innerHTML=_palFiltered.map((c,i)=>`<div class="pop-item ${i===_palSel?'sel':''}" onclick="runPalette(${i})">${esc(c.label)}</div>`).join('')||'<div class="src-empty">No matches</div>'; }
function paletteKey(e){ if(e.key==='ArrowDown'){e.preventDefault();_palSel=Math.min(_palSel+1,_palFiltered.length-1);renderPalette();}
  else if(e.key==='ArrowUp'){e.preventDefault();_palSel=Math.max(_palSel-1,0);renderPalette();}
  else if(e.key==='Enter'){e.preventDefault();runPalette(_palSel);} }
function runPalette(i){ const c=_palFiltered[i]; closePalette(); if(c)c.run(); }

let _drawerTab='fabric', _fabricDatasets=null;
function toggleDrawer(){
  const b=document.getElementById('body'); const open=b.classList.toggle('drawer-open');
  document.getElementById('drawer-btn').classList.toggle('on', open);
  if(open) loadDrawer();
}
function setDrawerTab(t){ _drawerTab=t; document.querySelectorAll('.drawer-tab').forEach(el=>el.classList.toggle('active',el.dataset.tab===t));
  document.getElementById('drawer-ds').style.display = t==='fabric'?'block':'none'; loadDrawer(); }

async function loadDrawer(){
  const body=document.getElementById('drawer-body'); const q=document.getElementById('drawer-q').value.trim();
  body.innerHTML='<div class="src-empty">Loading…</div>';
  try {
    if(_drawerTab==='fabric') return loadFabricDrawer(q);
    if(_drawerTab==='memory') return loadMemoryDrawer(q);
    if(_drawerTab==='entity') return loadEntityDrawer(q);
    if(_drawerTab==='cites')  return loadCitesDrawer(q);
  } catch(e){ body.innerHTML='<div class="src-empty">Error: '+esc(e.message)+'<br>Check ⚙ orchestrator URL.</div>'; }
}

async function loadFabricDrawer(q){
  const body=document.getElementById('drawer-body'); const dsSel=document.getElementById('drawer-ds');
  if(!_fabricDatasets){
    let d=[]; try{ d=await orchJson('/fabric/datasets'); }catch(e){}
    _fabricDatasets = Array.isArray(d)?d:(d.datasets||[]);
    dsSel.innerHTML='<option value="">— pick a dataset —</option>'+_fabricDatasets.map(ds=>{const id=ds.dataset_id||ds.id||ds.name||ds; return `<option value="${esc(id)}">${esc(id)}</option>`;}).join('');
  }
  const ds=dsSel.value;
  // /fabric/query requires at least one of text / dataset_id.
  if(!ds && !q){ body.innerHTML='<div class="src-empty">Pick a dataset above, or type a search term.</div>'; return; }
  const qbody={limit:40}; if(ds)qbody.dataset_id=ds; if(q)qbody.text=q;
  let rows=[];
  try { const r=await orchPost('/fabric/query',qbody);
    rows = r.results||r.records||r.rows||r.matches||(Array.isArray(r)?r:[]); } catch(e){}
  renderSrc(rows.map(rec=>({title:rec.title||(rec.text&&rec.text.slice(0,60))||rec.id||'record',meta:(rec.dataset_id||ds||'')+(rec.source?(' · '+rec.source):''),body:(rec.text||rec.full_text||'').slice(0,220),payload:{text:rec.full_text||rec.text||'',title:rec.title||'',url:rec.url||''}})));
}
async function loadMemoryDrawer(q){
  let r; try{ r=await orchJson('/memory/all/nodes?limit=120'); }catch(e){ r={}; }
  let nodes=r.nodes||[]; if(q) nodes=nodes.filter(n=>((n.text||'')+(n.summary||'')).toLowerCase().includes(q.toLowerCase()));
  renderSrc(nodes.slice(0,60).map(n=>({title:n.summary||n.text&&n.text.slice(0,60)||n.category||n.id,meta:(n.record_type||'')+' · '+(n.source_type||''),body:(n.text||'').slice(0,200),payload:{text:n.text||n.summary||'',title:n.summary||'',url:''}})));
}
async function loadEntityDrawer(q){
  let r; try{ r=await orchJson('/fabric/entity_graph/snapshot?limit=150&include_datasets=1'); }catch(e){ r={}; }
  let ents=r.nodes||r.entities||[]; if(q) ents=ents.filter(e=>((e.name||'')+'').toLowerCase().includes(q.toLowerCase()));
  renderSrc(ents.slice(0,60).map(e=>{
    const pr=e.props||e; const nm=e.name||pr.name||e.id; const ty=e.type||pr.type||'entity';
    const desc=pr.description||''; const mc=pr.mention_count||pr.mentions||0;
    return {title:nm, meta:ty+' · '+mc+' mentions', body:desc,
      payload:{text:'**'+nm+'** ('+ty+')'+(desc?'\n\n'+desc:''), title:nm, url:''}};
  }));
}
function loadCitesDrawer(q){
  let c=_sessionCits; if(q) c=c.filter(x=>((x.title||'')+(x.url||'')).toLowerCase().includes(q.toLowerCase()));
  renderSrc(c.slice(0,40).map(x=>({title:x.title||x.url,meta:x.domain||'',body:(x.snippet||'').slice(0,180),payload:{text:'> **['+(x.title||x.url)+']('+x.url+')**\n> '+(x.domain||'')+'\n> '+((x.snippet||'').slice(0,200)),title:x.title||'',url:x.url||''}})));
}
function renderSrc(items){
  const body=document.getElementById('drawer-body');
  if(!items.length){ body.innerHTML='<div class="src-empty">Nothing found</div>'; return; }
  body.innerHTML=''; items.forEach(it=>{
    const d=document.createElement('div'); d.className='src-item';
    d.innerHTML='<div class="src-item-title">'+esc(it.title||'')+'</div><div class="src-item-meta">'+esc(it.meta||'')+'</div>'+(it.body?'<div class="src-item-body">'+esc(it.body)+'</div>':'');
    d.onclick=()=>insertSource(it.payload); body.appendChild(d);
  });
}
function insertSource(p){
  if(!currentNb){ toast('Open a notebook first'); return; }
  const content = p.title ? ('### '+p.title+'\n\n'+(p.text||'')) : (p.text||'');
  addCell('markdown',{content, title:p.title||''});
  toast('Inserted into notebook');
}

window.addEventListener('message', ev=>{
  const d=ev.data||{};
  if(d.type==='vera-citations'){ _sessionCits=d.citations||[]; if(_drawerTab==='cites')loadDrawer(); }
  else if(d.type==='vera-insert'){

    if(p.kind==='object' && (p.route||p.panelId)){ addCell(p.panelId?'panel':'object',{props:p.panelId?{panelId:p.panelId}:{route:p.route,kind:p.objectKind}}); }
    else addCell('markdown',{content:(p.title?('### '+p.title+'\n\n'):'')+text, title:p.title||''});
    toast('Inserted from main UI');
  }
});
