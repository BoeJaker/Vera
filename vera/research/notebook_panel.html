/* ══════════════════════════════════════════════════════════════════════════
   Image cell helpers
══════════════════════════════════════════════════════════════════════════ */
function handleImageDrop(e,id){ e.preventDefault(); const drop=document.getElementById('img-drop-'+id); if(drop)drop.classList.remove('dragover');
  const f=e.dataTransfer.files[0];
  if(f&&f.type.startsWith('image/')) readImg(f,id);
  else { const u=e.dataTransfer.getData('text/plain')||e.dataTransfer.getData('text/uri-list'); if(u)setImageUrl(id,u); } }
function handleImageFile(e,id){ const f=e.target.files[0]; if(f)readImg(f,id); }
function readImg(f,id){ const r=new FileReader(); r.onload=e=>setImageUrl(id,e.target.result); r.readAsDataURL(f); }
function setImageUrl(id,url){ const c=cells.find(x=>x.id===id); if(!c)return; c.content=url; c._dirty=true; saveSingleCell(c); renderVisibleCells(); }
document.addEventListener('paste', e=>{
  const f=document.activeElement; if(!f)return; const cellEl=f.closest&&f.closest('.cell'); if(!cellEl)return;
  const c=cells.find(x=>x.id===cellEl.dataset.id); if(!c||c.cell_type!=='image')return;
  const items=e.clipboardData&&e.clipboardData.items; if(!items)return;
  for(const it of items){ if(it.type.indexOf('image')!==-1){ e.preventDefault(); readImg(it.getAsFile(),c.id); break; } }
});

/* ══════════════════════════════════════════════════════════════════════════
   Drag & drop (reorder + move between pages) + canvas
══════════════════════════════════════════════════════════════════════════ */
function initDragDrop(){
  const list=document.getElementById('cells-list'); if(!list||list._dnd)return; list._dnd=true; let dragEl=null;
  list.addEventListener('dragstart',e=>{ const c=e.target.closest&&e.target.closest('.cell'); if(!c)return; dragEl=c; c.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/cell-id',c.dataset.id); });
  list.addEventListener('dragend',()=>{ if(dragEl)dragEl.classList.remove('dragging'); document.querySelectorAll('.cell.drag-over').forEach(c=>c.classList.remove('drag-over')); dragEl=null; syncCellOrder(); });
  list.addEventListener('dragover',e=>{ if(!dragEl||getLayout()==='canvas')return; e.preventDefault(); const t=e.target.closest('.cell'); if(!t||t===dragEl)return;
    document.querySelectorAll('.cell.drag-over').forEach(c=>c.classList.remove('drag-over')); t.classList.add('drag-over');
    const r=t.getBoundingClientRect(); if(e.clientY>r.top+r.height/2)t.after(dragEl); else t.before(dragEl); });
}
async function syncCellOrder(){
  if(!currentNb||getLayout()==='canvas')return;
  const order=[...document.querySelectorAll('#cells-list .cell')].map(el=>el.dataset.id).filter(Boolean);
  cells.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id)); cells.forEach((c,i)=>c.sort_order=i);
  await nbPost('/api/notebooks/'+currentNb.id+'/reorder',{order}).catch(()=>{});
}
function initPageDrag(){
  document.querySelectorAll('#pages-list .page-item').forEach(item=>{
    item.ondragover=e=>{ e.preventDefault(); item.classList.add('active'); };
    item.ondragleave=()=>{};
    item.ondrop=async e=>{ e.preventDefault(); const id=e.dataTransfer.getData('text/cell-id'); if(!id)return;
      const target=item.dataset.pageId||null; const c=cells.find(x=>x.id===id); if(!c)return; c.page_id=target;
      await nbPatch('/api/notebooks/'+currentNb.id+'/cells/'+id+'/move',{page_id:target,sort_order:c.sort_order}).catch(()=>{});
      renderVisibleCells(); toast('Moved'); };
  });
}

/* Canvas layout: absolute placement from props.canvas {x,y,w,h}; drag via head, resize via handle */
function layoutCanvas(vis){
  vis.forEach((cell,i)=>{
    const el=document.getElementById('cell-'+cell.id); if(!el)return;
    const g=(cell.props&&cell.props.canvas)||{};
    const x=g.x!=null?g.x:24+(i%3)*300, y=g.y!=null?g.y:24+Math.floor(i/3)*220, w=g.w||280, h=g.h||200;
    el.style.left=x+'px'; el.style.top=y+'px'; el.style.width=w+'px'; el.style.height=h+'px';
    const head=el.querySelector('.cell-head'); if(head) head.onmousedown=e=>startCanvasDrag(e,cell.id);
  });
}
let _cdrag=null;
function startCanvasDrag(e,id){
  if(e.target.closest('input,select,button,textarea,.CodeMirror'))return;
  if(getLayout()!=='canvas')return;
  const el=document.getElementById('cell-'+id); const r=el.getBoundingClientRect();
  _cdrag={id,dx:e.clientX-r.left,dy:e.clientY-r.top,el}; e.preventDefault();
  document.addEventListener('mousemove',canvasDragMove); document.addEventListener('mouseup',canvasDragEnd);
}
function canvasDragMove(e){ if(!_cdrag)return; const list=document.getElementById('cells-list').getBoundingClientRect();
  const x=Math.max(0,e.clientX-list.left-_cdrag.dx), y=Math.max(0,e.clientY-list.top-_cdrag.dy);
  _cdrag.el.style.left=x+'px'; _cdrag.el.style.top=y+'px'; }
function canvasDragEnd(){ if(!_cdrag)return; const c=cells.find(x=>x.id===_cdrag.id);
  if(c){ c.props=c.props||{}; c.props.canvas=Object.assign(c.props.canvas||{},{x:parseInt(_cdrag.el.style.left),y:parseInt(_cdrag.el.style.top),w:_cdrag.el.offsetWidth,h:_cdrag.el.offsetHeight}); c._dirty=true; saveSingleCell(c); }
  document.removeEventListener('mousemove',canvasDragMove); document.removeEventListener('mouseup',canvasDragEnd); _cdrag=null; }
let _rz=null;
function startResize(e,id){ if(getLayout()!=='canvas')return; e.preventDefault(); e.stopPropagation();
  const el=document.getElementById('cell-'+id); _rz={id,el,sx:e.clientX,sy:e.clientY,w:el.offsetWidth,h:el.offsetHeight};
  document.addEventListener('mousemove',rzMove); document.addEventListener('mouseup',rzEnd); }
function rzMove(e){ if(!_rz)return; _rz.el.style.width=Math.max(160,_rz.w+(e.clientX-_rz.sx))+'px'; _rz.el.style.height=Math.max(120,_rz.h+(e.clientY-_rz.sy))+'px'; }
function rzEnd(){ if(!_rz)return; const c=cells.find(x=>x.id===_rz.id);
  if(c){ c.props=c.props||{}; c.props.canvas=Object.assign(c.props.canvas||{},{w:_rz.el.offsetWidth,h:_rz.el.offsetHeight,x:parseInt(_rz.el.style.left)||0,y:parseInt(_rz.el.style.top)||0}); c._dirty=true; saveSingleCell(c); }
  document.removeEventListener('mousemove',rzMove); document.removeEventListener('mouseup',rzEnd); _rz=null; }

/* ══════════════════════════════════════════════════════════════════════════
   Doc view + export
══════════════════════════════════════════════════════════════════════════ */
function enterViewMode(){
  if(!currentNb){ toast('Open a notebook'); return; }
  document.body.classList.add('view-mode');
  document.getElementById('cell-scroll').style.display='none';
  document.getElementById('bottom-bar').style.display='none';
  document.getElementById('doc-view').style.display='flex';
  document.getElementById('doc-view-title').textContent=currentNb.title||'Untitled';
  const body=document.getElementById('doc-view-body'); body.innerHTML='';
  document.getElementById('view-cell-count').textContent=cells.length+' cells';
  cells.forEach(cell=>{
    const content=(cell.generated||cell.content||'').trim(); if(!content&&cell.cell_type!=='image')return;
    const sec=document.createElement('div'); sec.className='doc-section'; let h='';
    if(cell.title)h+='<h3>'+esc(cell.title)+'</h3>';
    if(cell.cell_type==='code')h+='<pre><code>'+esc(content)+'</code></pre>';
    else if(cell.cell_type==='image'||cell.cell_type==='image-gen')h+='<img src="'+esc(cell.content||cell.generated)+'" style="max-width:100%;border-radius:6px">';
    else if(cell.cell_type==='mermaid')h+='<pre><code>'+esc(content)+'</code></pre>';
    else if(cell.cell_type==='illustrate'&&cell.generated)h+='<iframe class="iframe-html" sandbox="allow-scripts" srcdoc="'+esc(cell.generated)+'"></iframe>';
    else h+='<div>'+renderMD(content)+'</div>';
    sec.innerHTML=h; body.appendChild(sec);
  });
}
function exitViewMode(){
  document.body.classList.remove('view-mode');
  document.getElementById('doc-view').style.display='none';
  document.getElementById('cell-scroll').style.display='';
  document.getElementById('bottom-bar').style.display='';
  renderVisibleCells();
}
function printDoc(){ window.print(); }

function exportNotebook(format){
  if(!currentNb){ toast('No notebook open'); return; }
  cells.forEach(c=>{ if(editors[c.id]) c.content=editors[c.id].getValue(); });
  if(format==='md'){
    let md='# '+currentNb.title+'\n\n';
    cells.forEach(c=>{ if(c.title)md+='### '+c.title+'\n\n';
      if(c.cell_type==='code')md+='```'+c.lang+'\n'+c.content+'\n```\n\n';
      else if(c.cell_type==='image'||c.cell_type==='image-gen')md+='!['+(c.title||'')+']('+(c.content||c.generated)+')\n\n';
      else md+=c.content+'\n\n';
      if(c.generated&&c.cell_type!=='illustrate'&&c.cell_type!=='image-gen')md+='> *AI output:*\n>\n> '+c.generated.replace(/\n/g,'\n> ')+'\n\n'; });
    download(md, currentNb.title+'.md','text/markdown');
  } else {
    const nb={nbformat:4,nbformat_minor:5,metadata:{kernelspec:{display_name:'Python 3',language:'python',name:'python3'},language_info:{name:'python'}},
      cells:cells.map(c=>{ if(c.cell_type==='code')return {cell_type:'code',metadata:{},source:splitLines(c.content),outputs:[],execution_count:null};
        let s=c.content; if(c.generated)s+='\n\n---\n*AI generated:*\n\n'+c.generated; return {cell_type:'markdown',metadata:{},source:splitLines(s)}; })};
    download(JSON.stringify(nb,null,2), currentNb.title+'.ipynb','application/json');
  }
}
function splitLines(s){ return (s||'').split('\n').map((l,i,a)=>i<a.length-1?l+'\n':l); }
function download(content,filename,type){ const b=new Blob([content],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=filename; a.click(); URL.revokeObjectURL(u); }

/* ══════════════════════════════════════════════════════════════════════════
   Markdown renderer + utils (ported)
══════════════════════════════════════════════════════════════════════════ */
function _renderCodeBlock(lang,code){
  if(lang&&typeof hljs!=='undefined'&&hljs.getLanguage(lang)){ const hl=hljs.highlight(code,{language:lang}).value;
    return '<pre><code class="hljs language-'+lang+'">'+hl+'</code></pre>'; }
  return '<pre><code>'+esc(code)+'</code></pre>';
}
function renderMD(text){
  if(!text)return '';
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```(\w*)\n?([\s\S]*?)```/g,(_,lang,code)=>{ const raw=code.trim().replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>'); return _renderCodeBlock(lang,raw); })
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/^---+$/gm,'<hr>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/^[*\-] (.+)$/gm,'<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>\n*)+/g,s=>'<ul>'+s+'</ul>')
    .replace(/^(?!<[hupbol]|<pre|<hr|<div)(.+)$/gm,'<p>$1</p>');
}
function updateCellCount(){ const el=document.getElementById('cell-count'); if(el)el.textContent=cells.length+' cell'+(cells.length!==1?'s':''); }
function autoGrow(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,400)+'px'; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatAge(s){ if(s<60)return Math.round(s)+'s'; if(s<3600)return Math.round(s/60)+'m'; if(s<86400)return Math.round(s/3600)+'h'; return Math.round(s/86400)+'d'; }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300); },2200); }
