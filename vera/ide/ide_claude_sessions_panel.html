<!DOCTYPE html>
<html lang="en" data-panel="ide-claude-dispatch">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vera · Dispatch</title>
<script>/* vera theme boot — paint cached theme before CSS parses, avoids flash */
(function(){try{var d=document.documentElement,S=window.localStorage;
var t=S.getItem('vera:ui:theme');if(t)d.setAttribute('data-theme',t);
var v=JSON.parse(S.getItem('vera:ui:themeVars')||'null');
if(v)for(var k in v)d.style.setProperty(k,v[k]);}catch(e){}})();</script>
<style>
  :root{
    --bg0:#0d0f12; --bg1:#14171c; --bg2:#1b1f26; --bg3:#232833;
    --fg:#e6e9ef; --fg-dim:var(--dim,#9aa4b2); --line:var(--border,#2a2f3a);
    --accent:#5b8cff; --accent-dim:color-mix(in srgb, var(--accent,#5b8cff) 45%, transparent);
    --ok:#37c871; --warn:#e0a83a; --err:#ef4444;
    --radius:10px; --mono:'SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg0);color:var(--fg);
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:13px}
  .wrap{display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg1)}
  header h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.3px}
  header .sub{color:var(--fg-dim);font-size:11px}
  header .grow{flex:1}
  button.btn{background:var(--bg3);border:1px solid var(--line);color:var(--fg);border-radius:8px;
       padding:6px 11px;cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap}
  button.btn:hover{border-color:var(--accent-dim)}
  button.btn:disabled{opacity:.45;cursor:not-allowed}
  .chipbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--bg1)}
  .chipbar .label{color:var(--fg-dim);font-size:11px;margin-right:2px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:20px;
       background:var(--bg2);border:1px solid var(--line);color:var(--fg-dim);cursor:pointer;user-select:none}
  .chip:hover{border-color:var(--accent-dim)}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--fg-dim)}
  .chip.ok .dot{background:var(--ok)}
  .chip.down .dot{background:var(--err)}
  main{flex:1;display:flex;overflow:hidden}
  .list{width:340px;min-width:260px;border-right:1px solid var(--line);overflow-y:auto;background:var(--bg1)}
  .list .empty{padding:30px 16px;color:var(--fg-dim);text-align:center;font-size:12px;line-height:1.6}
  .sess{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .sess:hover{background:var(--bg2)}
  .sess.active{background:var(--bg2);box-shadow:inset 3px 0 0 var(--accent)}
  .sess .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .sess .proj{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
  .sess .ts{color:var(--fg-dim);font-size:10px;white-space:nowrap}
  .sess .prev{color:var(--fg-dim);font-size:11.5px;margin-top:3px;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sess .meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
  .tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;padding:1px 6px;border-radius:5px;
       background:var(--bg3);color:var(--fg-dim)}
  .tag.user{color:#8fb4ff} .tag.assistant{color:#8fe3b0}
  .tag.commit{color:var(--accent);cursor:pointer;border:1px solid var(--accent-dim)}
  .tag.commit:hover{background:var(--accent-dim);color:var(--fg)}
  .filterbar{padding:8px 14px;font-size:11px;color:var(--fg-dim);border-bottom:1px solid var(--line);background:var(--bg2)}
  .filterbar a{color:var(--accent)}
  .branches{border-bottom:1px solid var(--line);background:var(--bg1)}
  .branches summary{cursor:pointer;padding:8px 16px;font-size:12px;font-weight:600;
       list-style:none;display:flex;align-items:center;gap:8px}
  .branches summary::-webkit-details-marker{display:none}
  .branches summary .dim{font-weight:400;color:var(--fg-dim);font-size:11px}
  .branches-list{padding:0 16px 10px;max-height:220px;overflow-y:auto}
  .brow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:11.5px}
  .brow:last-child{border-bottom:none}
  .brow .bname{font-weight:600;min-width:170px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brow.current .bname{color:var(--accent)}
  .brow .btag{font-size:9.5px;padding:1px 5px;border-radius:5px;background:var(--bg3);color:var(--fg-dim);white-space:nowrap}
  .brow .btag.wt{color:var(--ok);border:1px solid var(--ok)}
  .brow .btag.commit,.brow .btag.ll{color:var(--accent);cursor:pointer;border:1px solid var(--accent-dim)}
  .brow .btag.commit:hover,.brow .btag.ll:hover{background:var(--accent-dim);color:var(--fg)}
  .brow .bmsg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-dim)}
  .brow .bts{font-size:10px;color:var(--fg-dim);white-space:nowrap}
  .brow .bahead{font-size:10px;color:var(--fg-dim);white-space:nowrap;font-family:var(--mono)}
  .thread{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
  .thread .placeholder{margin:auto;color:var(--fg-dim);font-size:13px;text-align:center}
  .turn{max-width:820px;border-radius:10px;padding:10px 14px;border:1px solid var(--line)}
  .turn.user{background:var(--bg1);align-self:flex-end;border-color:var(--accent-dim)}
  .turn.assistant{background:var(--bg2);align-self:flex-start}
  .turn .hdr{display:flex;gap:10px;align-items:center;font-size:10.5px;color:var(--fg-dim);margin-bottom:5px}
  .turn .body{white-space:pre-wrap;word-break:break-word;font-size:12.5px;line-height:1.5}
  .toast{position:fixed;bottom:14px;right:14px;background:var(--bg3);border:1px solid var(--line);
       padding:9px 13px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .2s;max-width:340px;z-index:10}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🗂 Dispatch</h1>
    <span class="sub">Every connected Claude Code conversation, in one place</span>
    <span class="grow"></span>
    <button class="btn" id="btn-refresh">⟳ Refresh</button>
  </header>
  <div class="chipbar" id="sources"><span class="label">Sources:</span></div>
  <details class="branches" id="branchesBox" open>
    <summary>🌿 Branches <span id="branchesSummary" class="dim"></span></summary>
    <div id="branchesList" class="branches-list"><div class="empty">Loading…</div></div>
  </details>
  <main>
    <div class="list" id="list"><div class="empty">Loading…</div></div>
    <div class="thread" id="thread"><div class="placeholder">Select a conversation on the left</div></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, method='GET', body=null){
  const opt = {method, headers:{'Content-Type':'application/json'}};
  if (body) opt.body = JSON.stringify(body);
  const r = await fetch(path, opt);
  const txt = await r.text();
  try { return JSON.parse(txt); } catch (e) { return {error: 'bad response: ' + txt.slice(0,200)}; }
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

let ACTIVE_SID = '';

function relTime(iso){
  if (!iso) return '';
  const t = new Date(iso).getTime();
  if (!t) return '';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

async function loadSources(){
  const r = await api('/ide/claude_sessions/sources');
  const sources = r.sources || [];
  const bar = $('#sources');
  bar.innerHTML = '<span class="label">Sources:</span>' + sources.map(s =>
    `<span class="chip ${s.alive ? 'ok' : 'down'}" data-iid="${esc(s.instance_id)}" title="Click to ingest now">
       <span class="dot"></span>${esc(s.label)}</span>`).join('');
  $$('#sources .chip').forEach(c => c.onclick = () => ingestSource(c.dataset.iid));
}

/* Filter THIS panel's own session list to one commit, in place (no reload) —
   reuses loadSessions()'s existing ?commit= reader, just updates the URL and
   re-renders, so clicking a branch's commit doesn't need a full navigation. */
function filterSessionsByCommit(hash){
  const url = new URL(location.href);
  url.searchParams.set('commit', hash);
  history.replaceState(null, '', url);
  loadSessions();
}

async function loadBranches(){
  const box = $('#branchesList');
  const r = await api('/ide/git/branches', 'POST', {});
  if (r.error){ box.innerHTML = `<div class="empty">${esc(r.error)}</div>`; return; }
  const branches = r.branches || [];
  const sumEl = $('#branchesSummary');
  if (sumEl) sumEl.textContent = branches.length + ' branch' + (branches.length === 1 ? '' : 'es');
  if (!branches.length){ box.innerHTML = '<div class="empty">No branches found.</div>'; return; }
  box.innerHTML = branches.map(b => {
    const ab = (b.ahead != null && b.behind != null)
      ? `<span class="bahead" title="ahead/behind ${esc(r.base || 'main')}">+${b.ahead}/-${b.behind}</span>` : '';
    const wtTag = b.worktree
      ? `<span class="btag wt" title="active worktree: ${esc(b.worktree)}">🔧 active</span>` : '';
    const tsIso = b.ts ? new Date(b.ts * 1000).toISOString() : '';
    return `<div class="brow ${b.current ? 'current' : ''}">
      <span class="bname" title="${esc(b.name)}">${b.current ? '▸ ' : ''}${esc(b.name)}</span>
      ${wtTag}
      <span class="btag commit" data-hash="${esc(b.hash)}" title="${esc(b.message || '')} — filter sessions to this commit">📌 ${esc(b.hash)}</span>
      <span class="btag ll" data-hash="${esc(b.hash)}" title="Jump to Loop Lab runs for this commit">⇄ Loop Lab</span>
      <span class="bmsg" title="${esc(b.message || '')}">${esc(b.message || '')}</span>
      <span class="bts">${relTime(tsIso)}</span>
      ${ab}
    </div>`;
  }).join('');
  $$('.brow .btag.commit').forEach(el => el.onclick = () => filterSessionsByCommit(el.dataset.hash));
  $$('.brow .btag.ll').forEach(el => el.onclick = () => crossLinkToLoopLab(el.dataset.hash));
}

async function ingestSource(iid){
  toast('Ingesting…');
  const r = await api('/ide/claude_sessions/ingest_all', 'POST', {instance_id: iid});
  if (r.error){ toast('Error: ' + r.error); return; }
  toast(`Ingested ${r.turns_recorded} turn(s) from ${r.files_updated} file(s)`);
  await loadSessions();
}

/* Cross-link to Loop Lab: ask the parent shell (vscode_panel.html) to
   switch views and reload the target iframe filtered to this commit —
   the iframe's src is only set once on first lazy-load otherwise, so a
   later jump-with-filter needs the parent to force a fresh src. Falls
   back to a no-op if not actually embedded in the shell (e.g. opened
   standalone) — window.parent === window in that case. */
function crossLinkToLoopLab(hash){
  if (window.parent === window) return;
  window.parent.postMessage({type: 'vera-cross-link', target: 'looplab', commit: hash}, '*');
}

function commitTagsHtml(commits){
  if (!commits || !commits.length) return '';
  return commits.map(c => `<span class="tag commit" data-hash="${esc(c.hash)}" title="${esc(c.message || '')} — jump to Loop Lab runs for this commit">📌 ${esc(c.hash)}</span>`).join('');
}

async function loadSessions(){
  const r = await api('/ide/claude_sessions/list_sessions');
  const list = $('#list');
  if (r.error){ list.innerHTML = `<div class="empty">${esc(r.error)}</div>`; return; }
  let sessions = r.sessions || [];
  if (!sessions.length){
    list.innerHTML = '<div class="empty">No Claude Code sessions ingested yet.<br>Click a source above to ingest.</div>';
    return;
  }
  // ?commit=<hash> (set by the parent shell when cross-linked from Loop
  // Lab) filters the list down to sessions that produced that commit.
  const filterCommit = new URLSearchParams(location.search).get('commit');
  if (filterCommit){
    sessions = sessions.filter(s => (s.commits || []).some(c => c.hash === filterCommit || filterCommit.startsWith(c.hash)));
  }
  if (filterCommit && !sessions.length){
    list.innerHTML = `<div class="empty">No ingested session produced commit ${esc(filterCommit)}.<br><a href="#" id="clearFilter">Clear filter</a></div>`;
    $('#clearFilter').onclick = (e) => { e.preventDefault(); history.replaceState(null, '', location.pathname); loadSessions(); };
    return;
  }
  list.innerHTML = (filterCommit ? `<div class="filterbar">Filtered to commit ${esc(filterCommit)} — <a href="#" id="clearFilter">clear</a></div>` : '')
    + sessions.map(s => `
    <div class="sess ${s.claude_session_id === ACTIVE_SID ? 'active' : ''}" data-sid="${esc(s.claude_session_id)}">
      <div class="top"><span class="proj">${esc(s.project_dir || '(unknown project)')}</span><span class="ts">${relTime(s.last_ts)}</span></div>
      <div class="prev">${esc(s.last_preview || '')}</div>
      <div class="meta"><span class="tag ${esc(s.last_role)}">${esc(s.last_role)}</span><span class="tag">${s.turns} turn${s.turns === 1 ? '' : 's'}</span>${commitTagsHtml(s.commits)}</div>
    </div>`).join('');
  if (filterCommit) $('#clearFilter').onclick = (e) => { e.preventDefault(); history.replaceState(null, '', location.pathname); loadSessions(); };
  $$('.sess').forEach(el => el.onclick = () => openSession(el.dataset.sid));
  $$('.tag.commit').forEach(el => el.onclick = (e) => { e.stopPropagation(); crossLinkToLoopLab(el.dataset.hash); });
}

async function openSession(sid){
  ACTIVE_SID = sid;
  $$('.sess').forEach(el => el.classList.toggle('active', el.dataset.sid === sid));
  const thread = $('#thread');
  thread.innerHTML = '<div class="placeholder">Loading…</div>';
  const r = await api('/ide/claude_sessions/history?claude_session_id=' + encodeURIComponent(sid));
  if (r.error){ thread.innerHTML = `<div class="placeholder">${esc(r.error)}</div>`; return; }
  const turns = r.turns || [];
  if (!turns.length){ thread.innerHTML = '<div class="placeholder">No turns.</div>'; return; }
  thread.innerHTML = turns.map(t => `
    <div class="turn ${esc(t.role)}">
      <div class="hdr"><span>${t.role === 'user' ? '🧑' : '🤖'} ${esc(t.role)}</span><span>${esc(t.ts || '')}</span></div>
      <div class="body">${esc(t.text)}</div>
    </div>`).join('');
  thread.scrollTop = thread.scrollHeight;
}

async function refreshAll(){
  await loadSources();
  await loadSessions();
  await loadBranches();
}

$('#btn-refresh').onclick = refreshAll;
refreshAll();
setInterval(loadSessions, 30000);
setInterval(loadBranches, 60000);
</script>
<script src="/ui/vera-ui.js"></script>
</body>
</html>
