<!DOCTYPE html>
<html lang="en">
<head>
<script>/* vera theme boot - paint cached theme before CSS parses */
(function(){try{var d=document.documentElement,S=window.localStorage;
var t=S.getItem('vera:ui:theme');if(t)d.setAttribute('data-theme',t);
var v=JSON.parse(S.getItem('vera:ui:themeVars')||'null');
if(v)for(var k in v)d.style.setProperty(k,v[k]);}catch(e){}})();</script>
<meta charset="UTF-8">
<title>Vera - Widget Registry</title>
<style>
:root{
  --bg0:#181614;--bg1:#1f1d1a;--bg2:#272421;--bg3:#302c29;
  --border:#3a3530;--border2:#4a4540;
  --acc:#5a9e8f;--acc2:#8fb87a;--acc3:#c9955a;--acc4:#9e8fa0;
  --ok:#6db87a;--err:#c96b6b;--warn:#c9a35a;
  --text:#ddd5c8;--dim:#6a6058;--dim2:#8a7e70;
  --mono:var(--f-mono,'JetBrains Mono','Fira Mono',monospace);
  --sans:var(--f-ui,'Inter','IBM Plex Sans',system-ui,sans-serif);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--text);font-family:var(--sans);font-size:12px}
body{display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg1);display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex-shrink:0}
header h1{font-size:14px;font-weight:600;letter-spacing:-.1px}
header .sub{font-family:var(--mono);font-size:9px;color:var(--dim2)}
input,select,textarea,button{font-family:inherit;font-size:12px;color:var(--text);background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm,3px);padding:4px 6px}
input:focus,select:focus,textarea:focus{outline:1px solid var(--acc)}
button{cursor:pointer}button:hover{border-color:var(--border2)}
button.primary{background:var(--pri-bg,var(--acc));color:var(--pri-fg,var(--bg0));border-color:var(--pri-bd,var(--acc));font-weight:600}
button.danger{color:var(--err)}
.sp{flex:1}
.filters{padding:6px 12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.frow{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.frow .lbl{font-family:var(--mono);font-size:8px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);width:52px}
.chip{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:var(--r-pill,10px);border:1px solid var(--border);color:var(--dim2);cursor:pointer;user-select:none}
.chip:hover{color:var(--text);border-color:var(--border2)}
.chip.on{color:var(--acc);border-color:var(--acc);background:var(--bg2)}
.chip b{color:var(--dim);font-weight:400;margin-left:4px}
#wrap{flex:1;display:flex;min-height:0}
#list{width:360px;flex-shrink:0;overflow:auto;border-right:1px solid var(--border);padding:8px}
#detail{flex:1;overflow:auto;padding:12px 16px;min-width:0}
.card{display:grid;grid-template-columns:22px 1fr auto;gap:4px 8px;border:1px solid var(--border);border-radius:var(--ui-radius,6px);padding:7px 9px;margin-bottom:6px;cursor:pointer;background:var(--card,transparent)}
.card:hover{border-color:var(--border2);background:var(--bg1)}
.card.on{border-color:var(--acc);background:var(--bg2)}
.card .g{font-size:14px;color:var(--dim2);text-align:center;grid-row:span 3}
.card .n{font-weight:600;font-size:12px}
.card .f{font-family:var(--mono);font-size:9px;color:var(--acc);text-transform:uppercase;letter-spacing:.6px}
.card .r{grid-column:2 / span 2;font-family:var(--mono);font-size:9px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .p{grid-column:2 / span 2;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.card .p .k{font-size:8.5px;padding:1px 6px;border-radius:8px;border:1px solid var(--border2);color:var(--dim2);font-family:var(--mono)}
.card .p .who{margin-left:auto;font-family:var(--mono);font-size:8.5px;color:var(--dim)}
.card.dim{opacity:.35}
.empty{color:var(--dim);font-size:11px;padding:12px}
#detail h2{font-size:15px;font-weight:600;display:flex;align-items:baseline;gap:8px}
#detail h2 .g{color:var(--dim2)}
#detail h2 .id{font-family:var(--mono);font-size:9px;color:var(--dim2);font-weight:400}
.rows{margin:12px 0;border:1px solid var(--border);border-radius:var(--ui-radius,6px);overflow:hidden}
.row{display:grid;grid-template-columns:90px 1fr;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row .k{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);padding:7px 10px;background:var(--bg1)}
.row .v{padding:6px 10px;font-size:11.5px;line-height:1.5;word-break:break-word}
.row .v code{font-family:var(--mono);font-size:10px;color:var(--acc);background:var(--bg2);padding:0 4px;border-radius:3px}
.sec{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:14px 0 6px}
.place{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.place input{width:120px}
.inst{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--border);border-radius:var(--r-sm,4px);margin-bottom:4px;font-size:11px}
.inst .m{font-family:var(--mono);font-size:9px;color:var(--dim2);flex:1}
.acts{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
#status{font-family:var(--mono);font-size:9px;color:var(--dim2);margin-left:8px}
#status.err{color:var(--err)}#status.ok{color:var(--ok)}
/* + New template */
#newForm{display:none;border:1px solid var(--border);border-radius:var(--ui-radius,6px);padding:10px 12px;margin-bottom:12px;background:var(--bg1)}
#newForm.on{display:block}
#newForm .grid{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;align-items:center}
#newForm label{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
#newForm input,#newForm select,#newForm textarea{width:100%}
html[data-blocks="off"] .card,html[data-blocks="off"] .rows,html[data-blocks="off"] #newForm,html[data-blocks="off"] header,html[data-blocks="off"] .filters{background:transparent;border-color:transparent}
</style>
</head>
<body>
<header>
  <h1>Widgets</h1><span class="sub" id="count">…</span>
  <input id="q" placeholder="search name · reads · frame" oninput="wrLoad()" style="width:220px">
  <span class="sp"></span>
  <button onclick="wrNewToggle()">+ New template</button>
  <span id="status"></span>
</header>
<div class="filters">
  <div class="frow"><span class="lbl">form</span><span id="kinds"></span></div>
  <div class="frow"><span class="lbl">placed</span><span id="wheres"></span></div>
</div>
<div id="wrap">
  <div id="list"></div>
  <div id="detail">
    <div id="newForm">
      <div class="grid">
        <label>name</label><input id="nName" placeholder="GPU + queue">
        <label>form</label><select id="nForm"></select>
        <label>reads</label><input id="nCap" placeholder="capability, e.g. sysmon.status">
        <label>args</label><input id="nArgs" placeholder='{"node":"ct126"}'>
        <label>every</label><input id="nEvery" placeholder="5 s">
        <label>frame</label><input id="nFrame" placeholder="title · unit · range · warn · crit">
        <label>size</label><select id="nSize"><option>XS</option><option>S</option><option selected>M</option><option>L</option><option>XL</option></select>
        <label>can</label><input id="nCan" placeholder="refresh · pin · open the source">
        <label>placed</label><input id="nPlaced" placeholder="dashboard · LHM">
      </div>
      <div class="acts"><button class="primary" onclick="wrNewSave()">Save template</button><button onclick="wrNewToggle(false)">Cancel</button></div>
    </div>
    <div id="rec"><div class="empty">Pick a template.</div></div>
  </div>
</div>
<script>
const BASE = window.location.origin;
const G = {counter:'◔',meter:'▬',sparkline:'∿',node:'●',chart:'▥',graph:'◎',terminal:'>_',table:'▦',program:'⋮',iso:'⬡',ask:'?',panel:'▭',list:'≡',tree:'⊞',controls:'⌘',button:'→',header:'▬',rail:'▥'};
let ALL = [], KINDS = {}, WHERES = {}, FORMS = [], PLACES = [], sel = '', kind = 'all', where = 'all';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p, o){ try{ const r = await fetch(BASE + p, Object.assign({headers:{'Content-Type':'application/json'}}, o || {})); return await r.json(); }catch(e){ return {ok:false, error:String(e)}; } }
function status(msg, cls){ const s = document.getElementById('status'); s.textContent = msg || ''; s.className = cls || ''; if(msg) setTimeout(()=>{ if(s.textContent === msg){ s.textContent=''; s.className=''; } }, 4000); }

async function wrLoad(){
  const q = document.getElementById('q').value.trim();
  const r = await api('/ui/widgets/templates?limit=500&q=' + encodeURIComponent(q));
  if(!r || !r.ok){ document.getElementById('list').innerHTML = '<div class="empty">' + esc((r && r.error) || 'registry unavailable') + '</div>'; return; }
  ALL = r.templates || []; KINDS = r.kinds || {}; WHERES = r.wheres || {}; FORMS = r.forms || []; PLACES = r.places || [];
  document.getElementById('count').textContent = r.count + ' of ' + r.total + ' templates';
  const kEl = document.getElementById('kinds');
  kEl.innerHTML = ['all'].concat(Object.keys(KINDS).sort()).map(k => '<span class="chip' + (kind === k ? ' on' : '') + '" onclick="wrKind(\'' + esc(k) + '\')">' + esc(k) + '<b>' + (k === 'all' ? r.total : KINDS[k]) + '</b></span>').join(' ');
  const wEl = document.getElementById('wheres');
  wEl.innerHTML = ['all'].concat(PLACES).map(w => '<span class="chip' + (where === w ? ' on' : '') + '" onclick="wrWhere(\'' + esc(w) + '\')">' + esc(w) + '<b>' + (w === 'all' ? r.total : (WHERES[w] || 0)) + '</b></span>').join(' ');
  const nf = document.getElementById('nForm'); if(!nf.options.length) nf.innerHTML = FORMS.map(f => '<option' + (f === 'counter' ? ' selected' : '') + '>' + esc(f) + '</option>').join('');
  wrList();
  if(sel) wrOpen(sel, true);
}
function wrKind(k){ kind = k; wrLoad(); }
function wrWhere(w){ where = w; wrLoad(); }
function shown(t){ return (kind === 'all' || t.form === kind) && (where === 'all' || (t.placements || []).some(p => p.where.toLowerCase().startsWith(where.toLowerCase()))); }
function wrList(){
  const el = document.getElementById('list');
  const rows = ALL.filter(shown);
  if(!rows.length){ el.innerHTML = '<div class="empty">No template matches.</div>'; return; }
  el.innerHTML = rows.map(t => {
    const src = t.source || {};
    const who = (src.origin || 'you') + (src.from ? ' · ' + src.from : '');
    return '<div class="card' + (t.id === sel ? ' on' : '') + '" onclick="wrOpen(\'' + esc(t.id) + '\')">' +
      '<span class="g">' + (G[t.form] || '▢') + '</span><span class="n">' + esc(t.name) + '</span><span class="f">' + esc(t.form) + ' · v' + (t.version || 1) + '</span>' +
      '<span class="r">reads ' + esc(t.reads && t.reads.cap || '—') + (t.reads && t.reads.every ? ' · every ' + esc(t.reads.every) : '') + (t.frame ? ' · ' + esc(t.frame) : '') + '</span>' +
      '<span class="p">' + (t.placements || []).map(p => '<span class="k">' + esc(p.where) + (p.count > 1 ? ' ×' + p.count : '') + '</span>').join('') + '<span class="who">' + esc(who) + '</span></span></div>';
  }).join('');
}
async function wrOpen(id, quiet){
  sel = id; if(!quiet) wrList();
  const r = await api('/ui/widgets/template?id=' + encodeURIComponent(id));
  const el = document.getElementById('rec');
  if(!r || !r.ok){ el.innerHTML = '<div class="empty">' + esc((r && r.error) || 'not found') + '</div>'; return; }
  const t = r.template, src = t.source || {}, saved = src.origin !== 'built-in';
  const reads = t.reads || {};
  const argTxt = reads.args && Object.keys(reads.args).length ? ' ' + esc(JSON.stringify(reads.args)) : '';
  el.innerHTML = '<h2><span class="g">' + (G[t.form] || '▢') + '</span>' + esc(t.name) + '<span class="id">' + esc(t.id) + ' · v' + (t.version || 1) + '</span></h2>' +
    '<div class="rows">' +
    '<div class="row"><span class="k">form</span><span class="v">' + esc(t.form) + '</span></div>' +
    '<div class="row"><span class="k">reads</span><span class="v">' + (reads.cap ? '<code>' + esc(reads.cap) + '</code>' + argTxt : '—') + (reads.every ? ' · every ' + esc(reads.every) : '') + (reads.note ? ' <span style="color:var(--dim2)">' + esc(reads.note) + '</span>' : '') + '</span></div>' +
    '<div class="row"><span class="k">frame</span><span class="v">' + esc(t.frame || '—') + '</span></div>' +
    '<div class="row"><span class="k">draw</span><span class="v">' + esc((t.draw || {}).form || t.form) + ' · size ' + esc((t.draw || {}).size || 'M') + ((t.draw || {}).motion ? ' · ' + esc(t.draw.motion) : '') + '</span></div>' +
    '<div class="row"><span class="k">can</span><span class="v">' + esc((t.can || []).join(' · ') || '—') + '</span></div>' +
    '<div class="row"><span class="k">placed</span><span class="v">' + ((t.placements || []).map(p => esc(p.where) + (p.count ? ' ×' + p.count : '')).join(' · ') || '—') + '</span></div>' +
    '<div class="row"><span class="k">source</span><span class="v">' + esc(src.origin || 'you') + (src.from ? ' · ' + esc(src.from) : '') + (src.panel ? ' · panel <code>' + esc(src.panel) + '</code>' : '') + (src.from_builtin ? ' · from ' + esc(src.from_builtin) : '') + '</span></div>' +
    '</div>' +
    '<div class="sec">Place into</div><div class="place">' + PLACES.map(w => '<button onclick="wrPlace(\'' + esc(t.id) + '\',\'' + esc(w) + '\')">' + esc(w) + '</button>').join('') + '<input id="host" placeholder="host (dashboard: main)" value="main"></div>' +
    '<div class="sec">Instances · ' + (r.instances || []).length + '</div><div id="insts">' + ((r.instances || []).map(i => '<div class="inst"><span>' + esc(i.where) + (i.host ? ' · ' + esc(i.host) : '') + '</span><span class="m">' + esc(i.id) + ' · ' + esc((i.created_at || '').slice(0, 16)) + (i.session_id ? ' · ' + esc(i.session_id.slice(-10)) : '') + '</span><button onclick="wrRemove(\'' + esc(i.id) + '\')">remove</button></div>').join('') || '<div class="empty">Not placed anywhere yet.</div>') + '</div>' +
    '<div class="acts"><button onclick="wrSaveCopy(\'' + esc(t.id) + '\')">⧉ Save as my template</button>' + (saved ? '<button class="danger" onclick="wrDelete(\'' + esc(t.id) + '\')">Delete</button>' : '<span style="font-family:var(--mono);font-size:9px;color:var(--dim)">built in — save a copy to change it</span>') + '</div>';
}
async function wrPlace(id, where){
  const host = (document.getElementById('host') || {}).value || '';
  const r = await api('/ui/widgets/instantiate', {method:'POST', body:JSON.stringify({id, where, host})});
  if(r && r.ok){ status('placed into ' + where + (host ? ' · ' + host : ''), 'ok'); wrLoad(); } else status((r && r.error) || 'place failed', 'err');
}
async function wrRemove(iid){
  const r = await api('/ui/widgets/instances/remove', {method:'POST', body:JSON.stringify({id:iid})});
  if(r && r.ok){ status('removed', 'ok'); wrLoad(); } else status((r && r.error) || 'remove failed', 'err');
}
async function wrSaveCopy(id){
  const t = ALL.find(x => x.id === id); if(!t) return;
  const name = prompt('Name for your template', t.name + ' (mine)'); if(!name) return;
  const copy = Object.assign({}, t, {id: name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 64), name, source:{origin:'you', from:'the registry', from_builtin:t.id, panel:(t.source || {}).panel || ''}});
  delete copy.placements; delete copy.instances; copy.placed = (t.placements || []).map(p => p.where);
  const r = await api('/ui/widgets/templates/save', {method:'POST', body:JSON.stringify({template:copy})});
  if(r && r.ok){ status('saved ' + r.template.id, 'ok'); sel = r.template.id; wrLoad(); } else status((r && (r.error || (r.problems || []).join('; '))) || 'save failed', 'err');
}
async function wrDelete(id){
  if(!confirm('Delete template ' + id + '?')) return;
  const r = await api('/ui/widgets/templates/delete', {method:'POST', body:JSON.stringify({id})});
  if(r && r.ok){ status('deleted', 'ok'); sel = ''; document.getElementById('rec').innerHTML = '<div class="empty">Pick a template.</div>'; wrLoad(); } else status((r && r.error) || 'delete failed', 'err');
}
function wrNewToggle(on){ const f = document.getElementById('newForm'); f.classList.toggle('on', on == null ? !f.classList.contains('on') : !!on); if(f.classList.contains('on')) document.getElementById('nName').focus(); }
async function wrNewSave(){
  let args = {}; try{ const a = document.getElementById('nArgs').value.trim(); if(a) args = JSON.parse(a); }catch(e){ status('args must be JSON', 'err'); return; }
  const split = s => s.split(/\s*[·,]\s*/).map(x => x.trim()).filter(Boolean);
  const t = { name: document.getElementById('nName').value.trim(), form: document.getElementById('nForm').value,
    reads: { cap: document.getElementById('nCap').value.trim(), args, every: document.getElementById('nEvery').value.trim() },
    frame: document.getElementById('nFrame').value.trim(), draw: { form: document.getElementById('nForm').value, size: document.getElementById('nSize').value },
    can: split(document.getElementById('nCan').value), placed: split(document.getElementById('nPlaced').value), source: { origin: 'you', from: 'the registry' } };
  const r = await api('/ui/widgets/templates/save', {method:'POST', body:JSON.stringify({template:t})});
  if(r && r.ok){ status('saved ' + r.template.id, 'ok'); wrNewToggle(false); sel = r.template.id; wrLoad(); } else status((r && (r.error || (r.problems || []).join('; '))) || 'save failed', 'err');
}
wrLoad();
</script>
<script src="/ui/vera-ui.js"></script>
</body>
</html>
