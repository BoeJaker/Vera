<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vera — API Providers</title>
<style>
:root{
  --bg0:#181614;--bg1:#1f1d1a;--bg2:#272421;--bg3:#302c29;
  --border:#3a3530;--border2:#4a4540;
  --acc:#5a9e8f;--acc2:#8fb87a;--acc3:#c9955a;--acc4:#9e8fa0;
  --ok:#6db87a;--err:#c96b6b;--warn:#c9a35a;--gpu:#c97a5a;
  --text:#ddd5c8;--fg:#ddd5c8;--dim:#6a6058;--dim2:#8a7e70;
  --mono:'JetBrains Mono','Fira Mono',monospace;
  --sans:'Inter','IBM Plex Sans',system-ui,sans-serif;
  --radius:5px;--radius-sm:3px;--radius-lg:8px;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--text);font-family:var(--sans);font-size:12px}
body{overflow-y:auto;padding:12px}
.pane-tb{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pane-tb-title{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:2px;color:var(--acc4)}
.tb-sep{width:1px;height:15px;background:var(--border2)}
.status-hint{font-size:9px;color:var(--dim2);font-family:var(--mono);margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg2);color:var(--dim2);cursor:pointer;font-family:var(--sans);font-size:10.5px;font-weight:500;transition:all .14s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn.sm{padding:2px 7px;font-size:9.5px}
.btn.err-btn{border-color:var(--err);color:var(--err)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius-lg);padding:11px 13px}
.card.disabled{opacity:.6}
.card-h{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.card-t{font-family:var(--mono);font-size:12px;font-weight:700;flex:1}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex-shrink:0}
.dot.ok{background:var(--ok);box-shadow:0 0 6px rgba(109,184,122,.5)}
.dot.err{background:var(--err);box-shadow:0 0 6px rgba(201,107,107,.5)}
.kind-badge{font-size:7.5px;font-family:var(--mono);font-weight:700;padding:2px 6px;border-radius:3px;background:var(--bg2);border:1px solid var(--border);color:var(--acc2)}
.fld{display:flex;flex-direction:column;gap:2px;margin-bottom:7px}
.fld label{font-size:8px;font-family:var(--mono);color:var(--dim2);text-transform:uppercase;letter-spacing:.7px}
.fld input,.fld select,.fld textarea{background:var(--bg0);border:1px solid var(--border2);color:var(--text);padding:5px 8px;border-radius:var(--radius-sm);font-family:var(--mono);font-size:10px;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--acc)}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.keyhint{font-size:8px;font-family:var(--mono);margin-top:2px}
.keyhint.has{color:var(--ok)}.keyhint.env{color:var(--acc3)}.keyhint.none{color:var(--dim)}
.row-actions{display:flex;gap:5px;align-items:center;margin-top:8px;padding-top:7px;border-top:1px solid var(--border)}
.test-out{font-size:9px;font-family:var(--mono);color:var(--dim2);margin-top:6px;min-height:13px}
.toggle{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:9px;color:var(--dim2);font-family:var(--mono)}
.toggle input{accent-color:var(--acc)}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}
.kpi{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius-lg);padding:9px 12px}
.kpi-val{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--acc4)}
.kpi-val.cost{color:var(--acc3)}
.kpi-sub{font-size:9px;color:var(--dim2);font-family:var(--mono);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.sec-title{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--dim2);text-transform:uppercase;margin:4px 0 8px}
table{width:100%;border-collapse:collapse;font-size:10px}
th{font-family:var(--mono);font-size:7.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);padding:5px 8px;text-align:left;border-bottom:1px solid var(--border);font-weight:600}
td{padding:5px 8px;border-bottom:1px solid rgba(58,53,48,.3);font-family:var(--mono);color:var(--text)}
tr:hover td{background:rgba(158,143,160,.05)}
.tbl-wrap{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:14px}
.tbl-wrap .inner{max-height:260px;overflow-y:auto}
.badge{font-size:7.5px;padding:1px 6px;border-radius:7px;font-family:var(--mono);font-weight:600}
.b-ok{background:rgba(109,184,122,.1);color:var(--ok);border:1px solid rgba(109,184,122,.22)}
.b-err{background:rgba(201,107,107,.1);color:var(--err);border:1px solid rgba(201,107,107,.22)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media(max-width:820px){.two-col{grid-template-columns:1fr}.kpi-row{grid-template-columns:repeat(2,1fr)}}
.play-out{background:var(--bg0);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px;font-family:var(--mono);font-size:10px;white-space:pre-wrap;min-height:60px;max-height:220px;overflow-y:auto;color:var(--text);margin-top:7px}
.empty{padding:18px;text-align:center;color:var(--dim);font-size:11px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}
</style>
</head>
<body>

<div class="pane-tb">
  <span class="pane-tb-title">API PROVIDERS</span>
  <span class="tb-sep"></span>
  <button class="btn sm" onclick="P.reload()">↻ Refresh</button>
  <button class="btn sm" onclick="P.addCustom()">+ Custom (OpenAI-compatible)</button>
  <span class="tb-sep"></span>
  <button class="btn sm err-btn" onclick="P.clearUsage()">Clear usage</button>
  <span class="status-hint" id="ts"></span>
</div>

<!-- Usage KPIs -->
<div class="kpi-row">
  <div class="kpi"><div class="kpi-val cost" id="k-cost">$0</div><div class="kpi-sub">total cost</div></div>
  <div class="kpi"><div class="kpi-val" id="k-reqs">0</div><div class="kpi-sub">requests</div></div>
  <div class="kpi"><div class="kpi-val" id="k-in">0</div><div class="kpi-sub">input tokens</div></div>
  <div class="kpi"><div class="kpi-val" id="k-out">0</div><div class="kpi-sub">output tokens</div></div>
</div>

<div class="sec-title">Providers</div>
<div class="grid" id="providers"><div class="empty">Loading…</div></div>

<div class="two-col">
  <!-- Playground -->
  <div>
    <div class="sec-title">Playground</div>
    <div class="card">
      <div class="fld-row">
        <div class="fld"><label>Provider</label><select id="pg-prov" onchange="P.pgModels()"></select></div>
        <div class="fld"><label>Model</label><select id="pg-model"></select></div>
      </div>
      <div class="fld"><label>System (optional)</label><input id="pg-sys" placeholder="You are a helpful assistant."></div>
      <div class="fld"><label>Prompt</label><textarea id="pg-prompt" rows="3" placeholder="Say hello in one sentence."></textarea></div>
      <div class="fld-row">
        <div class="fld"><label>Max tokens</label><input id="pg-max" type="number" value="256"></div>
        <div style="display:flex;align-items:flex-end"><button class="btn primary" style="width:100%" id="pg-send" onclick="P.send()">Send</button></div>
      </div>
      <div class="test-out" id="pg-meta"></div>
      <div class="play-out" id="pg-out">Response appears here…</div>
    </div>
  </div>

  <!-- Cost by model -->
  <div>
    <div class="sec-title">Cost by model</div>
    <div class="tbl-wrap">
      <div class="inner">
        <table>
          <thead><tr><th>Provider</th><th>Model</th><th>Reqs</th><th>In</th><th>Out</th><th>Cost</th></tr></thead>
          <tbody id="totals-tbody"></tbody>
        </table>
        <div class="empty" id="totals-empty" style="display:none">No usage recorded yet — run a Playground request.</div>
      </div>
    </div>
  </div>
</div>

<div class="sec-title">Recent calls</div>
<div class="tbl-wrap">
  <div class="inner">
    <table>
      <thead><tr><th>Time</th><th>Provider</th><th>Model</th><th>In</th><th>Out</th><th>Cost</th><th>Status</th></tr></thead>
      <tbody id="recent-tbody"></tbody>
    </table>
    <div class="empty" id="recent-empty" style="display:none">No calls yet.</div>
  </div>
</div>

<script>
'use strict';
const P = (function(){
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = n => (n||0).toLocaleString();

async function api(path, method='GET', body=null){
  const opts = {method, headers:{'Content-Type':'application/json'}};
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  return r.json();
}

let _providers = [];

function kindLabel(k){ return k==='anthropic' ? 'anthropic' : 'openai'; }

function keyHint(p){
  if(p.has_key) return '<span class="keyhint has">● key stored (Fernet)</span>';
  if(p.env_key) return '<span class="keyhint env">● using env var</span>';
  return '<span class="keyhint none">○ no key set</span>';
}

function renderProviders(){
  const el = $('providers');
  if(!_providers.length){ el.innerHTML='<div class="empty">No providers.</div>'; return; }
  el.innerHTML = _providers.map(p=>`
    <div class="card ${p.enabled?'':'disabled'}" data-id="${esc(p.id)}">
      <div class="card-h">
        <span class="dot" id="dot-${esc(p.id)}"></span>
        <span class="card-t">${esc(p.label||p.id)}</span>
        <span class="kind-badge">${esc(kindLabel(p.kind))}</span>
      </div>
      <div class="fld"><label>Base URL</label><input id="base-${esc(p.id)}" value="${esc(p.base_url||'')}"></div>
      <div class="fld">
        <label>API key ${p.has_key?'· stored':''}</label>
        <input id="key-${esc(p.id)}" type="password" placeholder="${p.has_key?'•••••••• (blank = keep)':(p.env_key?'(env var in use — blank = keep)':'paste key')}">
        ${keyHint(p)}
      </div>
      <div class="fld"><label>Default model</label><select id="model-${esc(p.id)}"></select></div>
      <div class="row-actions">
        <label class="toggle"><input type="checkbox" id="en-${esc(p.id)}" ${p.enabled?'checked':''}> enabled</label>
        <span style="flex:1"></span>
        <button class="btn sm" onclick="P.test('${esc(p.id)}')">Test</button>
        <button class="btn sm primary" onclick="P.save('${esc(p.id)}')">Save</button>
        ${(p.id!=='anthropic'&&p.id!=='openai')?`<button class="btn sm err-btn" onclick="P.del('${esc(p.id)}')">✕</button>`:''}
      </div>
      <div class="test-out" id="test-${esc(p.id)}"></div>
    </div>`).join('');
  _providers.forEach(p=>loadModels(p.id, p.default_model));
}

async function loadModels(id, selected){
  const sel = $('model-'+id); if(!sel) return;
  sel.innerHTML='<option>…</option>';
  try{
    const j = await api('/providers/models?provider='+encodeURIComponent(id));
    const models = j.models||[];
    sel.innerHTML = models.map(m=>`<option value="${esc(m)}" ${m===selected?'selected':''}>${esc(m)}</option>`).join('')
       || `<option value="${esc(selected||'')}">${esc(selected||'(none)')}</option>`;
  }catch(e){ sel.innerHTML=`<option value="${esc(selected||'')}">${esc(selected||'(none)')}</option>`; }
}

async function reload(){
  $('ts').textContent='loading…';
  try{
    const j = await api('/providers/list');
    _providers = j.providers||[];
    renderProviders();
    fillPlayground();
    $('ts').textContent='updated '+new Date().toLocaleTimeString();
  }catch(e){ $('ts').textContent='error: '+e.message; }
  loadUsage();
}

async function test(id){
  const out = $('test-'+id); const dot = $('dot-'+id);
  out.textContent='testing…';
  try{
    const j = await api('/providers/test','POST',{id});
    if(j.ok){
      dot.className='dot ok';
      out.innerHTML=`<span style="color:var(--ok)">✓ ok</span> · ${j.latency_ms}ms · ${(j.models||[]).length} models`;
      const sel=$('model-'+id);
      if(sel && (j.models||[]).length){
        const cur=sel.value;
        sel.innerHTML=j.models.map(m=>`<option value="${esc(m)}" ${m===cur?'selected':''}>${esc(m)}</option>`).join('');
      }
    }else{
      dot.className='dot err';
      out.innerHTML=`<span style="color:var(--err)">✕ ${esc(j.error||'failed')}</span>`;
    }
  }catch(e){ dot.className='dot err'; out.innerHTML=`<span style="color:var(--err)">✕ ${esc(e.message)}</span>`; }
}

async function save(id){
  const body = {
    id,
    base_url: $('base-'+id).value.trim(),
    api_key: $('key-'+id).value,
    enabled: $('en-'+id).checked,
    default_model: ($('model-'+id)||{}).value||'',
    kind: (_providers.find(p=>p.id===id)||{}).kind||'openai',
  };
  const out = $('test-'+id); out.textContent='saving…';
  try{
    const j = await api('/providers/save','POST',body);
    if(j.error){ out.innerHTML=`<span style="color:var(--err)">${esc(j.error)}</span>`; return; }
    $('key-'+id).value='';
    out.innerHTML='<span style="color:var(--ok)">✓ saved</span>';
    setTimeout(reload, 300);
  }catch(e){ out.innerHTML=`<span style="color:var(--err)">${esc(e.message)}</span>`; }
}

async function del(id){
  if(!confirm('Delete provider '+id+'?')) return;
  await api('/providers/delete','POST',{id});
  reload();
}

function addCustom(){
  const id = prompt('Provider id (e.g. groq, together, openrouter):');
  if(!id) return;
  const base = prompt('Base URL (OpenAI-compatible, e.g. https://api.groq.com/openai/v1):','https://api.groq.com/openai/v1');
  if(base===null) return;
  api('/providers/save','POST',{id:id.trim(), label:id.trim(), kind:'openai', base_url:base.trim(), enabled:true})
    .then(reload);
}

// ── Playground ───────────────────────────────────────────────────────────────
function fillPlayground(){
  const sel=$('pg-prov');
  const cur=sel.value;
  sel.innerHTML=_providers.map(p=>`<option value="${esc(p.id)}">${esc(p.label||p.id)}</option>`).join('');
  if(cur) sel.value=cur;
  pgModels();
}
async function pgModels(){
  const id=$('pg-prov').value; const sel=$('pg-model');
  if(!id){ sel.innerHTML=''; return; }
  sel.innerHTML='<option>…</option>';
  try{
    const j=await api('/providers/models?provider='+encodeURIComponent(id));
    const def=(_providers.find(p=>p.id===id)||{}).default_model;
    sel.innerHTML=(j.models||[]).map(m=>`<option value="${esc(m)}" ${m===def?'selected':''}>${esc(m)}</option>`).join('');
  }catch(e){ sel.innerHTML='<option>(error)</option>'; }
}
async function send(){
  const btn=$('pg-send'); btn.disabled=true;
  $('pg-meta').textContent='calling…'; $('pg-out').textContent='';
  try{
    const j=await api('/providers/chat','POST',{
      provider:$('pg-prov').value, model:$('pg-model').value,
      system:$('pg-sys').value.trim(), prompt:$('pg-prompt').value,
      max_tokens:parseInt($('pg-max').value)||256, caller:'playground',
    });
    if(j.error){
      $('pg-meta').innerHTML=`<span style="color:var(--err)">${esc(j.error)}</span>`;
    }else{
      $('pg-meta').innerHTML=`${esc(j.model)} · in ${fmt(j.input_tokens)} / out ${fmt(j.output_tokens)} · <span style="color:var(--acc3)">$${(j.cost_usd||0).toFixed(5)}</span>`;
      $('pg-out').textContent=j.text||'(empty response)';
    }
  }catch(e){ $('pg-meta').innerHTML=`<span style="color:var(--err)">${esc(e.message)}</span>`; }
  btn.disabled=false;
  loadUsage();
}

// ── Usage ────────────────────────────────────────────────────────────────────
async function loadUsage(){
  try{
    const j=await api('/providers/usage?limit=100');
    const s=j.summary||{};
    $('k-cost').textContent='$'+(s.total_cost_usd||0).toFixed(4);
    $('k-reqs').textContent=fmt(s.total_requests);
    $('k-in').textContent=fmt(s.total_input_tokens);
    $('k-out').textContent=fmt(s.total_output_tokens);

    const totals=(j.totals||[]).sort((a,b)=>(b.cost_usd||0)-(a.cost_usd||0));
    $('totals-tbody').innerHTML=totals.map(t=>`<tr>
      <td>${esc(t.provider)}</td><td>${esc(t.model)}</td><td>${fmt(t.requests)}</td>
      <td>${fmt(t.input_tokens)}</td><td>${fmt(t.output_tokens)}</td>
      <td style="color:var(--acc3)">$${(t.cost_usd||0).toFixed(4)}</td></tr>`).join('');
    $('totals-empty').style.display=totals.length?'none':'block';

    const recent=j.recent||[];
    $('recent-tbody').innerHTML=recent.map(r=>`<tr>
      <td>${esc((r.ts||'').replace('T',' ').slice(0,19))}</td>
      <td>${esc(r.provider)}</td><td>${esc(r.model)}</td>
      <td>${fmt(r.input_tokens)}</td><td>${fmt(r.output_tokens)}</td>
      <td style="color:var(--acc3)">$${(r.cost_usd||0).toFixed(5)}</td>
      <td>${r.ok?'<span class="badge b-ok">ok</span>':'<span class="badge b-err" title="'+esc(r.error)+'">err</span>'}</td>
    </tr>`).join('');
    $('recent-empty').style.display=recent.length?'none':'block';
  }catch(e){ /* leave */ }
}

async function clearUsage(){
  if(!confirm('Clear all usage history and totals?')) return;
  await api('/providers/usage/clear','POST',{});
  loadUsage();
}

window.addEventListener('DOMContentLoaded', reload);
return { reload, test, save, del, addCustom, pgModels, send, clearUsage };
})();
</script>
<script src="/ui/vera-ui.js"></script>
</body>
</html>
