<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* vera theme boot — paint cached theme before CSS parses, avoids flash */
  (function(){try{var d=document.documentElement,S=window.localStorage;
  var t=S.getItem('vera:ui:theme');if(t)d.setAttribute('data-theme',t);
  var vf=S.getItem('vera:ui:themeVarsFor');if(t&&vf!==t)return;var v=JSON.parse(S.getItem('vera:ui:themeVars')||'null');
  if(v)for(var k in v)d.style.setProperty(k,v[k]);}catch(e){}})();</script>
<meta charset="UTF-8">
<title>Vera · Registration</title>
<style>
:root{
  --bg:#0d0f12; --bg1:#14181d; --bg2:#1a1f26; --bg3:#20262e;
  --border:#232a33; --border2:#2e3742;
  --fg:#d8dde3; --fg2:#9aa3ad; --dim:#5f6975;
  --acc:#4a9eff; --ok:#28c28a; --warn:#f5b341; --err:#ef5b5b;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg0,var(--bg));color:var(--text,var(--fg));
  font:12px/1.55 -apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;height:100%;overflow:hidden}
#root{display:flex;flex-direction:column;height:100vh;min-height:0}
#topbar{height:46px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--bg1);
  padding:0 18px;display:flex;align-items:center;gap:10px}
#topbar h1{margin:0;font-size:13px;font-weight:600}
#topbar .sub{font-size:10px;color:var(--dim)}
.right{margin-left:auto;display:flex;gap:8px;align-items:center}
#content{flex:1;overflow-y:auto;padding:16px 20px;min-height:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.card h2{margin:0 0 8px;font-size:12px;font-weight:600;display:flex;gap:10px;align-items:baseline}
.card h2 .n{color:var(--dim);font-weight:400;font-size:11px}
.btn{background:var(--bg2);border:1px solid var(--border2);color:var(--fg);border-radius:5px;
  padding:5px 11px;font:inherit;font-size:11px;cursor:pointer}
.btn:hover{background:var(--bg3);border-color:var(--acc)}
.btn.danger:hover{border-color:var(--err)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:9px 12px}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--dim)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;color:var(--dim);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.pl{display:inline-block;padding:1px 8px;border-radius:20px;font-size:10px;white-space:nowrap;
  border:1px solid var(--border2);background:var(--bg2);color:var(--fg2);cursor:default}
.pl.yes{border-color:var(--ok);color:var(--ok)}
.pl.no{border-color:var(--err);color:var(--err)}
.pl.unknown{border-color:var(--warn);color:var(--warn)}
.pl.na{opacity:.45}
.name{cursor:pointer;border-bottom:1px dotted var(--dim)}
.name:hover{color:var(--acc)}
.muted{color:var(--dim)}
.empty{color:var(--dim);text-align:center;padding:14px}
.stale{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px dashed var(--border)}
.stale:first-child{border-top:none}
.stale .k{font-size:10px;color:var(--dim);min-width:64px}
.stale .w{margin-left:auto;font-size:10px;color:var(--dim)}
.out{font-family:var(--mono);font-size:10px;white-space:pre-wrap;background:var(--bg2);border:1px solid var(--border);
  border-radius:5px;padding:8px 10px;margin-top:8px;max-height:220px;overflow:auto;display:none}
label.tog{display:flex;gap:6px;align-items:center;color:var(--fg2);font-size:11px}
</style>
</head>
<body>
<div id="root">
  <div id="topbar">
    <div>
      <h1>Registration</h1>
      <div class="sub">every machine against SSH login · directory · mesh · certificate · backup</div>
    </div>
    <div class="right">
      <label class="tog"><input type="checkbox" id="gapsOnly" checked onchange="render()"> gaps only</label>
      <button class="btn" onclick="load(true)">Check now</button>
    </div>
  </div>
  <div id="content"><div class="wrap">
    <div class="stats" id="stats"></div>
    <div class="card"><h2>Machines <span class="n" id="rows-n"></span></h2>
      <div class="tbl" id="rows"><div class="empty">checking…</div></div></div>
    <div class="card"><h2>Entries no machine answers to <span class="n" id="stale-n"></span>
        <span style="margin-left:auto;display:flex;gap:6px">
          <button class="btn" onclick="prune(false)">Dry run</button>
          <button class="btn danger" onclick="prune(true)">Prune</button></span></h2>
      <div id="stale"><div class="empty">checking…</div></div>
      <div class="out" id="prune-out"></div></div>
    <div class="muted" id="meta"></div>
  </div></div>
</div>
<script src="/ui/vera-ui.js"></script>
<script src="/ui/vera-entity-drawer.js"></script>
<script>
const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function cap(name, args){
  const r = await fetch('/mcp/call', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name, arguments: args||{}})});
  const j = await r.json(); return (j && j.content !== undefined) ? j.content : j;
}
const PLANES = [['ssh','SSH'],['directory','Directory'],['mesh','Mesh'],['certificate','Cert'],['backup','Backup']];
let DATA = null;
function chip(p){ const st = p.state==='n/a'?'na':(p.state||'unknown');
  return `<span class="pl ${st}" title="${esc(p.detail||'')}"${p.ref?` data-entity="${esc(p.ref)}" style="cursor:pointer"`:''}>${esc(p.state)}</span>`; }
function render(){
  if(!DATA) return;
  const c = DATA.counts||{};
  $('stats').innerHTML = `<div class="stat"><b>${DATA.machines||0}</b><span>machines</span></div>
    <div class="stat"><b>${DATA.complete||0}</b><span>registered in every plane that applies</span></div>`
    + PLANES.map(([k,l]) => `<div class="stat"><b>${(c[k]||{}).yes||0}</b><span>${esc(l)} · yes</span></div>`).join('');
  const gaps = $('gapsOnly').checked;
  const rows = (DATA.rows||[]).filter(r => !gaps || !r.complete);
  $('rows-n').textContent = rows.length + (gaps ? ' with gaps' : '');
  $('rows').innerHTML = rows.length ? '<table><tr><th>Machine</th><th>Kind</th><th>State</th>' + PLANES.map(([,l])=>`<th>${l}</th>`).join('') + '<th></th></tr>'
    + rows.map(r => `<tr><td><span class="name" data-entity="${esc(r.ref)}">${esc(r.label)}</span>${r.vmid!=null?` <span class="muted">${r.type==='qemu'?'VM':'CT'} ${r.vmid}</span>`:''}</td>
      <td class="muted">${esc(r.kind)}</td><td class="muted">${esc(r.status||'')}</td>`
      + PLANES.map(([k]) => `<td>${chip((r.planes||{})[k]||{state:'unknown'})}</td>`).join('')
      + `<td>${(r.kind==='guest'&&r.vmid!=null&&r.status==='running')?`<button class="btn" onclick="enrol(${r.vmid},'${esc(r.node)}','${esc(r.type)}','${esc(r.cluster_id)}')">Enrol</button>`:''}</td></tr>`).join('') + '</table>'
    : '<div class="empty">Every machine is registered in every plane that applies.</div>';
  const st = DATA.stale||[];
  $('stale-n').textContent = st.length ? st.length : 'none';
  $('stale').innerHTML = st.length ? st.map(s => `<div class="stale"><span class="k">${esc(s.kind)}</span><span>${esc(s.label)}</span><span class="w">${esc(s.why)} · ${esc((s.action||{}).cap||'')}</span></div>`).join('')
    : '<div class="muted">Nothing stale.</div>';
  const errs = Object.keys(DATA.errors||{});
  $('meta').textContent = `checked ${DATA.checked_at||''}` + (errs.length ? ` · not read: ${errs.join(', ')}` : '');
}
async function load(refresh){
  $('meta').textContent = 'checking…';
  DATA = await cap('estate.registration', {refresh: !!refresh});
  if(DATA.error){ $('rows').innerHTML = `<div class="empty">${esc(DATA.error)}</div>`; return; }
  render();
}
async function enrol(vmid, node, type, cluster){
  if(!confirm(`Enrol ${type==='qemu'?'VM':'CT'} ${vmid} through the enrolment pipeline (login, certificate, directory, mesh)?`)) return;
  const r = await cap('autoenroll.enrol', {cluster_id: cluster, node, guest_type: type, vmid, confirm: true});
  alert(r.error ? ('Enrolment: ' + r.error) : ('Enrolment ' + (r.status||'') + (r.fqdn?' as '+r.fqdn:'')));
  load(true);
}
async function prune(confirmIt){
  if(confirmIt && !confirm('Remove every stale entry listed above from its registry? Directory hosts lose their DNS record too.')) return;
  const r = await cap('estate.registration.prune', {confirm: !!confirmIt});
  const out = $('prune-out'); out.style.display = 'block';
  out.textContent = r.error ? r.error : (r.dry_run ? 'Would remove:\n' : 'Removed:\n')
    + ((r.dry_run ? r.plan : r.done)||[]).map(x => `  ${x.kind}  ${x.label||x.id}${x.ok===false?'  FAILED: '+x.error:''}`).join('\n') || '  nothing';
  if(confirmIt) load(true);
}
load(false);
</script>
</body>
</html>
