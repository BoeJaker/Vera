<!DOCTYPE html>
<html lang="en">
<head>
<script>/* vera theme boot */
(function(){try{var d=document.documentElement,S=window.localStorage;
var t=S.getItem('vera:ui:theme');if(t)d.setAttribute('data-theme',t);
var vf=S.getItem('vera:ui:themeVarsFor');if(t&&vf!==t)return;var v=JSON.parse(S.getItem('vera:ui:themeVars')||'null');
if(v)for(var k in v)d.style.setProperty(k,v[k]);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vera — Reselling</title>
<link rel="stylesheet" href="/ui/vera-panel.css">
<style>
:root{
  --bg0:#141312;--bg1:#1b1917;--bg2:#242120;--bg3:#2e2a28;
  --border:#38332f;--border2:#4a4540;
  --acc:#5a9e8f;--acc2:#8fb87a;
  --up:#3fd0a4;--dn:#e0705a;
  --s1:#7aa2f7;--s2:#e8b34d;--s3:#b48ead;--s4:#5ec9b8;
  --ok:#6db87a;--err:#c96b6b;--warn:#c9a35a;--deal:#e8b34d;
  --text:#ddd5c8;--dim:#6a6058;--dim2:#8a7e70;
  --mono:'JetBrains Mono','Fira Mono',monospace;
  --sans:'Inter','IBM Plex Sans',system-ui,sans-serif;
  --radius:6px;--radius-sm:4px;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--text);font-family:var(--sans);font-size:13px}
body{display:flex;flex-direction:column;overflow:hidden}
button{font-family:var(--sans);cursor:pointer}
a{color:var(--acc);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
.hdr{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--bg1);flex-shrink:0}
.hdr .brand{font-size:14px;font-weight:700;color:var(--acc);letter-spacing:.3px;white-space:nowrap}
.hdr .chips{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
.chip{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--dim2);white-space:nowrap}
.chip b{color:var(--text);font-family:var(--mono)}
.chip.deal b{color:var(--deal)} .chip.good b{color:var(--up)} .chip.bad b{color:var(--dn)}
.layout{flex:1;display:flex;min-height:0}
nav.side{width:158px;flex-shrink:0;border-right:1px solid var(--border);background:var(--bg1);padding:8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
nav.side button{background:none;border:none;color:var(--dim2);text-align:left;padding:8px 10px;border-radius:var(--radius);font-size:13px;display:flex;align-items:center;gap:8px}
nav.side button:hover{background:var(--bg2);color:var(--text)}
nav.side button.active{background:var(--bg2);color:var(--acc);font-weight:600}
nav.side .ico{width:16px;text-align:center}
nav.side .badge{margin-left:auto;background:var(--deal);color:#221c10;border-radius:10px;font-size:10px;padding:0 6px;font-weight:700;display:none}
main.content{flex:1;overflow:auto;padding:16px 18px}
h2{font-size:16px;font-weight:600;margin-bottom:2px}
.sub{color:var(--dim2);font-size:11px;margin-bottom:14px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
input,select,textarea{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:6px 9px;font-family:var(--sans);font-size:13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{width:100%;resize:vertical;font-family:var(--mono);font-size:12px}
label.fld{display:block;font-size:11px;color:var(--dim2);margin:8px 0 3px}
.btn{background:var(--bg2);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius-sm);padding:6px 12px;font-size:12px}
.btn:hover{background:var(--bg3)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc,#0d0f12);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.danger{border-color:var(--err);color:var(--err)}
.grid{display:grid;gap:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.kpi{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.kpi .lbl{font-size:11px;color:var(--dim2);text-transform:uppercase;letter-spacing:.4px}
.kpi .val{font-size:22px;font-weight:700;font-family:var(--mono);margin-top:4px}
.kpi .val.up{color:var(--up)} .kpi .val.dn{color:var(--dn)} .kpi .val.deal{color:var(--deal)}
.kpi .foot{font-size:10px;color:var(--dim);margin-top:3px}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.card h3{font-size:13px;margin-bottom:10px;color:var(--text);display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--dim2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px;padding:6px 8px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg0)}
td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:var(--bg1)}
.mono{font-family:var(--mono)}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:10px;border:1px solid var(--border2);color:var(--dim2)}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.err{color:var(--err);border-color:var(--err)} .pill.deal{color:var(--deal);border-color:var(--deal)}
.pill.ebay{color:#e8b34d;border-color:#8a6d2a} .pill.vinted{color:#5ec9b8;border-color:#357;}
.muted{color:var(--dim2)} .right{text-align:right} .center{text-align:center}
.thumb{width:38px;height:38px;object-fit:cover;border-radius:4px;background:var(--bg3);border:1px solid var(--border)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.col{flex:1;min-width:220px}
.empty{color:var(--dim);text-align:center;padding:30px;font-size:12px}
.deal-card{display:flex;gap:10px;background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius);padding:10px;align-items:center}
.deal-card img{width:56px;height:56px;object-fit:cover;border-radius:5px;background:var(--bg3)}
.deal-card .t{font-weight:600;font-size:12px} .deal-card .r{font-size:11px;color:var(--deal)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:9px 16px;border-radius:20px;font-size:12px;transition:.25s;opacity:0;z-index:50}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
#toast.err{border-color:var(--err);color:var(--err)} #toast.ok{border-color:var(--ok);color:var(--ok)}
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:40}
#modalBg.on{display:flex}
#modal{background:var(--bg1);border:1px solid var(--border2);border-radius:8px;padding:18px;width:min(560px,94vw);max-height:90vh;overflow:auto}
#modal h3{margin-bottom:12px}
#modal .field{margin-bottom:8px} #modal .field label{display:block;font-size:11px;color:var(--dim2);margin-bottom:3px}
#modal .field input,#modal .field select,#modal .field textarea{width:100%}
#modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border2);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.scanbox{display:flex;gap:8px;align-items:center;background:var(--bg1);border:1px dashed var(--acc);border-radius:var(--radius);padding:12px}
.scanbox input{flex:1;font-family:var(--mono);font-size:15px}
.photowrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photowrap img{width:80px;height:80px;object-fit:cover;border-radius:5px;border:1px solid var(--border)}
</style>
</head>
<body>
<div class="hdr">
  <span class="brand">◆ STORE</span>
  <span class="muted" style="font-size:11px">UK · eBay + Vinted</span>
  <div class="chips" id="hdrChips"></div>
</div>
<div class="layout">
  <nav class="side" id="nav" data-vera-lhm></nav>
  <main class="content" id="main"><div class="empty"><span class="spin"></span> loading…</div></main>
</div>
<div id="toast"></div>
<div id="modalBg"><div id="modal"></div></div>

<script>
// ── helpers ──────────────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const el = (t,a={},...k)=>{const e=document.createElement(t);for(const K in a){if(K==='html')e.innerHTML=a[K];
  else if(K.startsWith('on'))e.addEventListener(K.slice(2),a[K]);else if(a[K]!=null)e.setAttribute(K,a[K]);}
  for(const c of k){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;};
const esc = s=>(s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const money = (v,c='GBP')=>v==null?'—':(c==='GBP'?'£':c==='USD'?'$':'')+Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = v=>v==null?'—':Number(v).toFixed(1)+'%';
const qs = o=>{const p=new URLSearchParams();for(const k in o)if(o[k]!==''&&o[k]!=null)p.set(k,o[k]);const s=p.toString();return s?'?'+s:'';};
// When embedded from the Stores master (?store=<id>), scope everything to it.
const _SP=new URLSearchParams(location.search);
const STORE=_SP.get('store')||'';
const STORE_NAME=_SP.get('store_name')||'';
// ?embed=1 — the Business panel hosts us: it owns the header + tabs, we hide
// our own chrome and are driven by postMessage {type:'store.nav', id}.
const EMBED=_SP.get('embed')==='1';
function withStore(o){o=o||{};if(STORE)o.store_id=STORE;return o;}
async function api(path,body){const opt=body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{};
  const r=await fetch(path,opt);return r.json().catch(()=>({error:'bad response'}));}
let toastT;function toast(m,k=''){const t=$('#toast');t.textContent=m;t.className='on '+k;clearTimeout(toastT);toastT=setTimeout(()=>t.className='',2800);}
function closeModal(){$('#modalBg').classList.remove('on');$('#modal').innerHTML='';}
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});
function form(title,fields,values,onSubmit){
  const m=$('#modal');m.innerHTML='';m.append(el('h3',{},title));const inp={};
  for(const f of fields){const w=el('div',{class:'field'});w.append(el('label',{},f.label));let i;
    if(f.type==='select'){i=el('select');for(const o of f.options){const op=el('option',{value:o.value!=null?o.value:o});op.textContent=o.label!=null?o.label:o;i.append(op);}}
    else if(f.type==='textarea'){i=el('textarea',{rows:f.rows||3});}
    else if(f.type==='checkbox'){i=el('input',{type:'checkbox'});}
    else{i=el('input',{type:f.type||'text'});if(f.step)i.step=f.step;if(f.placeholder)i.placeholder=f.placeholder;}
    const v=values&&values[f.name]!=null?values[f.name]:(f.default!=null?f.default:'');
    if(f.type==='checkbox')i.checked=!!v;else if(f.type==='textarea'&&typeof v==='object')i.value=JSON.stringify(v,null,2);else i.value=v;
    inp[f.name]=i;w.append(i);m.append(w);}
  const foot=el('div',{class:'foot'});foot.append(el('button',{class:'btn',onclick:closeModal},'Cancel'));
  const save=el('button',{class:'btn pri'},'Save');
  save.addEventListener('click',async()=>{const out={};for(const f of fields){const i=inp[f.name];
    out[f.name]=f.type==='checkbox'?i.checked:(f.type==='number'?(i.value===''?null:parseFloat(i.value)):i.value);}
    save.disabled=true;save.innerHTML='<span class="spin"></span>';await onSubmit(out);});
  foot.append(save);m.append(foot);$('#modalBg').classList.add('on');}

// ── nav ──────────────────────────────────────────────────────────────────────
const SECTIONS=[
  ['dashboard','▦','Dashboard'],['inventory','▤','Inventory'],['station','⚡','Scan Station'],
  ['quicklist','↯','Quick List'],
  ['listings','❖','Listings'],['orders','▥','Orders'],['customers','◎','Customers'],
  ['shipping','➤','Shipping'],['sourcing','⛓','Sourcing'],['market','⌕','Market & Deals'],
  ['tax','£','Tax & Profit'],['settings','⚙','Settings']];
let CUR='dashboard';
function openStation(){const u='/business/intake/panel'+(STORE?('?store='+encodeURIComponent(STORE)+'&store_name='+encodeURIComponent(STORE_NAME)):'');
  window.open(u,'vera_scan_station');}
function buildNav(){const n=$('#nav');n.innerHTML='';for(const [id,ico,label] of SECTIONS){
  const b=el('button',{onclick:()=>go(id)},el('span',{class:'ico'},ico),el('span',{},label));
  if(id==='market')b.append(el('span',{class:'badge',id:'dealBadge'}));
  b.dataset.id=id;b.dataset.section=id;if(id===CUR)b.classList.add('active');n.append(b);}}
function go(id){if(id==='station'){openStation();return;}
  CUR=id;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  if(EMBED)try{parent.postMessage({type:'store.nav.state',id},'*');}catch(_){}
  RENDER[id]&&RENDER[id]();}

// ── header chips + dashboard ─────────────────────────────────────────────────
async function refreshChips(){
  const [d,ship,alerts]=await Promise.all([
    api('/business/store/dashboard'),api('/business/ship/list'+qs({status:''})),
    api('/business/market/alerts'+qs({unseen_only:true,kind:'deal',limit:50}))]);
  const c=$('#hdrChips');c.innerHTML='';
  const CH=[];
  const add=(l,v,cls='')=>{CH.push([l,String(v),cls]);c.append(el('span',{class:'chip '+cls,html:`${l} <b>${v}</b>`}));};
  add('Revenue 30d',money(d.revenue_30d));
  add('Inventory',money(d.inventory_retail_value));
  add('Open orders',d.open_orders);
  add('To post',(ship.to_post||0));
  const nd=(alerts.alerts||[]).length;add('Deals',nd,nd?'deal':'');
  const bd=$('#dealBadge');if(bd){bd.textContent=nd;bd.style.display=nd?'inline-block':'none';}
  if(EMBED)try{parent.postMessage({type:'store.chips',chips:CH},'*');}catch(_){}
}

const RENDER={};
RENDER.dashboard=async()=>{
  const scope=STORE?(' · '+esc(STORE_NAME||'store')):'';
  const m=$('#main');m.innerHTML='<h2>Dashboard</h2><div class="sub">State of the shop'+scope+' · '+new Date().toLocaleDateString()+'</div><div id="dbBody"><span class="spin"></span></div>';
  const [d0,tax,report,alerts]=await Promise.all([
    api('/business/store/dashboard'),api('/business/tax/summary'+qs(withStore({}))),
    api('/business/profit/report'+qs(withStore({period:'month',month:new Date().toISOString().slice(0,7)}))),
    api('/business/market/alerts'+qs({unseen_only:true,limit:6}))]);
  let d=d0;
  if(STORE){ const sg=await api('/business/store/get'+qs({id:STORE})); const s=(sg&&sg.store)||{};
    d=Object.assign({},d0,{inventory_retail_value:s.inventory_retail,inventory_cost_value:s.inventory_cost,open_orders:s.open_orders,low_stock:d0.low_stock}); }
  const t=report.totals||{};
  const b=$('#dbBody');b.innerHTML='';
  const cards=el('div',{class:'cards'});
  const kpi=(l,v,cls='',foot='')=>cards.append(el('div',{class:'kpi'},el('div',{class:'lbl'},l),el('div',{class:'val '+cls},v),foot?el('div',{class:'foot'},foot):null));
  kpi('Revenue (mo)',money(t.revenue),'',`${t.orders||0} orders`);
  kpi('Net profit (mo)',money(t.net_profit),(t.net_profit>=0?'up':'dn'),'margin '+pct(t.margin_pct));
  kpi('Inventory value',money(d.inventory_retail_value),'',`cost ${money(d.inventory_cost_value)}`);
  kpi('Low stock',d.low_stock||0,(d.low_stock?'dn':''));
  kpi('Tax set-aside',money(tax.set_aside),'deal',(tax.tax_year_label||'')+' est.');
  kpi('Est. liability',money(tax.total_liability),'',`IT ${money((tax.income_tax||{}).on_trade)} · NIC ${money(tax.class4_nic)}`);
  b.append(cards);
  // quick actions
  const qa=el('div',{class:'card',style:'margin-top:14px'});qa.append(el('h3',{},'Quick actions'));
  const qrow=el('div',{class:'row'});
  qrow.append(el('button',{class:'btn pri',onclick:()=>go('quicklist')},'↯ New listing'));
  qrow.append(el('button',{class:'btn',onclick:()=>go('shipping')},'➤ Plan Post Office run'));
  qrow.append(el('button',{class:'btn',onclick:async()=>{toast('Scanning market…');const r=await api('/business/watch/scan',{});toast(`${r.new_alerts||0} new deal(s)`, r.new_alerts?'ok':'');refreshChips();}},'⌕ Scan deals now'));
  qrow.append(el('button',{class:'btn',onclick:()=>go('tax')},'£ Tax summary'));
  qa.append(qrow);b.append(qa);
  // deals + platform split
  const split=el('div',{class:'row',style:'margin-top:14px'});
  const dealCard=el('div',{class:'card col'});dealCard.append(el('h3',{},'◆ Latest buy opportunities'));
  if((alerts.alerts||[]).length){for(const a of alerts.alerts){dealCard.append(el('div',{class:'deal-card',style:'margin-bottom:6px'},
    a.photo?el('img',{src:a.photo}):el('div',{class:'thumb'}),
    el('div',{style:'flex:1'},el('div',{class:'t'},esc(a.title||'').slice(0,60)),el('div',{class:'r'},esc(a.reason||'')),
      a.url?el('a',{href:a.url,target:'_blank',style:'font-size:11px'},'view →'):null),
    el('div',{class:'mono'},money(a.price,a.currency))));}}
  else dealCard.append(el('div',{class:'empty'},'No new deals. Add watches in Market & Deals.'));
  split.append(dealCard);
  const pf=el('div',{class:'card col'});pf.append(el('h3',{},'By platform (month)'));
  const tb=el('table');tb.append(el('tr',{},el('th',{},'Platform'),el('th',{class:'right'},'Orders'),el('th',{class:'right'},'Revenue'),el('th',{class:'right'},'Profit')));
  const bp=report.by_platform||{};if(Object.keys(bp).length)for(const k in bp){const p=bp[k];
    tb.append(el('tr',{},el('td',{},el('span',{class:'pill '+k},k)),el('td',{class:'right'},p.orders),el('td',{class:'right mono'},money(p.revenue)),el('td',{class:'right mono'},money(p.net_profit))));}
  else tb.append(el('tr',{},el('td',{colspan:4,class:'empty'},'No sales this month yet')));
  pf.append(tb);split.append(pf);b.append(split);
};

// ── inventory ────────────────────────────────────────────────────────────────
RENDER.inventory=async()=>{
  const m=$('#main');m.innerHTML='<h2>Inventory</h2><div class="sub">Video games · consoles · merch · accessories</div>';
  const tb=el('div',{class:'toolbar'});
  const q=el('input',{placeholder:'search sku / name / barcode',style:'flex:1;min-width:200px'});
  q.addEventListener('keydown',e=>{if(e.key==='Enter')load();});
  tb.append(q,el('button',{class:'btn',onclick:()=>load()},'Search'),
    el('button',{class:'btn pri',onclick:()=>editProduct({})},'+ Add product'),
    el('button',{class:'btn pri',onclick:openStation},'⚡ Scan Station'),
    el('button',{class:'btn',onclick:()=>go('quicklist')},'↯ Quick List'));
  m.append(tb);const wrap=el('div',{id:'invWrap'});m.append(wrap);
  async function load(){wrap.innerHTML='<span class="spin"></span>';
    const r=await api('/business/product/list'+qs(withStore({q:q.value,limit:400})));
    const t=el('table');t.append(el('tr',{},el('th',{},''),el('th',{},'Item'),el('th',{},'Details'),el('th',{class:'right'},'Qty'),el('th',{class:'right'},'Cost'),el('th',{class:'right'},'Price'),el('th',{class:'right'},'Value'),el('th',{class:'right'},'Actions')));
    for(const p of (r.products||[])){const a=p.attributes||{};const img=(a.images||[])[0]||a.cover||'';
      const val=(a.valuation&&(a.valuation.market_gbp||a.valuation.pc_cib))||null;
      const meta=[a.console,a.release_year,(a.edition&&a.edition!=='Standard'?a.edition:''),a.region].filter(Boolean).join(' · ');
      t.append(el('tr',{},
        el('td',{},img?el('img',{class:'thumb',src:img}):el('div',{class:'thumb'})),
        el('td',{},el('div',{style:'font-weight:600'},esc(p.name||'')),el('div',{class:'muted mono',style:'font-size:10px'},esc(p.sku||'')+(p.upc?(' · '+p.upc):''))),
        el('td',{},meta?el('div',{class:'muted',style:'font-size:11px'},esc(meta)):el('span',{class:'muted'},esc(p.category||'—')),
          a.rarity?el('span',{class:'pill deal',style:'font-size:9px'},esc(a.rarity)):null),
        el('td',{class:'right mono'},p.qty_on_hand),
        el('td',{class:'right mono'},money(p.cost,p.currency)),
        el('td',{class:'right mono'},money(p.price,p.currency)),
        el('td',{class:'right mono',title:'market valuation'},val!=null?el('span',{style:'color:var(--deal)'},money(val)):'—'),
        el('td',{class:'right'},
          el('button',{class:'btn sm',onclick:()=>editProduct(p)},'edit'),' ',
          el('button',{class:'btn sm',onclick:()=>repriceOne(p)},'reprice'),' ',

RENDER.quicklist=async()=>{

  // 1 scan

  const qty=el('input',{type:'number',placeholder:'qty',value:'1',style:'width:60px'});

    if(r.error){toast(r.error,'err');return;}

    toast(r.matched?'Bumped stock ✓':'Added to inventory ✓','ok');bc.value='';cost.value='';renderQL();refreshChips();}
  m.append(el('div',{id:'qlBody'}));renderQL();

function renderQL(){const b=$('#qlBody');if(!b)return;b.innerHTML='';
  if(!QL.product){b.append(el('div',{class:'card',style:'margin-top:12px'},el('div',{class:'empty'},'Scan an item to begin, or pick one from Inventory → “list”.')));return;}
  const p=QL.product;
  // 2 photos + vision
  const c2=el('div',{class:'card',style:'margin-top:12px'});c2.append(el('h3',{},'2 · Photos & AI describe — '+esc(p.name||'')));
  const fi=el('input',{type:'file',accept:'image/*',capture:'environment',multiple:true});
  fi.addEventListener('change',async e=>{for(const f of e.target.files){const dataUrl=await fileToDataURL(f);QL.photos.push(dataUrl);}renderQL();});
  const vbtn=el('button',{class:'btn pri',onclick:()=>visionDescribe()},'✦ Describe with AI');
  c2.append(el('div',{class:'row'},fi,vbtn));
  const pw=el('div',{class:'photowrap'});for(const src of QL.photos)pw.append(el('img',{src}));c2.append(pw);
  b.append(c2);
  // 3 draft
  const c3=el('div',{class:'card',style:'margin-top:12px'});c3.append(el('h3',{},'3 · Listing draft'));
  const title=el('input',{value:p.name||'',placeholder:'title (max 80)',maxlength:80,style:'width:100%'});
  const desc=el('textarea',{rows:4},p.description||'');
  const plat=el('select');['ebay','vinted'].forEach(x=>plat.append(el('option',{value:x},x)));
  const cond=el('select');['new','like_new','very_good','good','acceptable','for_parts'].forEach(x=>cond.append(el('option',{value:x},x)));cond.value='good';
  const price=el('input',{type:'number',step:'0.01',placeholder:'auto',style:'width:110px'});
  c3.append(el('label',{class:'fld'},'Title'),title,el('label',{class:'fld'},'Description'),desc,
    el('div',{class:'row',style:'margin-top:8px;align-items:flex-end'},
      el('div',{},el('label',{class:'fld'},'Platform'),plat),
      el('div',{},el('label',{class:'fld'},'Condition'),cond),
      el('div',{},el('label',{class:'fld'},'Price £ (blank=auto)'),price),
      el('button',{class:'btn',onclick:()=>suggestPrice()},'£ suggest'),
      el('button',{class:'btn pri',onclick:()=>makeDraft()},'Create draft & publish')));
  b.append(c3);
  QL._els={title,desc,plat,cond,price};

  async function visionDescribe(){if(!QL.photos.length){toast('Add a photo first');return;}toast('Looking…');
    const r=await api('/business/vision/describe_item',{image_b64:QL.photos[0]});
    if(r.error){toast(r.error,'err');return;}
    const d=r.draft||{};if(d.title)title.value=String(d.title).slice(0,80);
    if(d.description)desc.value=d.description;if(d.condition)cond.value=d.condition;
    toast('Described ✓','ok');}
  async function suggestPrice(){toast('Pricing…');const r=await api('/business/market/reprice',{product_id:p.id});
    if(r.suggested_price){price.value=r.suggested_price;toast('Market median '+money(r.market_median));}else toast(r.error||'no comps','err');}
  async function makeDraft(){
    await api('/business/product/upsert',withStore({id:p.id,name:title.value,description:desc.value,currency:'GBP',attributes:Object.assign({},p.attributes,{images:QL.photos})}));
    const dr=await api('/business/listing/draft',{product_id:p.id,platform:plat.value,condition:cond.value,
      title:title.value,description:desc.value,price:price.value?parseFloat(price.value):null});
    if(dr.error){toast(dr.error,'err');return;}
    toast('Draft ready — publishing…');
    const pub=await api('/business/listing/publish',{listing_id:dr.listing.id});
    if(pub.ok){toast('Published live ✓','ok');QL.product=null;QL.photos=[];go('listings');}
    else{toast('Draft saved. Publish issue: '+((pub.result&&pub.result.error)||pub.error||''),'err');go('listings');}
  }
}

async function draftFrom(p){QL.product=p;QL.photos=(p.attributes&&p.attributes.images)||[];go('quicklist');}

    {name:'label',label:'Label',default:'Vinted UK'},{name:'domain',label:'Region',type:'select',options:['uk','ie','de','fr','es','it','nl','us'],default:'uk'},
    {name:'access_token_web',label:'access_token_web cookie',type:'textarea'},
    {name:'session_cookie',label:'_vinted_fr_session cookie (optional)'},
    {name:'user_id',label:'Your numeric user id (optional)'}],{},
    async o=>{const r=await api('/business/vinted/connect',o);closeModal();toast(r.ok?'Vinted saved':'Error','ok');RENDER.settings();});}
  function ebayDefaults(a){form('eBay listing defaults (for publishing)',[
    {name:'fulfillment_policy_id',label:'Fulfillment (postage) policy id'},
    {name:'payment_policy_id',label:'Payment policy id'},{name:'return_policy_id',label:'Return policy id'},
    {name:'merchant_location_key',label:'Merchant location key'},{name:'category_id',label:'Default leaf category id'},
    {name:'marketplace',label:'Marketplace',default:'EBAY_GB'}],{},
    async o=>{o.account_id=a.id;const r=await api('/business/ebay/defaults',o);closeModal();toast(r.ok?'Saved':'Error','ok');});}
};

// ── boot ─────────────────────────────────────────────────────────────────────
if(STORE){const b=document.querySelector('.brand');if(b)b.textContent='◆ '+(STORE_NAME||'STORE');}
if(EMBED){
  document.querySelector('.hdr').style.display='none';
  document.querySelector('nav.side').style.display='none';
  window.addEventListener('message',e=>{const d=e.data||{};
    if(d.type==='store.nav'&&RENDER[d.id])go(d.id);});
}
buildNav();refreshChips();RENDER.dashboard();
setInterval(refreshChips,60000);
