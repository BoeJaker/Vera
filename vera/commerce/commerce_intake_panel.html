<!DOCTYPE html>
<html lang="en">
<head>
<script>/* vera theme boot */
(function(){try{var d=document.documentElement,S=window.localStorage;
var t=S.getItem('vera:ui:theme');if(t)d.setAttribute('data-theme',t);
var v=JSON.parse(S.getItem('vera:ui:themeVars')||'null');
if(v)for(var k in v)d.style.setProperty(k,v[k]);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vera — Scan Station</title>
<style>
:root{
  --bg0:#141312;--bg1:#1b1917;--bg2:#242120;--bg3:#2e2a28;
  --border:#38332f;--border2:#4a4540;
  --acc:#5a9e8f;--acc2:#8fb87a;
  --up:#3fd0a4;--dn:#e0705a;
  --ok:#6db87a;--err:#c96b6b;--warn:#c9a35a;--deal:#e8b34d;
  --text:#ddd5c8;--dim:#6a6058;--dim2:#8a7e70;
  --mono:'JetBrains Mono','Fira Mono',monospace;
  --sans:'Inter','IBM Plex Sans',system-ui,sans-serif;
  --radius:6px;--radius-sm:4px;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--text);font-family:var(--sans);font-size:13px}
body{display:flex;flex-direction:column;overflow:hidden}
button{font-family:var(--sans);cursor:pointer}
a{color:var(--acc);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
.hdr{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--bg1);flex-shrink:0}
.hdr .brand{font-size:14px;font-weight:700;color:var(--acc);letter-spacing:.4px;white-space:nowrap}
.hdr .chips{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto;align-items:center}
.chip{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--dim2);white-space:nowrap}
.chip b{color:var(--text);font-family:var(--mono)}
input,select,textarea{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:6px 9px;font-family:var(--sans);font-size:13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{width:100%;resize:vertical;font-family:var(--sans);font-size:12.5px;line-height:1.45}
.btn{background:var(--bg2);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius-sm);padding:6px 12px;font-size:12px}
.btn:hover{background:var(--bg3)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#0d0f12;font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.on{background:var(--acc);border-color:var(--acc);color:#0d0f12;font-weight:600}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn:disabled{opacity:.5;cursor:default}
.layout{flex:1;display:flex;min-height:0}
.pane{flex:1;overflow:auto;padding:14px 16px;min-width:0}
.pane.left{border-right:1px solid var(--border);max-width:46%}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.card h3{font-size:12px;margin-bottom:10px;color:var(--dim2);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.card h3 .n{background:var(--acc);color:#0d0f12;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.scanbox{display:flex;gap:8px;align-items:center;background:var(--bg2);border:2px solid var(--acc);border-radius:var(--radius);padding:10px}
.scanbox input{flex:1;font-family:var(--mono);font-size:20px;background:transparent;border:none;letter-spacing:1px}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:var(--radius-sm);overflow:hidden}
.seg button{background:var(--bg2);border:none;color:var(--dim2);padding:5px 12px;font-size:12px}
.seg button.on{background:var(--acc);color:#0d0f12;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:10.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:.4px}
.fld input,.fld select{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
video{width:100%;border-radius:var(--radius);background:#000;aspect-ratio:4/3;object-fit:cover}
.videowrap{position:relative}
.videowrap .live{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);border:1px solid var(--acc);color:var(--acc);border-radius:20px;padding:2px 10px;font-size:11px;font-family:var(--mono);display:none}
.videowrap .live.on{display:block}
.phototray{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.photo{position:relative;width:88px;height:88px;border-radius:var(--radius);overflow:hidden;border:2px solid var(--border);background:var(--bg3)}
.photo.ok{border-color:var(--up)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .acts{position:absolute;inset:auto 0 0 0;display:flex;background:rgba(0,0,0,.55)}
.photo .acts button{flex:1;background:none;border:none;color:#fff;font-size:13px;padding:2px 0}
.photo .acts button:hover{background:rgba(255,255,255,.15)}
.photo .badge{position:absolute;top:2px;left:3px;font-size:12px;color:var(--up);text-shadow:0 0 3px #000}
.grade{display:flex;align-items:center;gap:8px}
.grade input[type=range]{flex:1}
.grade .gv{font-family:var(--mono);font-size:15px;width:34px;text-align:right;color:var(--deal)}
.title-in{width:100%;font-size:15px;font-weight:600}
.cands{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.cand{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 9px;cursor:pointer}
.cand:hover{border-color:var(--acc)}
.cand .conf{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim2)}
.saverow{display:flex;gap:8px;margin-top:12px}
.saverow .btn{flex:1;padding:9px}
.unit-row{display:flex;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.unit-row img{width:40px;height:40px;object-fit:cover;border-radius:4px;background:var(--bg3);flex-shrink:0}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;border:1px solid var(--border2);color:var(--dim2)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--warn);border-color:var(--warn)}
.muted{color:var(--dim2)}.mono{font-family:var(--mono)}.right{text-align:right}
.empty{color:var(--dim);text-align:center;padding:20px;font-size:12px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border2);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:9px 16px;border-radius:20px;font-size:12px;transition:.25s;opacity:0;z-index:50}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
#toast.err{border-color:var(--err);color:var(--err)}#toast.ok{border-color:var(--ok);color:var(--ok)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--dim);margin-right:5px}
.dot.on{background:var(--up);box-shadow:0 0 6px var(--up)}
kbd{background:var(--bg3);border:1px solid var(--border2);border-radius:3px;padding:0 5px;font-family:var(--mono);font-size:10px;color:var(--dim2)}
.hint{font-size:10.5px;color:var(--dim);margin-top:6px;line-height:1.5}
@media(max-width:820px){.layout{flex-direction:column}.pane.left{max-width:none;border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<div class="hdr">
  <span class="brand">◆ SCAN STATION</span>
  <span class="muted" id="storeLbl" style="font-size:11px">Fast per-unit intake</span>
  <div class="chips" id="chips">
    <button class="btn sm" id="voiceBtn" title="Voice commands (V)"><span class="dot"></span>🎤 Voice</button>
    <button class="btn sm" id="ttsBtn" title="Read fields aloud">🔊 Read-back</button>
    <button class="btn sm" id="cfgBtn" title="Settings">⚙</button>
    <span class="chip">Session <b id="cSess">0</b></span>
    <a class="btn sm" id="backLink" href="#">↩ Store</a>
  </div>
</div>
<div class="layout">
  <div class="pane left" id="paneL"></div>
  <div class="pane" id="paneR"></div>
</div>
<div id="toast"></div>
<canvas id="cap" style="display:none"></canvas>

<script>
// ── helpers ──────────────────────────────────────────────────────────────────
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const K in a){if(K==='html')e.innerHTML=a[K];
  else if(K.startsWith('on'))e.addEventListener(K.slice(2),a[K]);else if(a[K]!=null)e.setAttribute(K,a[K]);}
  for(const c of k){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const money=(v,c='GBP')=>v==null||v===''?'—':(c==='GBP'?'£':c==='USD'?'$':'')+Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const qs=o=>{const p=new URLSearchParams();for(const k in o)if(o[k]!==''&&o[k]!=null)p.set(k,o[k]);const s=p.toString();return s?'?'+s:'';};
async function api(path,body){const opt=body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{};
  const r=await fetch(path,opt);return r.json().catch(()=>({error:'bad response'}));}
let toastT;function toast(m,k=''){const t=$('#toast');t.textContent=m;t.className='on '+k;clearTimeout(toastT);toastT=setTimeout(()=>t.className='',2600);}
const _SP=new URLSearchParams(location.search);
const STORE=_SP.get('store')||'', STORE_NAME=_SP.get('store_name')||'';
function withStore(o){o=o||{};if(STORE)o.store_id=STORE;return o;}
const num=v=>{if(v==null)return null;const n=parseFloat(String(v).replace(/[^0-9.]/g,''));return isNaN(n)?null:n;};

// ── config (persisted) ───────────────────────────────────────────────────────
const DEF={autoAdvanceN:3,autoAssess:true,autoPrice:false,tts:false,mode:'used',
  category:'video_game',condition:'good'};
let CFG=Object.assign({},DEF,JSON.parse(localStorage.getItem('vera:intake:cfg')||'{}'));
function saveCfg(){localStorage.setItem('vera:intake:cfg',JSON.stringify(CFG));}
const CONDITIONS=['new','like_new','very_good','good','acceptable','for_parts'];
const COMPLETENESS=['sealed','cib','boxed_no_manual','cart_only','disc_only','loose','n_a'];
const CATEGORIES=['video_game','console','accessory','controller','amiibo','trading_card','collectible','merch','other'];
const CONDLABEL={new:'New',like_new:'Like new',very_good:'Very good',good:'Good',acceptable:'Acceptable',for_parts:'For parts'};

// ── TTS ──────────────────────────────────────────────────────────────────────
function say(t){if(!CFG.tts||!t||!window.speechSynthesis)return;try{const u=new SpeechSynthesisUtterance(String(t));
  u.rate=1.08;u.pitch=1;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);}catch(e){}}

// ── state ────────────────────────────────────────────────────────────────────
const S={product:null,upc:'',photos:[],cands:null,session:[],busy:false,dirty:false};
const F={}; // form input elements, filled by buildForm

// ── LEFT pane: scan + webcam + photos ────────────────────────────────────────
function buildLeft(){
  const p=$('#paneL');p.innerHTML='';
  // 1 · scan
  const c1=el('div',{class:'card'});
  c1.append(el('h3',{},el('span',{class:'n'},'1'),'Scan or identify'));
  const modeSeg=el('div',{class:'seg'});
  for(const m of ['new','used']){const b=el('button',{onclick:()=>{CFG.mode=m;saveCfg();buildLeft();buildRight();}},m==='new'?'New':'Used');
    if(CFG.mode===m)b.classList.add('on');modeSeg.append(b);}
  const catSel=el('select',{onchange:e=>{CFG.category=e.target.value;saveCfg();}});
  for(const c of CATEGORIES){const o=el('option',{value:c},c.replace(/_/g,' '));if(c===CFG.category)o.selected=true;catSel.append(o);}
  c1.append(el('div',{class:'row',style:'margin-bottom:10px'},
    el('div',{class:'fld'},el('label',{},'Mode'),modeSeg),
    el('div',{class:'fld',style:'flex:1'},el('label',{},'Category'),catSel)));
  const sb=el('div',{class:'scanbox'});
  const bc=el('input',{id:'bc',placeholder:'scan barcode…',autocomplete:'off',autofocus:true});
  bc.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();onScan(bc.value.trim());}});
  sb.append(bc,el('button',{class:'btn pri',onclick:()=>onScan(bc.value.trim())},'Look up'));
  c1.append(sb);
  c1.append(el('div',{class:'hint',html:'USB/Bluetooth scanners type like a keyboard — just scan while this box is focused. '+
    'Scanning a new code auto-saves the current unit and starts the next. <kbd>F2</kbd> refocus · <kbd>Space</kbd> capture photo · <kbd>Ctrl+Enter</kbd> save.'}));
  p.append(c1);
  // 2 · camera
  const c2=el('div',{class:'card'});
  c2.append(el('h3',{},el('span',{class:'n'},'2'),'Camera',
    el('span',{style:'margin-left:auto;font-weight:400;text-transform:none;letter-spacing:0'},
      el('button',{class:'btn sm',id:'idBtn',onclick:identifyByPhoto,title:'Identify a barcode-less item (cartridge/disc) from the picture'},'✦ Identify by photo'))));
  const devSel=el('select',{id:'devSel',style:'flex:1;min-width:120px'});
  const camRow=el('div',{class:'row',style:'margin-bottom:8px'},
    el('div',{class:'fld',style:'flex:1'},el('label',{},'Device (DroidCam, webcam…)'),devSel),
    el('button',{class:'btn',id:'camBtn',onclick:toggleCam},'▶ Start'));
  c2.append(camRow);
  const vw=el('div',{class:'videowrap'});
  const v=el('video',{id:'vid',autoplay:true,muted:true,playsinline:true});
  vw.append(v,el('div',{class:'live',id:'liveBadge'},'⌕ scanning…'));
  c2.append(vw);
  c2.append(el('div',{class:'row',style:'margin-top:8px'},
    el('button',{class:'btn pri',id:'snapBtn',onclick:()=>capturePhoto(),disabled:true},'⚑ Capture photo'),
    el('label',{class:'btn',style:'position:relative;overflow:hidden'},'⁘ Files',
      el('input',{type:'file',accept:'image/*',multiple:true,capture:'environment',
        style:'position:absolute;inset:0;opacity:0;cursor:pointer',
        onchange:e=>{for(const f of e.target.files)fileToDataURL(f).then(d=>addPhoto(d));}})),
    el('span',{class:'muted',id:'liveOnOff',style:'font-size:11px;align-self:center'},'live barcode: —')));
  p.append(c2);
  // 3 · photos
  const c3=el('div',{class:'card'});
  c3.append(el('h3',{},el('span',{class:'n'},'3'),'Photos',
    el('span',{class:'muted',id:'photoCount',style:'margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none'})));
  c3.append(el('div',{class:'phototray',id:'tray'}));
  c3.append(el('div',{class:'hint',html:`Approve <span class="mono">✓</span> the good shots. After <b>${CFG.autoAdvanceN}</b> approved, the item is auto-assessed and jumps to Save. Change the number in <kbd>⚙</kbd>.`}));
  p.append(c3);
  renderTray();
}

// ── RIGHT pane: unit form + session ──────────────────────────────────────────
function fld(key,label,node){F[key]=node;return el('div',{class:'fld'},el('label',{},label),node);}
function buildRight(){
  const p=$('#paneR');p.innerHTML='';const used=CFG.mode==='used';
  const c=el('div',{class:'card'});
  c.append(el('h3',{},el('span',{class:'n'},'4'),used?'Unit details':'Item details',
    el('span',{style:'margin-left:auto;font-weight:400;text-transform:none;letter-spacing:0'},
      el('button',{class:'btn sm',id:'assessBtn',onclick:assessUnit,title:'Vision model grades condition + writes the description'},'✦ Assess & describe'))));
  const title=el('input',{class:'title-in',placeholder:'title (max 80)',maxlength:80});
  title.addEventListener('input',()=>S.dirty=true);
  c.append(fld('title','Title',title));
  const grid=el('div',{class:'grid3',style:'margin-top:10px'});
  const platform=el('input',{placeholder:'e.g. SNES'});
  grid.append(fld('platform','Platform',platform));
  const cond=el('select');for(const x of CONDITIONS){const o=el('option',{value:x},CONDLABEL[x]);if(x===CFG.condition)o.selected=true;cond.append(o);}
  grid.append(fld('condition','Condition',cond));
  const comp=el('select');for(const x of COMPLETENESS){comp.append(el('option',{value:x},x.replace(/_/g,' ')));}
  grid.append(fld('completeness','Completeness',comp));
  c.append(grid);
  // grade
  const grange=el('input',{type:'range',min:0,max:10,step:'0.5',value:0});
  const gv=el('span',{class:'gv'},'0');
  grange.addEventListener('input',()=>{gv.textContent=grange.value;S.dirty=true;});
  F.grade=grange;
  if(used)c.append(el('div',{style:'margin-top:10px'},el('label',{class:'muted',style:'font-size:10.5px;text-transform:uppercase;letter-spacing:.4px'},'Grade (0–10)'),
    el('div',{class:'grade'},grange,gv)));
  const grid2=el('div',{class:'grid3',style:'margin-top:10px'});
  grid2.append(fld('cost',used?'Cost £':'Unit cost £',el('input',{type:'number',step:'0.01',placeholder:'0.00'})));
  const price=el('input',{type:'number',step:'0.01',placeholder:'auto'});
  grid2.append(fld('price','Price £',price));
  grid2.append(el('div',{class:'fld'},el('label',{},' '),el('button',{class:'btn',onclick:suggestPrice},'£ suggest')));
  c.append(grid2);
  const grid3=el('div',{class:'grid2',style:'margin-top:10px'});
  grid3.append(fld('location','Location / bin',el('input',{placeholder:'e.g. A3'})));
  grid3.append(fld('qty',used?'Copies (this scan)':'Quantity',el('input',{type:'number',value:used?1:1,min:1})));
  c.append(grid3);
  const desc=el('textarea',{rows:4,placeholder:'description (✦ Assess writes this from the photos + details)'});
  c.append(el('div',{style:'margin-top:10px'},el('label',{class:'muted',style:'font-size:10.5px;text-transform:uppercase;letter-spacing:.4px'},'Description'),desc));
  F.description=desc;
  // save row
  const row=el('div',{class:'saverow'});
  row.append(el('button',{class:'btn pri',id:'saveBtn',onclick:()=>saveUnit(false)},'✓ Save & next'),
    el('button',{class:'btn',onclick:()=>saveUnit(true)},'✓ Save & list'),
    el('button',{class:'btn',onclick:clearForm},'✕ Clear'));
  c.append(row);
  // enter-to-advance across fields
  const order=['title','platform','condition','completeness','cost','price','location'];
  for(const k of order){const node=F[k];if(!node)continue;node.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();
    const i=order.indexOf(k);const nx=order.slice(i+1).map(x=>F[x]).find(Boolean);if(nx)nx.focus();else saveUnit(false);}});}
  p.append(c);
  // session
  const sc=el('div',{class:'card'});
  sc.append(el('h3',{},'Added this session',el('span',{class:'muted',id:'sessVal',style:'margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none'})));
  sc.append(el('div',{id:'sessList'}));
  p.append(sc);
  renderSession();
}

function readForm(){return{title:F.title.value.trim(),platform:F.platform.value.trim(),
  condition:F.condition.value,completeness:F.completeness.value,
  grade:num(F.grade.value)||0,cost:num(F.cost.value)||0,price:num(F.price.value),
  location:F.location.value.trim(),description:F.description.value.trim(),
  qty:Math.max(1,parseInt(F.qty.value)||1)};}
function fillForm(d){if(d.title!=null)F.title.value=String(d.title).slice(0,80);
  if(d.platform!=null)F.platform.value=d.platform;
  if(d.condition&&CONDITIONS.includes(d.condition))F.condition.value=d.condition;
  if(d.completeness&&COMPLETENESS.includes(d.completeness))F.completeness.value=d.completeness;
  if(d.grade!=null){F.grade.value=d.grade;F.grade.dispatchEvent(new Event('input'));}
  if(d.price!=null&&d.price!=='')F.price.value=d.price;
  if(d.cost!=null&&d.cost!=='')F.cost.value=d.cost;
  if(d.description!=null)F.description.value=d.description;
  if(d.location!=null)F.location.value=d.location;}

// ── scan / lookup ────────────────────────────────────────────────────────────
async function onScan(code){
  if(!code)return;
  // scan-to-proceed: commit the in-progress unit (saves + clears the form) first
  if(S.dirty&&(F.title.value.trim()||S.photos.length)){await saveUnit(false);}
  $('#bc').value=code;S.upc=code;S.busy=true;toast('Looking up '+code+'…');
  const r=await api('/business/barcode/lookup',{code});
  S.busy=false;$('#bc').value='';
  if(r.error||!r.product){toast('No match — type the title','warn');F.title.focus();say('No match found');return;}
  const pr=r.product;S.product=null;
  fillForm({title:pr.title,platform:pr.platform||pr.brand||''});
  if((pr.images||[]).length&&!S.photos.length){for(const u of pr.images.slice(0,1))addPhoto(u,true);}
  S.dirty=true;toast('Found: '+(pr.title||'').slice(0,48),'ok');say('Found '+(pr.title||''));
  (CFG.mode==='used'?F.condition:F.price).focus();
}

// ── no-barcode identify ──────────────────────────────────────────────────────
async function identifyByPhoto(){
  let img=S.photos.find(p=>p.approved)||S.photos[0];
  if(!img){img=await capturePhoto(true);}                       // grab a frame if none
  if(!img){toast('Capture or add a photo first','warn');return;}
  toast('Identifying…');const r=await api('/business/vision/identify_item',
    {image_b64:img.data||'',image_url:img.url||'',category:CFG.category});
  if(r.error){toast(r.error,'err');return;}
  if(r.barcode){toast('Barcode read from photo: '+r.barcode,'ok');onScan(r.barcode);return;}
  S.cands=r.candidates||[];renderCands();
  if(S.cands.length){say('Best guess '+S.cands[0].title);}else toast('Could not identify','warn');
}
function renderCands(){let host=$('#candHost');
  if(!host){host=el('div',{id:'candHost',class:'card'});host.append(el('h3',{},'Pick the match'));
    host.append(el('div',{class:'cands',id:'candList'}));$('#paneR').prepend(host);}
  const list=$('#candList');list.innerHTML='';
  for(const c of (S.cands||[])){list.append(el('div',{class:'cand',onclick:()=>{
      fillForm({title:c.title,platform:c.platform});if(c.category)CFG.category=c.category;
      S.dirty=true;host.remove();toast('Set: '+(c.title||'').slice(0,40),'ok');F.condition.focus();}},
    el('div',{},el('div',{style:'font-weight:600'},esc(c.title||'?')),
      el('div',{class:'muted',style:'font-size:11px'},esc([c.platform,c.region].filter(Boolean).join(' · '))||'—')),
    el('span',{class:'conf'},Math.round((c.confidence||0)*100)+'%')));}
  if(!(S.cands||[]).length)list.append(el('div',{class:'empty'},'No candidates'));
}

// ── vision assess ────────────────────────────────────────────────────────────
async function assessUnit(){
  const img=S.photos.find(p=>p.approved)||S.photos[0];
  if(!img){toast('Add a photo to assess','warn');return;}
  const b=$('#assessBtn');if(b){b.disabled=true;b.innerHTML='<span class="spin"></span>';}
  const ctx={title:F.title.value.trim(),platform:F.platform.value.trim(),
    category:CFG.category,completeness:F.completeness.value};
  const r=await api('/business/vision/assess_unit',
    {image_b64:img.data||'',image_url:img.url||'',context:ctx});
  if(b){b.disabled=false;b.textContent='✦ Assess & describe';}
  if(r.error){toast(r.error,'err');return;}
  const d=r.draft||{};fillForm(d);S.dirty=true;
  toast('Graded '+(d.condition?CONDLABEL[d.condition]:'')+(d.grade!=null?(' · '+d.grade+'/10'):''),'ok');
  say((d.condition?CONDLABEL[d.condition]+', ':'')+(d.grade!=null?('grade '+d.grade+'. '):'')+(d.description||''));
}
async function suggestPrice(){toast('Pricing…');
  const t=F.title.value.trim();if(!t){toast('Enter a title first','warn');return;}
  const r=await api('/business/market/search',{query:t,platform:'any',limit:30}).catch(()=>({}));
  const med=r&&r.combined&&r.combined.median;
  if(med){F.price.value=med.toFixed(2);toast('Market median '+money(med),'ok');say('Suggested '+money(med));}
  else toast('No comparable sales found','warn');
}

// ── save ─────────────────────────────────────────────────────────────────────
async function saveUnit(alsoList,silent){
  const d=readForm();
  if(!d.title&&!S.upc){toast('Nothing to save — scan or type a title','warn');return;}
  const btn=$('#saveBtn');if(btn&&!silent){btn.disabled=true;btn.innerHTML='<span class="spin"></span>';}
  const photos=S.photos.filter(p=>p.approved).map(p=>p.url||p.data);
  if(!photos.length&&S.photos.length)photos.push(...S.photos.map(p=>p.url||p.data)); // fall back to all if none approved
  const qty=CFG.mode==='used'?d.qty:1;
  let firstUnit=null,made=0;
  for(let i=0;i<qty;i++){
    const body=withStore({title:d.title,upc:S.upc||'',category:CFG.category,platform:d.platform,
      condition:CFG.mode==='new'?'new':d.condition,grade:d.grade,completeness:d.completeness,
      cost:d.cost,price:d.price,currency:'GBP',photos,location:d.location,
      description:d.description,auto_describe:false,auto_price:CFG.autoPrice&&d.price==null});
    const r=await api('/business/unit/intake',body);
    if(r.error){toast(r.error,'err');if(btn){btn.disabled=false;btn.textContent='✓ Save & next';}return;}
    made++;firstUnit=firstUnit||r.unit;
    if(!silent)S.session.unshift(r.unit);
  }
  if(alsoList&&firstUnit){toast('Listing…');const lr=await api('/business/unit/draft_listing',{unit_id:firstUnit.id,platform:'ebay'});
    toast(lr.error?('Saved. List issue: '+lr.error):'Saved & drafted listing','ok');}
  else if(!silent)toast('Saved '+made+' unit'+(made>1?'s':'')+' ✓','ok');
  if(!silent)say('Saved');
  refreshChips();renderSession();
  if(!silent){clearForm();$('#bc').focus();}
}
function clearForm(){S.product=null;S.upc='';S.photos=[];S.cands=null;S.dirty=false;
  const h=$('#candHost');if(h)h.remove();
  if(F.title){F.title.value='';F.platform.value='';F.completeness.value='sealed';F.condition.value=CFG.condition;
    F.grade.value=0;F.grade.dispatchEvent(new Event('input'));F.cost.value='';F.price.value='';
    F.location.value='';F.description.value='';F.qty.value=1;}
  renderTray();
  const sb=$('#saveBtn');if(sb){sb.disabled=false;sb.textContent='✓ Save & next';}
}

// ── photos ───────────────────────────────────────────────────────────────────
function fileToDataURL(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f);});}
function addPhoto(dataOrUrl,approved){const isUrl=/^(https?:|\/)/.test(dataOrUrl);
  const ph={data:isUrl?'':dataOrUrl,url:isUrl?dataOrUrl:'',approved:!!approved};
  S.photos.push(ph);S.dirty=true;renderTray();
  if(!isUrl)persistPhoto(ph);                       // upload in background → get a durable URL
  checkAutoAdvance();return ph;}
async function persistPhoto(ph){try{const b64=(ph.data||'').split(',').pop();
  const r=await api('/images/store',{image_b64:b64,source:'img2img',prompt:'unit photo'});
  if(r&&r.url){ph.url=r.url;}}catch(e){}}
function renderTray(){const tray=$('#tray');if(!tray)return;tray.innerHTML='';
  S.photos.forEach((ph,i)=>{const box=el('div',{class:'photo'+(ph.approved?' ok':'')});
    box.append(el('img',{src:ph.data||ph.url}));
    if(ph.approved)box.append(el('div',{class:'badge'},'✓'));
    const acts=el('div',{class:'acts'});
    acts.append(el('button',{title:'approve',onclick:()=>{ph.approved=!ph.approved;renderTray();checkAutoAdvance();}},ph.approved?'✓':'○'),
      el('button',{title:'remove',onclick:()=>{S.photos.splice(i,1);renderTray();}},'✕'));
    box.append(acts);tray.append(box);});
  const nApp=S.photos.filter(p=>p.approved).length;
  const pc=$('#photoCount');if(pc)pc.textContent=S.photos.length?`${nApp} approved / ${S.photos.length}`:'';
  const sb=$('#snapBtn');if(sb)sb.disabled=!S._camOn;
}
let _advancing=false;
async function checkAutoAdvance(){const nApp=S.photos.filter(p=>p.approved).length;
  if(_advancing||nApp<CFG.autoAdvanceN)return;_advancing=true;
  toast(nApp+' photos approved — assessing…','ok');
  if(CFG.autoAssess){await assessUnit();}
  const sb=$('#saveBtn');if(sb)sb.focus();
  say('Photos captured. Ready to save.');
  setTimeout(()=>_advancing=false,1500);
}

// ── webcam + live barcode ────────────────────────────────────────────────────
let _stream=null,_detector=null,_rafScan=null;
async function toggleCam(){if(S._camOn){stopCam();return;}
  try{
    _stream=await navigator.mediaDevices.getUserMedia({video:selectedDeviceConstraint(),audio:false});
    $('#vid').srcObject=_stream;S._camOn=true;$('#camBtn').textContent='■ Stop';$('#camBtn').classList.add('warn');
    await populateDevices();startLiveScan();renderTray();
  }catch(e){toast('Camera error: '+e.message,'err');}
}
function selectedDeviceConstraint(){const id=($('#devSel')||{}).value;
  return id?{deviceId:{exact:id}}:{facingMode:'environment'};}
function stopCam(){if(_stream){_stream.getTracks().forEach(t=>t.stop());}_stream=null;S._camOn=false;
  if(_rafScan)cancelAnimationFrame(_rafScan);$('#camBtn').textContent='▶ Start';$('#camBtn').classList.remove('warn');
  $('#liveBadge').classList.remove('on');const l=$('#liveOnOff');if(l)l.textContent='live barcode: —';renderTray();}
async function populateDevices(){try{const devs=await navigator.mediaDevices.enumerateDevices();
  const sel=$('#devSel');const cur=sel.value;sel.innerHTML='';
  devs.filter(d=>d.kind==='videoinput').forEach((d,i)=>sel.append(el('option',{value:d.deviceId},d.label||('Camera '+(i+1)))));
  if(cur)sel.value=cur;
  sel.onchange=()=>{if(S._camOn){stopCam();toggleCam();}};}catch(e){}}
function startLiveScan(){
  if(!('BarcodeDetector'in window)){const l=$('#liveOnOff');if(l)l.textContent='live barcode: not supported (use scanner)';return;}
  if(!_detector){try{_detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});}catch(e){_detector=new BarcodeDetector();}}
  $('#liveBadge').classList.add('on');const l=$('#liveOnOff');if(l)l.textContent='live barcode: on';
  let last='',lastT=0;
  const loop=async()=>{if(!S._camOn){return;}
    try{const codes=await _detector.detect($('#vid'));
      if(codes&&codes.length){const v=(codes[0].rawValue||'').trim();const now=Date.now();
        if(v&&(v!==last||now-lastT>3000)){last=v;lastT=now;
          if(/^\d{8,14}$/.test(v)){navigator.vibrate&&navigator.vibrate(60);onScan(v);}}}
    }catch(e){}
    _rafScan=requestAnimationFrame(loop);};
  loop();
}
async function capturePhoto(returnOnly){if(!S._camOn){toast('Start the camera first','warn');return null;}
  const v=$('#vid'),cv=$('#cap');cv.width=v.videoWidth||640;cv.height=v.videoHeight||480;
  cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);
  const data=cv.toDataURL('image/jpeg',0.85);
  if(returnOnly){const ph={data,url:'',approved:true};return ph;}
  const ph=addPhoto(data,true);toast('Captured','ok');return ph;}

// ── session list + chips ─────────────────────────────────────────────────────
function renderSession(){const host=$('#sessList');if(!host)return;host.innerHTML='';
  if(!S.session.length){host.append(el('div',{class:'empty'},'Units you add appear here.'));}
  let val=0;
  for(const u of S.session.slice(0,25)){val+=Number(u.price)||0;
    host.append(el('div',{class:'unit-row'},
      el('img',{src:(u.photos||[])[0]||''}),
      el('div',{style:'flex:1;min-width:0'},el('div',{style:'font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'},esc(u.title||'')),
        el('div',{class:'muted',style:'font-size:11px'},esc(CONDLABEL[u.condition]||u.condition||'')+(u.grade?(' · '+u.grade+'/10'):'')+' · '+money(u.price))),
      el('button',{class:'btn sm',onclick:async()=>{const r=await api('/business/unit/draft_listing',{unit_id:u.id,platform:'ebay'});toast(r.error||'Listed draft','ok');}},'list'),
      el('button',{class:'btn sm danger',onclick:async()=>{await api('/business/unit/delete',{id:u.id});S.session=S.session.filter(x=>x.id!==u.id);renderSession();refreshChips();}},'✕')));}
  const sv=$('#sessVal');if(sv)sv.textContent=S.session.length?(S.session.length+' · '+money(val)):'';
  const cs=$('#cSess');if(cs)cs.textContent=S.session.length;
}
function refreshChips(){renderSession();}

// ── voice commands ───────────────────────────────────────────────────────────
let _rec=null,_recOn=false;
function condFromWords(w){w=w.toLowerCase();
  if(/mint|sealed|brand new|\bnew\b/.test(w))return 'new';
  if(/like new|near mint|excellent/.test(w))return 'like_new';
  if(/very good/.test(w))return 'very_good';
  if(/for parts|broken|faulty|spares/.test(w))return 'for_parts';
  if(/acceptable|poor|worn/.test(w))return 'acceptable';
  if(/\bgood\b/.test(w))return 'good';return null;}
function applyVoice(t){t=t.trim();if(!t)return;const l=t.toLowerCase();
  let m;
  if((m=l.match(/(?:condition|grade condition)\s+(.+)/))){const c=condFromWords(m[1]);if(c){F.condition.value=c;say('Condition '+CONDLABEL[c]);toast('Condition '+CONDLABEL[c],'ok');}return;}
  if((m=l.match(/grade\s+([\d.]+)/))){F.grade.value=m[1];F.grade.dispatchEvent(new Event('input'));say('Grade '+m[1]);return;}
  if((m=l.match(/(?:price|sell for|asking)\s+([\d. ]+)/))){const n=num(m[1]);if(n!=null){F.price.value=n;say('Price '+money(n));}return;}
  if((m=l.match(/cost\s+([\d. ]+)/))){const n=num(m[1]);if(n!=null){F.cost.value=n;say('Cost '+money(n));}return;}
  if((m=l.match(/(?:location|bin|shelf)\s+(.+)/))){F.location.value=m[1].toUpperCase();say('Location '+m[1]);return;}
  if((m=l.match(/(?:platform|console|system)\s+(.+)/))){F.platform.value=m[1];say('Platform '+m[1]);return;}
  if((m=l.match(/(?:title|name it|it's|its|called)\s+(.+)/))){F.title.value=m[1].slice(0,80);say('Title set');return;}
  if(/complete in box|cib|boxed with manual/.test(l)){F.completeness.value='cib';say('Complete in box');return;}
  if(/cart(ridge)? only|loose cart/.test(l)){F.completeness.value='cart_only';say('Cartridge only');return;}
  if(/disc only/.test(l)){F.completeness.value='disc_only';return;}
  if(/\bsealed\b/.test(l)){F.completeness.value='sealed';return;}
  if(/capture|take (a )?photo|snap|shoot/.test(l)){capturePhoto();return;}
  if(/identify|what is this|what's this/.test(l)){identifyByPhoto();return;}
  if(/assess|describe|grade it|check condition/.test(l)){assessUnit();return;}
  if(/suggest price|price it|what.s it worth/.test(l)){suggestPrice();return;}
  if(/read( back)?|read fields/.test(l)){readBack();return;}
  if(/list it|save and list/.test(l)){saveUnit(true);return;}
  if(/save|next|done/.test(l)){saveUnit(false);return;}
  if(/\bused mode|switch to used\b/.test(l)){CFG.mode='used';saveCfg();buildLeft();buildRight();return;}
  if(/\bnew mode|switch to new\b/.test(l)){CFG.mode='new';saveCfg();buildLeft();buildRight();return;}
  toast('“'+t+'”','');
}
function readBack(){const d=readForm();const parts=[d.title,'condition '+CONDLABEL[d.condition],
  d.grade?('grade '+d.grade):'',d.price!=null?('price '+money(d.price)):''].filter(Boolean);
  CFG.tts=true;say(parts.join(', '));}
function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Voice not supported in this browser','warn');return;}
  if(_recOn){_rec&&_rec.stop();return;}
  _rec=new SR();_rec.continuous=true;_rec.interimResults=false;_rec.lang='en-GB';
  _rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)applyVoice(e.results[i][0].transcript);};
  _rec.onend=()=>{if(_recOn){try{_rec.start();}catch(e){}}};        // auto-restart
  _rec.onerror=ev=>{if(ev.error==='not-allowed'){toast('Mic blocked','err');setVoice(false);}};
  _rec.start();setVoice(true);
}
function setVoice(on){_recOn=on;const b=$('#voiceBtn');b.classList.toggle('on',on);
  b.querySelector('.dot').classList.toggle('on',on);toast(on?'Voice on — say a command':'Voice off',on?'ok':'');}

// ── settings ─────────────────────────────────────────────────────────────────
function openCfg(){const p=$('#paneR');
  const wrap=el('div',{class:'card',id:'cfgCard'});
  wrap.append(el('h3',{},'Settings',el('button',{class:'btn sm',style:'margin-left:auto',onclick:()=>wrap.remove()},'close')));
  const n=el('input',{type:'number',min:1,max:8,value:CFG.autoAdvanceN,style:'width:70px'});
  const aA=el('input',{type:'checkbox'});aA.checked=CFG.autoAssess;
  const aP=el('input',{type:'checkbox'});aP.checked=CFG.autoPrice;
  const tt=el('input',{type:'checkbox'});tt.checked=CFG.tts;
  const cond=el('select');for(const x of CONDITIONS){const o=el('option',{value:x},CONDLABEL[x]);if(x===CFG.condition)o.selected=true;cond.append(o);}
  const g=el('div',{class:'grid2'});
  g.append(el('div',{class:'fld'},el('label',{},'Auto-advance after N approved photos'),n),
    el('div',{class:'fld'},el('label',{},'Default condition'),cond),
    el('label',{style:'display:flex;gap:8px;align-items:center;font-size:12px'},aA,'Auto-assess on advance'),
    el('label',{style:'display:flex;gap:8px;align-items:center;font-size:12px'},aP,'Auto-suggest price on save'),
    el('label',{style:'display:flex;gap:8px;align-items:center;font-size:12px'},tt,'Read fields aloud (TTS)'));
  wrap.append(g);
  wrap.append(el('div',{style:'margin-top:12px'},el('button',{class:'btn pri',onclick:()=>{
    CFG.autoAdvanceN=Math.max(1,parseInt(n.value)||3);CFG.autoAssess=aA.checked;CFG.autoPrice=aP.checked;
    CFG.tts=tt.checked;CFG.condition=cond.value;saveCfg();wrap.remove();buildLeft();buildRight();
    $('#ttsBtn').classList.toggle('on',CFG.tts);toast('Saved','ok');}},'Save settings')));
  p.prepend(wrap);
}

// ── boot ─────────────────────────────────────────────────────────────────────
$('#voiceBtn').onclick=toggleVoice;
$('#ttsBtn').onclick=()=>{CFG.tts=!CFG.tts;saveCfg();$('#ttsBtn').classList.toggle('on',CFG.tts);toast(CFG.tts?'Read-back on':'Read-back off',CFG.tts?'ok':'');};
$('#cfgBtn').onclick=openCfg;
$('#ttsBtn').classList.toggle('on',CFG.tts);
$('#backLink').href='/business/store/panel'+(STORE?('?store='+encodeURIComponent(STORE)+'&store_name='+encodeURIComponent(STORE_NAME)):'');
if(STORE_NAME)$('#storeLbl').textContent=STORE_NAME;
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''));
  if(e.key==='F2'){e.preventDefault();$('#bc').focus();$('#bc').select();}
  else if(e.code==='Space'&&!typing&&S._camOn){e.preventDefault();capturePhoto();}
  else if(e.key==='Enter'&&e.ctrlKey){e.preventDefault();saveUnit(false);}
});
buildLeft();buildRight();$('#bc')&&$('#bc').focus();
</script>
