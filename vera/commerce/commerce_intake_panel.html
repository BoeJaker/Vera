<!DOCTYPE html>
<html lang="en">
<head>
<script>/* vera theme boot — coherence-aware: only replay cached vars when they belong
   to the active theme id, else let themes.css [data-theme] win (avoids the
   dark-vars-over-ash "black on black" flash). vera-ui.js reconciles after load. */
(function(){try{var d=document.documentElement,S=window.localStorage;
var t=S.getItem('vera:ui:theme');if(t)d.setAttribute('data-theme',t);
var vfor=S.getItem('vera:ui:themeVarsFor');
if(t&&vfor===t){var v=JSON.parse(S.getItem('vera:ui:themeVars')||'null');
  if(v)for(var k in v)d.style.setProperty(k,v[k]);}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vera — Scan Station</title>
<style>
:root{
  --bg0:#141312;--bg1:#1b1917;--bg2:#242120;--bg3:#2e2a28;
  --border:#38332f;--border2:#4a4540;
  --acc:#5a9e8f;--acc2:#8fb87a;
  --up:#3fd0a4;--dn:#e0705a;
  --ok:#6db87a;--err:#c96b6b;--warn:#c9a35a;--deal:#e8b34d;
  --text:#ddd5c8;--dim:#6a6058;--dim2:#8a7e70;
  --mono:'JetBrains Mono','Fira Mono',monospace;
  --sans:'Inter','IBM Plex Sans',system-ui,sans-serif;
  --radius:6px;--radius-sm:4px;--on-acc:#0d0f12;color-scheme:light dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--text);font-family:var(--sans);font-size:13px}
body{display:flex;flex-direction:column;overflow:hidden}
button{font-family:var(--sans);cursor:pointer}
a{color:var(--acc);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
.hdr{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--bg1);flex-shrink:0}
.hdr .brand{font-size:14px;font-weight:700;color:var(--acc);letter-spacing:.4px;white-space:nowrap}
.hdr .chips{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto;align-items:center}
.chip{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--dim2);white-space:nowrap}
.chip b{color:var(--text);font-family:var(--mono)}
input,select,textarea{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:6px 9px;font-family:var(--sans);font-size:13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{width:100%;resize:vertical;font-family:var(--sans);font-size:12.5px;line-height:1.45}
.btn{background:var(--bg2);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius-sm);padding:6px 12px;font-size:12px}
.btn:hover{background:var(--bg3)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc,#0d0f12);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc,#0d0f12);font-weight:600}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn:disabled{opacity:.5;cursor:default}
.layout{flex:1;display:flex;min-height:0}
.pane{flex:1;overflow:auto;padding:14px 16px;min-width:0}
.pane.left{border-right:1px solid var(--border);max-width:46%}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.card h3{font-size:12px;margin-bottom:10px;color:var(--dim2);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.card h3 .n{background:var(--acc);color:var(--on-acc,#0d0f12);border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.scanbox{display:flex;gap:8px;align-items:center;background:var(--bg2);border:2px solid var(--acc);border-radius:var(--radius);padding:10px}
.scanbox input{flex:1;font-family:var(--mono);font-size:20px;background:transparent;border:none;letter-spacing:1px}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:var(--radius-sm);overflow:hidden}
.seg button{background:var(--bg2);border:none;color:var(--dim2);padding:5px 12px;font-size:12px}
.seg button.on{background:var(--acc);color:var(--on-acc,#0d0f12);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:10.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:.4px}
.fld input,.fld select{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
video{width:100%;border-radius:var(--radius);background:#000;aspect-ratio:4/3;object-fit:cover}
.videowrap{position:relative}
.videowrap .live{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);border:1px solid var(--acc);color:var(--acc);border-radius:20px;padding:2px 10px;font-size:11px;font-family:var(--mono);display:none}
.videowrap .live.on{display:block}
.phototray{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.photo{position:relative;width:88px;height:88px;border-radius:var(--radius);overflow:hidden;border:2px solid var(--border);background:var(--bg3)}
.photo.ok{border-color:var(--up)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .acts{position:absolute;inset:auto 0 0 0;display:flex;background:rgba(0,0,0,.55)}
.photo .acts button{flex:1;background:none;border:none;color:#fff;font-size:13px;padding:2px 0}
.photo .acts button:hover{background:rgba(255,255,255,.15)}
.photo .badge{position:absolute;top:2px;left:3px;font-size:12px;color:var(--up);text-shadow:0 0 3px #000}
.grade{display:flex;align-items:center;gap:8px}
.grade input[type=range]{flex:1}
.grade .gv{font-family:var(--mono);font-size:15px;width:34px;text-align:right;color:var(--deal)}
.title-in{width:100%;font-size:15px;font-weight:600}
.cands{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.cand{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 9px;cursor:pointer}
.cand:hover{border-color:var(--acc)}
.cand .conf{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim2)}
.saverow{display:flex;gap:8px;margin-top:12px}
.saverow .btn{flex:1;padding:9px}
.unit-row{display:flex;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.unit-row img{width:40px;height:40px;object-fit:cover;border-radius:4px;background:var(--bg3);flex-shrink:0}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;border:1px solid var(--border2);color:var(--dim2)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--warn);border-color:var(--warn)}
.muted{color:var(--dim2)}.mono{font-family:var(--mono)}.right{text-align:right}
.empty{color:var(--dim);text-align:center;padding:20px;font-size:12px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border2);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:9px 16px;border-radius:20px;font-size:12px;transition:.25s;opacity:0;z-index:50}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
#toast.err{border-color:var(--err);color:var(--err)}#toast.ok{border-color:var(--ok);color:var(--ok)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--dim);margin-right:5px}
.dot.on{background:var(--up);box-shadow:0 0 6px var(--up)}
kbd{background:var(--bg3);border:1px solid var(--border2);border-radius:3px;padding:0 5px;font-family:var(--mono);font-size:10px;color:var(--dim2)}
.hint{font-size:10.5px;color:var(--dim);margin-top:6px;line-height:1.5}
/* enrichment info card */
.infocard{border-color:var(--acc)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:7px;margin-top:4px}
.fact{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 8px}
.fact .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim2)}
.fact .v{font-size:12.5px;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prices{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pricebox{flex:1;min-width:78px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 9px;cursor:pointer;transition:border-color .13s}
.pricebox:hover{border-color:var(--acc)}
.pricebox .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim2)}
.pricebox .v{font-family:var(--mono);font-size:16px;font-weight:700;margin-top:2px}
.pricebox .v.hi{color:var(--up)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;border:1px solid var(--border2);color:var(--dim2)}
.badge.rar{border-color:var(--deal);color:var(--deal)}
.badge.pos{border-color:var(--up);color:var(--up)}.badge.neg{border-color:var(--dn);color:var(--dn)}.badge.mix{border-color:var(--warn);color:var(--warn)}
.spark{width:100%;height:56px;display:block;margin-top:8px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm)}
.spark .leg{font-size:9px}
.review-sum{font-size:12px;color:var(--text);margin-top:6px;line-height:1.5}
.src{font-size:10px;color:var(--dim);margin-top:8px}
.src a{color:var(--dim2)}
/* command bar — always-visible scan/mode/category strip under the header */
.cmdbar{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--bg1);flex-shrink:0;flex-wrap:wrap}
.cmdbar .scanbox{flex:1;min-width:240px;padding:7px 10px}
.cmdbar .scanbox input{font-size:18px}
.coachline{display:none;align-items:center;gap:9px;padding:8px 14px;border-bottom:1px solid var(--border);background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 12%,var(--bg1)),var(--bg1));flex-shrink:0;font-size:13px}
.coachline.on{display:flex}
.coachline .who{color:var(--acc);font-weight:700;flex-shrink:0}
.coachline .msg{color:var(--text)}
/* left pane fits the viewport: cap the video so the tray stays visible */
video{max-height:44vh}
.pane.left{display:flex;flex-direction:column}
.pane.left .card:last-child{flex:1;min-height:0;display:flex;flex-direction:column}
.pane.left .phototray{flex:1;min-height:0;overflow:auto;align-content:flex-start}
@media(max-width:820px){.layout{flex-direction:column}.pane.left{max-width:none;border-right:none;border-bottom:1px solid var(--border)}video{max-height:36vh}}
</style>
</head>
<body>
<div class="hdr">
  <span class="brand">◆ SCAN STATION</span>
  <span class="muted" id="storeLbl" style="font-size:11px">Fast per-unit intake</span>
  <div class="chips" id="chips">
    <button class="btn sm" id="coachBtn" title="Conversational assistant — asks for fields, comments on the item, warns of gaps">💬 Coach</button>
    <button class="btn sm" id="voiceBtn" title="Voice commands (V)"><span class="dot"></span>🎤 Voice</button>
    <button class="btn sm" id="ttsBtn" title="Read fields aloud">🔊 Read-back</button>
    <button class="btn sm" id="cfgBtn" title="Settings">⚙</button>
    <span class="chip">Session <b id="cSess">0</b></span>
    <a class="btn sm" id="backLink" href="#">↩ Store</a>
  </div>
</div>
<div class="cmdbar" id="cmdbar"></div>
<div class="coachline" id="coachLine"></div>
<div class="layout">
  <div class="pane left" id="paneL"></div>
  <div class="pane" id="paneR"></div>
</div>
<div id="toast"></div>
<canvas id="cap" style="display:none"></canvas>

<script>
// ── helpers ──────────────────────────────────────────────────────────────────
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const K in a){if(K==='html')e.innerHTML=a[K];
  else if(K.startsWith('on'))e.addEventListener(K.slice(2),a[K]);else if(a[K]!=null)e.setAttribute(K,a[K]);}
  for(const c of k){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const money=(v,c='GBP')=>v==null||v===''?'—':(c==='GBP'?'£':c==='USD'?'$':'')+Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const qs=o=>{const p=new URLSearchParams();for(const k in o)if(o[k]!==''&&o[k]!=null)p.set(k,o[k]);const s=p.toString();return s?'?'+s:'';};
async function api(path,body){const opt=body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{};
  const r=await fetch(path,opt);return r.json().catch(()=>({error:'bad response'}));}
let toastT;function toast(m,k=''){const t=$('#toast');t.textContent=m;t.className='on '+k;clearTimeout(toastT);toastT=setTimeout(()=>t.className='',2600);}
const _SP=new URLSearchParams(location.search);
const STORE=_SP.get('store')||'', STORE_NAME=_SP.get('store_name')||'';
function withStore(o){o=o||{};if(STORE)o.store_id=STORE;return o;}
const num=v=>{if(v==null)return null;const n=parseFloat(String(v).replace(/[^0-9.]/g,''));return isNaN(n)?null:n;};

// ── config (persisted) ───────────────────────────────────────────────────────
const DEF={autoAdvanceN:3,autoAssess:true,autoPrice:false,tts:false,mode:'used',
  category:'video_game',condition:'good',
  // image processing
  bgRemove:false,bgModel:'u2net',watermark:false,watermarkText:(STORE_NAME||'')+'',
  wmPos:'br',wmOpacity:0.5,
  // auto-capture from live video
  autoCapture:false,obstructionCheck:false,
  // vision model to route describe/identify/grade to (blank = auto)
  visionModel:'',
  // conversational assistant: asks for the active field, comments on the item,
  // warns of gaps. Speaks aloud when on (independent of the Read-back toggle).
  coach:false,
  // market/metadata enrichment (PriceCharting + eBay/Vinted + reviews)
  autoEnrich:true,region:'PAL',
  // thermal label printing
  autoPrint:false,printMode:'sticker',printerId:'',labelStore:(STORE_NAME||''),
  // sticky location/bin — persists across scans until changed or cleared
  stickyLocation:''};
let CFG=Object.assign({},DEF,JSON.parse(localStorage.getItem('vera:intake:cfg')||'{}'));
function saveCfg(){localStorage.setItem('vera:intake:cfg',JSON.stringify(CFG));}
const CONDITIONS=['new','like_new','very_good','good','acceptable','for_parts'];
const COMPLETENESS=['sealed','cib','boxed_no_manual','cart_only','disc_only','loose','n_a'];
const CATEGORIES=['video_game','console','accessory','controller','amiibo','trading_card','collectible','merch','other'];
const CONDLABEL={new:'New',like_new:'Like new',very_good:'Very good',good:'Good',acceptable:'Acceptable',for_parts:'For parts'};

// ── TTS ──────────────────────────────────────────────────────────────────────
function speak(t,rate){if(!t||!window.speechSynthesis)return;try{const u=new SpeechSynthesisUtterance(String(t));
  u.rate=rate||1.08;u.pitch=1;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);}catch(e){}}
function say(t){if(CFG.tts)speak(t);}                       // Read-back toggle

// ── Coach: optional conversational assistant ─────────────────────────────────
// Asks for the active field, remarks on the scanned item, warns of gaps. Speaks
// aloud (regardless of Read-back) and shows a line under the command bar.
const FIELD_Q={title:'What is it?',platform:'Which platform or system?',
  condition:'What condition is it in?',completeness:'Is it complete — box and manual?',
  grade:'What grade, nought to ten?',cost:'What did it cost you?',price:'Price it at?',
  location:'Which bin or shelf?'};
let _coachT=null;
function coachSay(msg,opts){opts=opts||{};if(!CFG.coach||!msg)return;
  const line=$('#coachLine');if(line){line.classList.add('on');
    line.innerHTML='';line.append(el('span',{class:'who'},'Coach'),el('span',{class:'msg'},msg));}
  if(!opts.silent)speak(msg,1.05);}
function updateCoachUI(){const b=$('#coachBtn');if(b)b.classList.toggle('on',CFG.coach);
  const line=$('#coachLine');if(line&&!CFG.coach)line.classList.remove('on');}
function coachAsk(key){if(!CFG.coach)return;const q=FIELD_Q[key];if(!q)return;
  clearTimeout(_coachT);_coachT=setTimeout(()=>coachSay(q),120);}   // debounce rapid focus
function coachMissing(d){if(!CFG.coach)return[];const miss=[];
  if(!(S.photos||[]).length)miss.push('no photos yet');
  if(d.price==null||d.price==='')miss.push('no price');
  if(CFG.mode==='used'&&(!d.grade))miss.push('no grade');
  return miss;}
// One-liner remark on the freshly scanned/identified item via the LLM cluster.
async function coachRemark(ctx){if(!CFG.coach)return;
  const bits=[ctx.title&&('Item: '+ctx.title),ctx.platform&&('Platform: '+ctx.platform),
    ctx.condition&&('Condition: '+ctx.condition),ctx.grade&&('Grade: '+ctx.grade+'/10')].filter(Boolean).join('. ');
  try{const r=await api('/llm/generate',{job_type:'chat',
    system:'You are a warm, brief shop assistant helping catalogue second-hand video games. Reply in ONE short spoken sentence — a quick remark on the item and a nudge for the next detail. No lists, no preamble.',
    prompt:bits+'. React in one sentence.'});
    const t=((r&&r.text)||'').trim().replace(/^["']|["']$/g,'');
    if(t)coachSay(t);}catch(e){}}

// ── state ────────────────────────────────────────────────────────────────────
const S={product:null,upc:'',photos:[],cands:null,session:[],busy:false,dirty:false,enrich:null};
const F={}; // form input elements, filled by buildForm

// ── COMMAND BAR: mode + category + barcode + identify (always visible) ────────
function buildCmdbar(){
  const bar=$('#cmdbar');bar.innerHTML='';
  const modeSeg=el('div',{class:'seg'});
  for(const m of ['new','used']){const b=el('button',{onclick:()=>{CFG.mode=m;saveCfg();buildCmdbar();buildRight();}},m==='new'?'New':'Used');
    if(CFG.mode===m)b.classList.add('on');modeSeg.append(b);}
  const catSel=el('select',{title:'Category',onchange:e=>{CFG.category=e.target.value;saveCfg();}});
  for(const c of CATEGORIES){const o=el('option',{value:c},c.replace(/_/g,' '));if(c===CFG.category)o.selected=true;catSel.append(o);}
  const sb=el('div',{class:'scanbox'});
  const bc=el('input',{id:'bc',placeholder:'scan or type a barcode, then Enter…',autocomplete:'off',autofocus:true});
  bc.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();onScan(bc.value.trim());}});
  sb.append(bc,el('button',{class:'btn pri',onclick:()=>onScan(bc.value.trim())},'Look up'));
  // sticky location / bin — stays until changed or cleared; scan a LOC: sticker to set
  const locInput=el('input',{id:'locInput',value:CFG.stickyLocation||'',placeholder:'bin',style:'width:80px',
    title:'Current bin — sticks across scans. Scan a LOC: label to set it.'});
  locInput.addEventListener('change',()=>setLocation(locInput.value));
  locInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();setLocation(locInput.value);$('#bc').focus();}});
  const locBox=el('div',{class:'seg',style:'align-items:center'},
    el('span',{style:'padding:0 6px;color:var(--dim2)'},'📍'),locInput,
    el('button',{onclick:()=>printLocationLabel(),title:'Print a shelf label for this bin'},'🖨'),
    el('button',{onclick:()=>setLocation(''),title:'Clear location'},'✕'));
  bar.append(modeSeg,catSel,sb,locBox,
    el('button',{class:'btn',id:'idBtn',onclick:identifyByPhoto,title:'Identify a barcode-less item (cartridge/disc) from a photo'},'✦ Identify by photo'));
}

// ── LEFT pane: camera + photos ───────────────────────────────────────────────
function buildLeft(){
  const p=$('#paneL');p.innerHTML='';
  // camera
  const c2=el('div',{class:'card'});
  c2.append(el('h3',{},el('span',{class:'n'},'1'),'Camera'));
  const devSel=el('select',{id:'devSel',style:'flex:1;min-width:120px'});
  const camRow=el('div',{class:'row',style:'margin-bottom:8px'},
    el('div',{class:'fld',style:'flex:1'},el('label',{},'Device (DroidCam, webcam…)'),devSel),
    el('button',{class:'btn',id:'camBtn',onclick:toggleCam},'▶ Start'));
  c2.append(camRow);
  const vw=el('div',{class:'videowrap',id:'vwrap',style:'display:none'});
  const v=el('video',{id:'vid',autoplay:true,muted:true,playsinline:true});
  vw.append(v,el('div',{class:'live',id:'liveBadge'},'⌕ scanning…'));
  c2.append(vw);
  c2.append(el('div',{class:'row',style:'margin-top:8px'},
    el('button',{class:'btn pri',id:'snapBtn',onclick:()=>capturePhoto(),disabled:true},'⚑ Capture photo'),
    el('label',{class:'btn',style:'position:relative;overflow:hidden'},'⁘ Files',
      el('input',{type:'file',accept:'image/*',multiple:true,capture:'environment',
        style:'position:absolute;inset:0;opacity:0;cursor:pointer',
        onchange:e=>{for(const f of e.target.files)fileToDataURL(f).then(d=>addPhoto(d));}})),

// ── scan / lookup ────────────────────────────────────────────────────────────
async function onScan(code){
  if(!code)return;
  // location sticker? (LOC:xxx) → set the sticky current bin, don't intake
  const lm=code.match(/^LOC[:\-]\s*(.+)$/i);
  if(lm){$('#bc').value='';setLocation(lm[1].trim());return;}
  // internal SKU sticker? (non-UPC) → pull the existing unit up (LBI: what + where)
  if(!/^\d{8,14}$/.test(code)){
    const f=await api('/business/unit/list'+qs({q:code,limit:5}));
    const hit=(f.units||[]).find(u=>(u.sku||'').toLowerCase()===code.toLowerCase());
    if(hit){$('#bc').value='';showFoundUnit(hit);return;}
  }
  // scan-to-proceed: commit the in-progress unit (saves + clears the form) first
  if(S.dirty&&(F.title.value.trim()||S.photos.length)){await saveUnit(false);}
  $('#bc').value=code;S.upc=code;S.busy=true;toast('Looking up '+code+'…');
  const r=await api('/business/barcode/lookup',{code});
  S.busy=false;$('#bc').value='';
  if(r.error||!r.product){toast('No match — type the title','warn');F.title.focus();say('No match found');return;}
  const pr=r.product;S.product=null;
  const guessed=!pr.platform;const plat=pr.platform||guessConsole(pr.title)||pr.brand||'';
  S.platformGuessed=guessed&&!!plat;                 // enrich may override a guess
  fillForm({title:pr.title,platform:plat});
  if((pr.images||[]).length&&!S.photos.length){for(const u of pr.images.slice(0,1))addPhoto(u,true);}
  S.dirty=true;toast('Found: '+(pr.title||'').slice(0,48),'ok');say('Found '+(pr.title||''));
  if(CFG.autoEnrich)enrichCurrent();          // enrich speaks its own richer coach line
  else coachRemark({title:pr.title,platform:pr.platform||pr.brand});
  (CFG.mode==='used'?F.condition:F.price).focus();
}

function sparkline(points){const w=340,ht=56,pad=4;
  const xs=points.map(p=>p.ts),ys=points.map(p=>p.value);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const nx=t=>pad+(x1===x0?0:(t-x0)/(x1-x0))*(w-2*pad);
  const ny=v=>ht-pad-(y1===y0?(ht-2*pad)/2:(v-y0)/(y1-y0)*(ht-2*pad));
  const d=points.map((p,i)=>(i?'L':'M')+nx(p.ts).toFixed(1)+' '+ny(p.value).toFixed(1)).join(' ');
  const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');
  svg.setAttribute('class','spark');svg.setAttribute('viewBox',`0 0 ${w} ${ht}`);svg.setAttribute('preserveAspectRatio','none');
  const path=document.createElementNS(ns,'path');path.setAttribute('d',d);
  path.setAttribute('fill','none');path.setAttribute('stroke','var(--acc)');path.setAttribute('stroke-width','1.5');
  const dot=document.createElementNS(ns,'circle');dot.setAttribute('cx',nx(xs[xs.length-1]));dot.setAttribute('cy',ny(ys[ys.length-1]));
  dot.setAttribute('r','2.5');dot.setAttribute('fill','var(--deal)');
  const lbl=document.createElementNS(ns,'text');lbl.setAttribute('x',w-3);lbl.setAttribute('y',12);lbl.setAttribute('text-anchor','end');
  lbl.setAttribute('fill','var(--dim2)');lbl.setAttribute('class','leg');
  lbl.textContent=money(y0)+'–'+money(y1)+'  ·  '+new Date(x0).getFullYear()+'→now';
  svg.append(path,dot,lbl);
  const wrap=el('div');wrap.append(svg,el('div',{class:'muted',style:'font-size:10px;margin-top:2px'},'Complete-in-box price history (PriceCharting)'));
  return wrap;
}

const CONSOLE_PATTERNS=[
  [/playstation ?5|\bps5\b/i,'PlayStation 5'],[/playstation ?4|\bps4\b/i,'PlayStation 4'],
  [/playstation ?3|\bps3\b/i,'PlayStation 3'],[/playstation ?2|\bps2\b/i,'PlayStation 2'],
  [/\bpsp\b/i,'PlayStation Portable'],[/ps ?vita|\bvita\b/i,'PlayStation Vita'],
  [/playstation ?1|\bps1\b|\bpsx\b|playstation/i,'PlayStation'],
  [/xbox series|series ?[sx]/i,'Xbox Series X'],[/xbox ?one/i,'Xbox One'],
  [/xbox ?360/i,'Xbox 360'],[/\bxbox\b/i,'Xbox'],
  [/switch/i,'Switch'],[/wii ?u/i,'Wii U'],[/\bwii\b/i,'Wii'],[/\b3ds\b/i,'Nintendo 3DS'],
  [/nintendo ?ds|\bnds\b/i,'Nintendo DS'],[/gamecube|\bngc\b/i,'GameCube'],
  [/\bn64\b|nintendo ?64/i,'Nintendo 64'],[/super ?nintendo|\bsnes\b/i,'Super Nintendo'],
  [/game ?boy ?advance|\bgba\b/i,'Game Boy Advance'],[/game ?boy ?color|\bgbc\b/i,'Game Boy Color'],
  [/game ?boy/i,'Game Boy'],[/\bnes\b|nintendo entertainment/i,'Nintendo'],
  [/mega ?drive|genesis/i,'Genesis'],[/dreamcast/i,'Dreamcast'],[/sega ?saturn|\bsaturn\b/i,'Sega Saturn'],
  [/master ?system/i,'Master System'],[/game ?gear/i,'Game Gear']];
function guessConsole(text){const s=String(text||'');for(const [re,lbl] of CONSOLE_PATTERNS)if(re.test(s))return lbl;return '';}

// ── title normalisation + builder ────────────────────────────────────────────
function normalizeName(raw,platform){let s=String(raw||'');
  s=s.replace(/\[[^\]]*\]|\([^)]*\)/g,' ');                       // drop [..] (..)
  const strip=[platform,'nintendo','sony','sega','microsoft','pal','ntsc-j','ntsc','region free',
    'brand new','\\bnew\\b','sealed','boxed','cib','complete in box','complete','\\bused\\b',
    'preowned','pre-owned','very good','like new','vgc','video game','\\bgame\\b','genuine',
    'official','tested','\\buk\\b'];
  for(const w of strip){if(!w)continue;try{s=s.replace(new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','ig'),' ');}catch(_){}}
  return s.replace(/[-–—:]+/g,' ').replace(/\s{2,}/g,' ').trim();
}

// ── thermal label printing (server-routed, or Web Serial/Bluetooth from here) ─
let _serialPort=null,_btChar=null;
function b64ToBytes(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function connectPrinterSerial(){
  if(!('serial'in navigator)){toast('Web Serial unsupported — configure a server printer in the Store settings','warn');return false;}
  try{_serialPort=await navigator.serial.requestPort();await _serialPort.open({baudRate:9600});toast('USB printer connected','ok');return true;}
  catch(e){toast('Printer connect cancelled','');return false;}
}
async function connectPrinterBluetooth(){
  if(!('bluetooth'in navigator)){toast('Web Bluetooth unsupported','warn');return false;}
  try{const dev=await navigator.bluetooth.requestDevice({filters:[{services:[0x18f0]},{services:['000018f0-0000-1000-8000-00805f9b34fb']}],
      optionalServices:[0x18f0,'000018f0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb']});
    const s=await dev.gatt.connect();let svc;try{svc=await s.getPrimaryService(0x18f0);}catch(_){svc=await s.getPrimaryService('0000ff00-0000-1000-8000-00805f9b34fb');}
    const chars=await svc.getCharacteristics();_btChar=chars.find(c=>c.properties.write||c.properties.writeWithoutResponse)||chars[0];
    toast('Bluetooth printer connected','ok');return true;}
  catch(e){toast('BT connect failed: '+e.message,'warn');return false;}
}
async function writeBytes(bytes){
  if(_serialPort&&_serialPort.writable){const w=_serialPort.writable.getWriter();try{await w.write(bytes);}finally{w.releaseLock();}return true;}
  if(_btChar){for(let i=0;i<bytes.length;i+=180){const chunk=bytes.slice(i,i+180);
    if(_btChar.properties.writeWithoutResponse)await _btChar.writeValueWithoutResponse(chunk);else await _btChar.writeValue(chunk);}return true;}
  return false;
}
// Print a label for a unit-like object {sku,title,price,condition,grade,completeness,location,attributes}
async function printLabel(u,mode){mode=mode||CFG.printMode;

    currency:'GBP',condition:u.condition||F.condition.value,grade:u.grade||num(F.grade.value)||'',

function fileToDataURL(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f);});}
async function removeBg(dataUrl){if(!CFG.bgRemove)return dataUrl;
  const b64=(dataUrl||'').split(',').pop();
  const r=await api('/image/rembg',{image_b64:b64,model:CFG.bgModel||'u2net',post_process:true});
  if(r&&r.image_b64&&!r.error)return 'data:image/png;base64,'+r.image_b64;
  if(r&&r.error)toast('BG removal: '+r.error,'warn');return dataUrl;}
function applyWatermark(dataUrl){return new Promise(res=>{
  if(!CFG.watermark||!CFG.watermarkText)return res(dataUrl);
  const img=new Image();img.onload=()=>{const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
    const g=cv.getContext('2d');g.drawImage(img,0,0);
    const txt=String(CFG.watermarkText);const fs=Math.max(14,Math.round(img.width*0.04));
    g.font='700 '+fs+'px Inter,system-ui,sans-serif';g.textBaseline='alphabetic';
    const pad=Math.round(fs*0.7),w=g.measureText(txt).width,pos=CFG.wmPos||'br';
    let x=pad,y=img.height-pad;
    if(pos.indexOf('r')>=0)x=img.width-w-pad;if(pos.indexOf('c')>=0)x=(img.width-w)/2;
    if(pos.indexOf('t')>=0)y=fs+pad;
    g.globalAlpha=Math.min(1,Math.max(0.1,CFG.wmOpacity||0.5));
    g.lineWidth=Math.max(2,fs*0.12);g.strokeStyle='rgba(0,0,0,.55)';g.strokeText(txt,x,y);
    g.fillStyle='#fff';g.fillText(txt,x,y);g.globalAlpha=1;
    res(cv.toDataURL('image/png'));};img.onerror=()=>res(dataUrl);img.src=dataUrl;});}
async function processImage(dataUrl){let d=dataUrl;

// ── auto-capture: fire when the frame is sharp (in focus) and stable (not moving),
//    optionally rejecting shots the vision model says are obstructed/cut off ──────
let _acTimer=null,_acCanvas=null,_acPrev=null,_acStable=0,_acCool=0,_acBusy=false;
function startAutoCapture(){if(_acTimer)clearInterval(_acTimer);_acPrev=null;_acStable=0;
  _acTimer=setInterval(autoCaptureTick,220);}
function autoCaptureTick(){
  if(!S._camOn||!CFG.autoCapture||_acBusy)return;
  const v=$('#vid');if(!v||!v.videoWidth)return;
  const s=64,cv=_acCanvas||(_acCanvas=document.createElement('canvas'));cv.width=s;cv.height=s;
  const g=cv.getContext('2d');g.drawImage(v,0,0,s,s);
  const d=g.getImageData(0,0,s,s).data,gray=new Float32Array(s*s);
  for(let i=0;i<s*s;i++)gray[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];
  let sharp=0;for(let y=1;y<s-1;y++)for(let x=1;x<s-1;x++){const j=y*s+x;
    const lap=4*gray[j]-gray[j-1]-gray[j+1]-gray[j-s]-gray[j+s];sharp+=lap*lap;}
  sharp/=(s*s);
  let diff=1e9;if(_acPrev){diff=0;for(let i=0;i<s*s;i++)diff+=Math.abs(gray[i]-_acPrev[i]);diff/=(s*s);}
  _acPrev=gray;
  const framed=sharp>120,stable=diff<4.5,now=Date.now();
  const l=$('#liveOnOff');if(l&&CFG.autoCapture)l.textContent='auto: '+(framed&&stable?'● ready':(!framed?'○ focus…':'○ hold steady'));
  if(framed&&stable)_acStable++;else _acStable=0;
  if(_acStable>=3&&now>_acCool){_acStable=0;_acCool=now+2600;_acBusy=true;
    doAutoCapture().finally(()=>{_acBusy=false;});}
}
async function doAutoCapture(){
  const ph=await capturePhoto(true);if(!ph)return;                   // raw, not yet added
  if(CFG.obstructionCheck){const clear=await frameClear(ph.data);
    if(!clear){navigator.vibrate&&navigator.vibrate([25,40,25]);const l=$('#liveOnOff');if(l)l.textContent='auto: ✋ obstructed';return;}}
  navigator.vibrate&&navigator.vibrate(60);await addPhoto(ph.data,true);toast('Auto-captured','ok');
}
async function frameClear(dataUrl){
  const r=await api('/vision/describe',{image_b64:dataUrl,model:CFG.visionModel||'',
    prompt:'Is a hand, finger, or anything covering/obstructing the product, or is the item cut off / out of frame? Answer ONLY "yes" (obstructed or cut off) or "no" (clear and fully in frame).'});
  const t=((r&&r.text)||'').toLowerCase();return /\bno\b/.test(t)&&!/\byes\b/.test(t);

        el('div',{class:'muted',style:'font-size:11px'},esc(CONDLABEL[u.condition]||u.condition||'')+(u.grade?(' · '+u.grade+'/10'):'')+' · '+money(u.price))),
      el('button',{class:'btn sm',onclick:()=>printLabel(u),title:'Reprint label'},'🖨'),
      el('button',{class:'btn sm',onclick:async()=>{const r=await api('/business/unit/draft_listing',{unit_id:u.id,platform:'ebay'});toast(r.error||'Listed draft','ok');}},'list'),
      el('button',{class:'btn sm danger',onclick:async()=>{await api('/business/unit/delete',{id:u.id});S.session=S.session.filter(x=>x.id!==u.id);renderSession();refreshChips();}},'✕')));}
  const sv=$('#sessVal');if(sv)sv.textContent=S.session.length?(S.session.length+' · '+money(val)):'';
  const cs=$('#cSess');if(cs)cs.textContent=S.session.length;
}
function refreshChips(){renderSession();}

// ── voice commands ───────────────────────────────────────────────────────────
let _rec=null,_recOn=false;
function condFromWords(w){w=w.toLowerCase();
  if(/mint|sealed|brand new|\bnew\b/.test(w))return 'new';
  if(/like new|near mint|excellent/.test(w))return 'like_new';
  if(/very good/.test(w))return 'very_good';
  if(/for parts|broken|faulty|spares/.test(w))return 'for_parts';
  if(/acceptable|poor|worn/.test(w))return 'acceptable';
  if(/\bgood\b/.test(w))return 'good';return null;}
function applyVoice(t){t=t.trim();if(!t)return;const l=t.toLowerCase();
  let m;
  if((m=l.match(/(?:condition|grade condition)\s+(.+)/))){const c=condFromWords(m[1]);if(c){F.condition.value=c;say('Condition '+CONDLABEL[c]);toast('Condition '+CONDLABEL[c],'ok');}return;}
  if((m=l.match(/grade\s+([\d.]+)/))){F.grade.value=m[1];F.grade.dispatchEvent(new Event('input'));say('Grade '+m[1]);return;}
  if((m=l.match(/(?:price|sell for|asking)\s+([\d. ]+)/))){const n=num(m[1]);if(n!=null){F.price.value=n;say('Price '+money(n));}return;}
  if((m=l.match(/cost\s+([\d. ]+)/))){const n=num(m[1]);if(n!=null){F.cost.value=n;say('Cost '+money(n));}return;}
  if((m=l.match(/(?:location|bin|shelf)\s+(.+)/))){F.location.value=m[1].toUpperCase();say('Location '+m[1]);return;}
  if((m=l.match(/(?:platform|console|system)\s+(.+)/))){F.platform.value=m[1];say('Platform '+m[1]);return;}
  if((m=l.match(/(?:title|name it|it's|its|called)\s+(.+)/))){F.title.value=m[1].slice(0,80);say('Title set');return;}
  if(/complete in box|cib|boxed with manual/.test(l)){F.completeness.value='cib';say('Complete in box');return;}
  if(/cart(ridge)? only|loose cart/.test(l)){F.completeness.value='cart_only';say('Cartridge only');return;}
  if(/disc only/.test(l)){F.completeness.value='disc_only';return;}
  if(/\bsealed\b/.test(l)){F.completeness.value='sealed';return;}
  if(/capture|take (a )?photo|snap|shoot/.test(l)){capturePhoto();return;}
  if(/identify|what is this|what's this/.test(l)){identifyByPhoto();return;}
  if(/assess|describe|grade it|check condition/.test(l)){assessUnit();return;}
  if(/suggest price|price it|what.s it worth/.test(l)){suggestPrice();return;}
  if(/read( back)?|read fields/.test(l)){readBack();return;}
  if(/list it|save and list/.test(l)){saveUnit(true);return;}
  if(/save|next|done/.test(l)){saveUnit(false);return;}
  if(/\bused mode|switch to used\b/.test(l)){CFG.mode='used';saveCfg();buildCmdbar();buildLeft();buildRight();return;}
  if(/\bnew mode|switch to new\b/.test(l)){CFG.mode='new';saveCfg();buildCmdbar();buildLeft();buildRight();return;}
  toast('“'+t+'”','');
}
function readBack(){const d=readForm();const parts=[d.title,'condition '+CONDLABEL[d.condition],
  d.grade?('grade '+d.grade):'',d.price!=null?('price '+money(d.price)):''].filter(Boolean);
  CFG.tts=true;say(parts.join(', '));}
function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Voice not supported in this browser','warn');return;}
  if(_recOn){_rec&&_rec.stop();return;}
  _rec=new SR();_rec.continuous=true;_rec.interimResults=false;_rec.lang='en-GB';
  _rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)applyVoice(e.results[i][0].transcript);};
  _rec.onend=()=>{if(_recOn){try{_rec.start();}catch(e){}}};        // auto-restart
  _rec.onerror=ev=>{if(ev.error==='not-allowed'){toast('Mic blocked','err');setVoice(false);}};
  _rec.start();setVoice(true);
}
function setVoice(on){_recOn=on;const b=$('#voiceBtn');b.classList.toggle('on',on);
  b.querySelector('.dot').classList.toggle('on',on);toast(on?'Voice on — say a command':'Voice off',on?'ok':'');}

// ── settings ─────────────────────────────────────────────────────────────────
function chk(c){const i=el('input',{type:'checkbox'});i.checked=!!c;return i;}
function lblRow(input,text){return el('label',{style:'display:flex;gap:8px;align-items:center;font-size:12px'},input,text);}
function subHdr(t){return el('div',{class:'muted',style:'font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;margin:13px 0 6px'},t);}
function openCfg(){const p=$('#paneR');const old=$('#cfgCard');if(old)old.remove();
  const wrap=el('div',{class:'card',id:'cfgCard'});
  wrap.append(el('h3',{},'Settings',el('button',{class:'btn sm',style:'margin-left:auto',onclick:()=>wrap.remove()},'close')));
  // capture flow
  const n=el('input',{type:'number',min:1,max:8,value:CFG.autoAdvanceN,style:'width:70px'});
  const aA=chk(CFG.autoAssess),aP=chk(CFG.autoPrice),tt=chk(CFG.tts);
  const cond=el('select');for(const x of CONDITIONS){const o=el('option',{value:x},CONDLABEL[x]);if(x===CFG.condition)o.selected=true;cond.append(o);}
  wrap.append(subHdr('Capture flow'),el('div',{class:'grid2'},
    el('div',{class:'fld'},el('label',{},'Auto-advance after N approved photos'),n),
    el('div',{class:'fld'},el('label',{},'Default condition'),cond),
    lblRow(aA,'Auto-assess on advance'),lblRow(aP,'Auto-suggest price on save'),lblRow(tt,'Read fields aloud (TTS)')));
  // auto-capture
  const aC=chk(CFG.autoCapture),oc=chk(CFG.obstructionCheck);
  wrap.append(subHdr('Auto-capture from video'),el('div',{class:'grid2'},
    lblRow(aC,'Auto-shoot when framed & steady'),lblRow(oc,'Reject hands / cut-off shots (vision)')));
  // image processing
  const bg=chk(CFG.bgRemove),wm=chk(CFG.watermark);
  const wmText=el('input',{value:CFG.watermarkText||'',placeholder:'watermark text'});
  const wmPos=el('select');[['br','bottom-right'],['bl','bottom-left'],['bc','bottom-center'],['tr','top-right'],['tl','top-left']].forEach(o=>{const op=el('option',{value:o[0]},o[1]);if(o[0]===CFG.wmPos)op.selected=true;wmPos.append(op);});
  const wmOp=el('input',{type:'range',min:'0.1',max:'1',step:'0.05',value:CFG.wmOpacity});
  wrap.append(subHdr('Image processing'),el('div',{class:'grid2'},
    lblRow(bg,'Remove background (rembg / GPU node)'),lblRow(wm,'Watermark photos')),
    el('div',{class:'grid3',style:'margin-top:8px'},
      el('div',{class:'fld'},el('label',{},'Watermark text'),wmText),
      el('div',{class:'fld'},el('label',{},'Position'),wmPos),
      el('div',{class:'fld'},el('label',{},'Opacity'),wmOp)));
  // vision model + download
  const vmSel=el('select');vmSel.append(el('option',{value:''},'auto (first available)'));
  const dlNode=el('select'),dlModel=el('select'),dlCustom=el('input',{placeholder:'or ollama/hf ref'});
  ['qwen2.5vl:7b','qwen2.5vl:3b','llava:13b','llava:7b','minicpm-v','moondream','llama3.2-vision:11b']
    .forEach(m=>dlModel.append(el('option',{value:m},m)));
  const dlBtn=el('button',{class:'btn pri'},'⇩ Download to node');
  const bar=el('div',{style:'height:6px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-top:8px;display:none'});
  const fill=el('div',{style:'height:100%;width:0;background:var(--acc)'});bar.append(fill);
  const dlLbl=el('div',{class:'muted',style:'font-size:11px;margin-top:4px'});
  wrap.append(subHdr('Vision model'),
    el('div',{class:'fld'},el('label',{},'Route identify / grade / describe to'),vmSel),
    el('div',{class:'grid3',style:'margin-top:8px'},
      el('div',{class:'fld'},el('label',{},'Ollama node'),dlNode),
      el('div',{class:'fld'},el('label',{},'Recommended VL model'),dlModel),
      el('div',{class:'fld'},el('label',{},'Custom ref'),dlCustom)),
    el('div',{style:'margin-top:8px'},dlBtn),bar,dlLbl);
  api('/vision/models').then(r=>{for(const m of (r.models||[])){const v=m.model;const o=el('option',{value:v},v+(m.instance?(' · '+m.instance):''));if(v===CFG.visionModel)o.selected=true;vmSel.append(o);}});
  api('/catalog/nodes').then(r=>{const ns=(r.nodes||[]).filter(nd=>!nd.backend||nd.backend==='ollama');
    for(const nd of ns){const mc=(nd.models||[]).length;dlNode.append(el('option',{value:nd.id},nd.id+(mc?(' · '+mc+' models'):'')));}
    if(!ns.length)dlNode.append(el('option',{value:''},'no Ollama nodes'));});
  dlBtn.onclick=async()=>{const model=(dlCustom.value.trim()||dlModel.value),inst=dlNode.value;
    if(!model||!inst){toast('Pick a node + model','warn');return;}
    dlBtn.disabled=true;bar.style.display='block';fill.style.width='0';dlLbl.textContent='starting…';
    const r=await api('/catalog/pull/start',{model,instance_id:inst});
    if(r.error){dlLbl.textContent='Error: '+r.error;dlBtn.disabled=false;return;}
    const pid=r.pull_id;
    const poll=async()=>{const s=await api('/catalog/pull/status'+qs({pull_id:pid}));
      const rec=(s.pulls||[])[0];if(!rec){setTimeout(poll,1500);return;}
      fill.style.width=(rec.pct||0)+'%';
      dlLbl.textContent=(rec.state||'')+' · '+(rec.pct||0)+'%'+(rec.eta_s?(' · ETA '+rec.eta_s+'s'):'')+(rec.status?(' · '+rec.status):'');
      if(['done','failed','cancelled'].includes(rec.state)){dlBtn.disabled=false;
        if(rec.state==='done'){fill.style.width='100%';toast('Model ready: '+model,'ok');
          if(!vmSel.querySelector('option[value="'+model+'"]'))vmSel.append(el('option',{value:model},model));
          vmSel.value=model;}
        else toast('Pull '+rec.state,'err');return;}
      setTimeout(poll,1500);};
    setTimeout(poll,1200);};
  // label printing
  const ap=chk(CFG.autoPrint);
  const pm=el('select');[['sticker','Sticker (compact)'],['slip','Box slip (full info)']].forEach(o=>{const op=el('option',{value:o[0]},o[1]);if(o[0]===CFG.printMode)op.selected=true;pm.append(op);});
  const lblStore=el('input',{value:CFG.labelStore||'',placeholder:'store name on slips'});
  const connBtn=el('button',{class:'btn',onclick:async()=>{await connectPrinterSerial();}},'⇆ Connect USB printer');
  const connBt=el('button',{class:'btn',onclick:async()=>{await connectPrinterBluetooth();}},'⇆ Bluetooth');
  wrap.append(subHdr('Label printing (thermal)'),
    el('div',{class:'grid2'},lblRow(ap,'Auto-print a label on save'),
      el('div',{class:'fld'},el('label',{},'Label type'),pm)),
    el('div',{class:'grid2',style:'margin-top:8px'},
      el('div',{class:'fld'},el('label',{},'Store name (slips)'),lblStore),
      el('div',{class:'fld'},el('label',{},'Connect (or set a server printer in Store → Settings)'),el('div',{class:'row'},connBtn,connBt))),
    el('div',{class:'hint'},'Prints an internal CODE128 barcode of the unit SKU — scan the sticker here later to pull the item up (what it is + where it is). USB uses Web Serial; a server/mesh printer configured in the Store panel prints without connecting here.'));
  // collections (personal, non-sale — same LBI + valuation as a shop)
  const colName=el('input',{placeholder:'new collection name'});
  const colList=el('div',{class:'muted',style:'font-size:11px;margin-top:6px'});
  async function loadCols(){const r=await api('/business/store/list');colList.innerHTML='';
    const cols=(r.stores||[]).filter(s=>s.platform==='collection');
    if(!cols.length){colList.textContent='No collections yet.';return;}
    for(const s of cols){const a=el('a',{href:'/business/intake/panel'+qs({store:s.id,store_name:s.name}),style:'margin-right:10px'},'▣ '+esc(s.name));colList.append(a);}}
  wrap.append(subHdr('Personal collections'),
    el('div',{class:'row'},colName,el('button',{class:'btn',onclick:async()=>{if(!colName.value.trim())return;
      const r=await api('/business/store/upsert',{name:colName.value.trim(),platform:'collection',icon:'▣'});
      toast(r.ok?'Collection created — open it to scan in':'Error',r.ok?'ok':'err');colName.value='';loadCols();}},'+ Create')),
    colList,el('div',{class:'hint'},'A collection catalogues items you keep (same barcode/photo/valuation flow). Open one to scan into it; move items into a shop later from the “found unit” panel when you scan their sticker.'));
  loadCols();
  // market enrichment
  const enr=chk(CFG.autoEnrich);
  const regSel=el('select');[['PAL','PAL / EU (UK)'],['NTSC','NTSC / US'],['JP','Japan']].forEach(o=>{const op=el('option',{value:o[0]},o[1]);if(o[0]===CFG.region)op.selected=true;regSel.append(op);});
  const revalBtn=el('button',{class:'btn',onclick:async()=>{revalBtn.disabled=true;revalBtn.innerHTML='<span class="spin"></span> revaluing…';
    const r=await api('/business/enrich/refresh_all',withStore({limit:300,only_stale:true}));
    revalBtn.disabled=false;revalBtn.textContent='↻ Revalue all inventory';
    toast(r.error?r.error:('Revalued '+(r.updated||0)+', skipped '+(r.skipped||0)),r.error?'err':'ok');}},'↻ Revalue all inventory');
  wrap.append(subHdr('Market enrichment'),
    el('div',{class:'grid2'},lblRow(enr,'Auto-fetch prices/history/reviews on scan'),
      el('div',{class:'fld'},el('label',{},'Region for prices'),regSel)),
    el('div',{style:'margin-top:8px'},revalBtn),
    el('div',{class:'hint'},'PriceCharting is scraped for prices, full history & rarity (free); eBay + Vinted give the live market; reviews via web + LLM. Revalue-all keeps every item current — schedule it nightly from /schedule.'));
  // save
  wrap.append(el('div',{style:'margin-top:14px'},el('button',{class:'btn pri',onclick:()=>{
    CFG.autoAdvanceN=Math.max(1,parseInt(n.value)||3);CFG.autoAssess=aA.checked;CFG.autoPrice=aP.checked;CFG.tts=tt.checked;CFG.condition=cond.value;
    CFG.autoCapture=aC.checked;CFG.obstructionCheck=oc.checked;
    CFG.bgRemove=bg.checked;CFG.watermark=wm.checked;CFG.watermarkText=wmText.value;CFG.wmPos=wmPos.value;CFG.wmOpacity=parseFloat(wmOp.value)||0.5;
    CFG.visionModel=vmSel.value;CFG.autoEnrich=enr.checked;CFG.region=regSel.value;
    CFG.autoPrint=ap.checked;CFG.printMode=pm.value;CFG.labelStore=lblStore.value;
    saveCfg();wrap.remove();buildCmdbar();buildLeft();buildRight();$('#ttsBtn').classList.toggle('on',CFG.tts);toast('Saved','ok');}},'Save settings')));
  p.prepend(wrap);
}

// ── boot ─────────────────────────────────────────────────────────────────────
$('#voiceBtn').onclick=toggleVoice;
$('#coachBtn').onclick=()=>{CFG.coach=!CFG.coach;saveCfg();updateCoachUI();
  if(CFG.coach)coachSay('Coach on. Scan something and I will help.');else{window.speechSynthesis&&window.speechSynthesis.cancel();toast('Coach off','');}};
$('#ttsBtn').onclick=()=>{CFG.tts=!CFG.tts;saveCfg();$('#ttsBtn').classList.toggle('on',CFG.tts);toast(CFG.tts?'Read-back on':'Read-back off',CFG.tts?'ok':'');};
$('#cfgBtn').onclick=openCfg;
$('#ttsBtn').classList.toggle('on',CFG.tts);
$('#backLink').href='/business/store/panel'+(STORE?('?store='+encodeURIComponent(STORE)+'&store_name='+encodeURIComponent(STORE_NAME)):'');
if(STORE_NAME)$('#storeLbl').textContent=STORE_NAME;
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''));
  if(e.key==='F2'){e.preventDefault();$('#bc').focus();$('#bc').select();}
  else if(e.code==='Space'&&!typing&&S._camOn){e.preventDefault();capturePhoto();}
  else if(e.key==='Enter'&&e.ctrlKey){e.preventDefault();saveUnit(false);}
});
buildCmdbar();buildLeft();buildRight();updateCoachUI();$('#bc')&&$('#bc').focus();
</script>
