<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Vera Canvas</title>
<!-- The Canvas panel IS <vera-canvas> (vera/canvas/canvas_element.js) with its rail: the canvases on the left, the
     canvas the route names on the right — the same element, the same items as the chat's canvas column and the card
     canvas.show puts in a conversation. Nothing is rendered here; the theme is the estate's (/ui/theme/css). -->
<link rel="stylesheet" href="/ui/theme/css"/>
<style>
  :root{--bg0:#0d0f12;--bg1:#15181d;--bg2:#1c2026;--border:#2a2f37;--fg:#dce1e8;--fg2:#c3cad4;--dim:#6b7480;--acc:#5a9e8f;--acc2:#8fb87a;--acc3:#c79a5a;--acc4:#a07ec1;--err:#c96a5a}
  html,body{height:100%}
  body{margin:0;background:var(--bg0);color:var(--fg);font:13px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  vera-canvas{display:block;height:100%;margin:0;--vc-max:none}
</style>
<script src="/ui/elements/canvas_element.js"></script>
<script src="/ui/widgets/widget_element.js"></script>
</head>
<body>
<vera-canvas id="cv" rail fill></vera-canvas>
<script>
(async () => {
  const el = document.getElementById('cv');
  const q = new URLSearchParams(location.search);
  // the same /mcp/call the element uses; the envelope opened (prod answers {type, tool_name, content})
  const call = async (name, args) => { try { const r = await fetch('/mcp/call', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, arguments: args || {}, caller_kind: 'user' }) }); const j = await r.json(); return j && j.content !== undefined && (j.type === 'tool_result' || j.tool_name) ? j.content : (j && j.result !== undefined && j.type === undefined ? j.result : j); } catch (e) { return null; } };
  const show = (id) => { if (id) el.setAttribute('canvas-id', id); };
  let sid = q.get('session') || window._veraSessionId || '';
  if (sid) el.setAttribute('session-id', sid);   // the rail marks the session's canvas whichever canvas the route names
  // the session's canvas — the one the chat's column shows — made on demand, as the column makes it
  const bySession = async (s) => { if (!s) return ''; el.setAttribute('session-id', s); const r = await call('canvas.session.resolve', { session_id: s }); return (r && r.id) ? String(r.id) : ''; };
  // the route: ?canvas=<id> opens that canvas (an agent hands the user a link straight to the whiteboard it built);
  // ?session=<sid>, or the session the host names, opens the session's canvas; else the most recent
  if (q.get('canvas')) show(q.get('canvas'));
  else if (sid) show(await bySession(sid));
  if (!el.getAttribute('canvas-id')) { const r = await call('canvas.list', { limit: 1 }); const first = r && Array.isArray(r.canvases) && r.canvases[0]; if (first) show(first.id); }
  // the host harness / the chat: postMessage {canvas:'<id>'} focuses a canvas; the chat's panelOpen posts
  // {type:'vera:panel:init', session_id} — the session's canvas, unless the route named one
  window.addEventListener('message', async (e) => { const d = e.data || {};
    if (d.canvas) return show(d.canvas);
    if (d.type === 'vera:panel:init' && d.session_id && d.session_id !== sid) { sid = String(d.session_id); const id = await bySession(sid); if (id && !q.get('canvas')) show(id); } });
})();
</script>
</body>
</html>
