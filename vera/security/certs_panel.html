<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* vera theme boot — paint cached theme before CSS parses, avoids flash */
  (function(){try{var d=document.documentElement,S=window.localStorage;
  var t=S.getItem('vera:ui:theme');if(t)d.setAttribute('data-theme',t);
  var vf=S.getItem('vera:ui:themeVarsFor');if(t&&vf!==t)return;var v=JSON.parse(S.getItem('vera:ui:themeVars')||'null');
  if(v)for(var k in v)d.style.setProperty(k,v[k]);}catch(e){}})();</script>
<meta charset="UTF-8">
<title>Vera · Certificates</title>
<style>
:root{
  --bg:#0d0f12; --bg1:#14181d; --bg2:#1a1f26; --bg3:#20262e;
  --border:#232a33; --border2:#2e3742;
  --fg:#d8dde3; --fg2:#9aa3ad; --dim:#5f6975;
  --acc:#4a9eff; --ok:#28c28a; --warn:#f5b341; --err:#ef5b5b; --purple:#a78bfa;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg0,var(--bg));color:var(--text,var(--fg));
  font:12px/1.55 -apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;height:100%;overflow:hidden}
#root{display:flex;flex-direction:column;height:100vh;min-height:0}
#topbar{height:46px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--bg1);
  padding:0 18px;display:flex;align-items:center;gap:10px}
#topbar h1{margin:0;font-size:13px;font-weight:600}
#topbar .sub{font-size:10px;color:var(--dim)}
.right{margin-left:auto;display:flex;gap:8px;align-items:center}
#content{flex:1;overflow-y:auto;padding:16px 20px;min-height:0}
.wrap{max-width:1100px;margin:0 auto}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:12px;font-weight:600}
.btn{background:var(--bg2);border:1px solid var(--border2);color:var(--fg);border-radius:5px;
  padding:6px 12px;font:inherit;font-size:11px;cursor:pointer}
.btn:hover{background:var(--bg3);border-color:var(--acc)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;color:var(--dim);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
code{font-family:var(--mono);font-size:10px;color:var(--purple)}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;white-space:nowrap;
  border:1px solid var(--border2);background:var(--bg2);color:var(--fg2)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.err{color:var(--err);border-color:var(--err)}
.muted{color:var(--dim)}
.empty{color:var(--dim);text-align:center;padding:16px}
.finding{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px dashed var(--border)}
.finding:first-child{border-top:none}
label.tog{display:flex;gap:6px;align-items:center;color:var(--fg2);font-size:11px}
</style>
</head>
<body>
<div id="root">
  <div id="topbar">
    <div>
      <h1>Certificates</h1>
      <div class="sub">what each service presents · what FreeIPA and step-ca issued · netctl's Let's Encrypt</div>
    </div>
    <div class="right">
      <label class="tog"><input type="checkbox" id="showOld" onchange="render()"> show superseded</label>
      <button class="btn" onclick="load(true)">Check now</button>
    </div>
  </div>
  <div id="content"><div class="wrap">
    <div class="card"><h2>Findings</h2><div id="findings"><div class="empty">checking…</div></div></div>
    <div class="card"><h2>Every certificate</h2><div class="tbl" id="certs"><div class="empty">checking…</div></div>
      <div class="muted" id="meta" style="margin-top:8px"></div></div>
  </div></div>
</div>
<script src="/ui/vera-ui.js"></script>
<script src="/ui/vera-entity-drawer.js"></script>
<script>
const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function cap(name, args){
  const r = await fetch('/mcp/call', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name, arguments: args||{}})});
  const j = await r.json();
  return (j && j.content !== undefined) ? j.content : j;
}
const STATE_KIND = {ok:'ok', 'renew soon':'warn', expiring:'warn', expired:'err', revoked:'err',
                    unreachable:'', superseded:'', recorded:'', 'not issued':'', unknown:''};
const SOURCE = {service:'service', freeipa:'FreeIPA', 'step-ca':'step-ca', netctl:'netctl'};
let DATA = null;
function when(epoch){ return epoch ? new Date(epoch*1000).toISOString().slice(0,10) : ''; }
function render(){
  if (!DATA) return;
  const fs = DATA.findings||[];
  $('findings').innerHTML = fs.length ? fs.map(f => `<div class="finding"><span class="pill ${f.severity==='error'?'err':f.severity==='warn'?'warn':''}">${esc(f.severity)}</span>
      <div>${esc(f.message)} ${f.detail?`<span class="muted">${esc(f.detail)}</span>`:''}</div></div>`).join('')
    : '<div class="muted">No certificate problems found.</div>';
  const showOld = $('showOld').checked;
  const rows = (DATA.certs||[]).filter(c => showOld || c.state !== 'superseded');
  $('certs').innerHTML = rows.length ? '<table><tr><th>Name</th><th>Where</th><th>Issuer</th><th>Covers</th><th>Expires</th><th>Days left</th><th>State</th></tr>'
    + rows.map(c => `<tr><td><span data-entity="cert:${esc(c.name)}" title="Everything the estate knows about this certificate" style="cursor:pointer;border-bottom:1px dotted var(--dim)">${esc(c.name)}</span></td><td class="muted">${esc(SOURCE[c.source]||c.source)} · ${esc(c.where)}</td>
      <td>${esc(c.issuer_kind||'')}</td><td><code>${esc((c.names||[]).slice(0,4).join(', '))}</code></td>
      <td class="num">${esc(when(c.not_after))}</td><td class="num">${c.days_left==null?'':esc(c.days_left)}</td>
      <td><span class="pill ${STATE_KIND[c.state]||''}">${esc(c.state)}</span></td></tr>`).join('') + '</table>'
    : '<div class="empty">No certificates found.</div>';
  const skipped = (DATA.skipped||[]).join(' · ');
  $('meta').textContent = `checked ${new Date((DATA.checked_at||0)*1000).toLocaleString()}` + (DATA.cached?' (cached)':'') + (skipped?` · ${skipped}`:'');
}
async function load(refresh){
  $('meta').textContent = 'checking…';
  DATA = await cap('certs.list', {refresh: !!refresh});
  if (DATA.error) { $('certs').innerHTML = `<div class="empty">${esc(DATA.error)}</div>`; return; }
  render();
}
load(false);
</script>
</body>
</html>
