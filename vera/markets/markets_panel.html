<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vera — Markets</title>
<style>
:root{
  --bg0:#181614;--bg1:#1f1d1a;--bg2:#272421;--bg3:#302c29;
  --border:#3a3530;--border2:#4a4540;
  --acc:#5a9e8f;--acc2:#8fb87a;--acc3:#c9955a;--acc4:#9e8fa0;
  --ok:#6db87a;--err:#c96b6b;--warn:#c9a35a;
  --text:#ddd5c8;--dim:#6a6058;--dim2:#8a7e70;
  --mono:'JetBrains Mono','Fira Mono',monospace;
  --sans:'Inter','IBM Plex Sans',system-ui,sans-serif;
  --radius:5px;--radius-sm:3px;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--text);font-family:var(--sans);font-size:13px}
body{display:flex;flex-direction:column;overflow:hidden}
.hdr{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg1);flex-shrink:0}
.hdr h1{font-size:14px;font-weight:600;color:var(--acc);letter-spacing:.3px}
.hdr .sub{font-size:10px;color:var(--dim2)}
.warn-bar{background:#3a2a1a;color:var(--warn);font-size:11px;padding:6px 12px;border-bottom:1px solid var(--border);display:none}
.wrap{flex:1;display:flex;min-height:0}
.side{width:340px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.main{flex:1;min-width:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius);padding:10px}
.card h2{font-size:11px;font-weight:600;color:var(--acc2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
label{font-size:10px;color:var(--dim2);display:block;margin-bottom:3px}
.row{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.row label{margin-bottom:0;min-width:64px}
input,select{background:var(--bg0);border:1px solid var(--border);color:var(--text);padding:5px 7px;border-radius:var(--radius-sm);font-family:var(--sans);font-size:11px;width:100%}
input[type=checkbox]{width:auto}
input:focus,select:focus{outline:none;border-color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:5px 11px;border-radius:var(--radius-sm);
  background:var(--bg2);border:1px solid var(--border2);color:var(--text);font-size:11px;cursor:pointer;font-family:var(--sans)}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#10201c;font-weight:600}
.btn.primary:hover{filter:brightness(1.1);color:#10201c}
.btn.sm{padding:3px 7px;font-size:10px}
.btn.danger:hover{border-color:var(--err);color:var(--err)}
.status{font-size:10px;color:var(--dim2);margin-top:6px;min-height:13px;word-break:break-word}
.status.ok{color:var(--ok)}.status.err{color:var(--err)}.status.warn{color:var(--warn)}
.tfgrid{display:flex;flex-wrap:wrap;gap:4px}
.tfgrid label{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--text);background:var(--bg0);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px 6px;cursor:pointer;margin:0}
.dd{position:relative}
.dd-list{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-sm);max-height:220px;overflow-y:auto;display:none;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.dd-item{padding:5px 8px;font-size:11px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.dd-item:hover,.dd-item.active{background:var(--bg3);color:var(--acc)}
.dd-item .q{color:var(--dim2);font-size:9.5px}
table{width:100%;border-collapse:collapse;font-size:10.5px}
th{text-align:left;color:var(--dim2);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--border);font-size:9.5px;text-transform:uppercase}
td{padding:4px 6px;border-bottom:1px solid var(--bg2);vertical-align:middle}
.pill{display:inline-block;background:var(--bg0);border:1px solid var(--border);border-radius:10px;padding:1px 6px;font-size:9px;color:var(--dim2);margin:1px}
.jobitem{font-size:10px;padding:5px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:5px;background:var(--bg0)}
.jobitem .jt{display:flex;justify-content:space-between;gap:6px;margin-bottom:3px}
.bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--acc);width:30%;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}
.muted{color:var(--dim2);font-size:10px}
.toggle{cursor:pointer;font-size:14px}
#chart{width:100%;height:380px;background:var(--bg0);border:1px solid var(--border);border-radius:var(--radius)}
.chart-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chart-ctl select{width:auto;min-width:220px}
</style>
<link rel="stylesheet" href="/ui/vera-panel.css">
</head>
<body>
<div class="hdr">
  <h1>📈 Markets</h1>
  <span class="sub">Full-history crypto OHLCV ingestion via CCXT — watchlist &amp; auto-update</span>
</div>
<div class="warn-bar" id="warnBar"></div>

<div class="wrap">
  <!-- ── Sidebar: add asset + jobs ── -->
  <div class="side">
    <div class="card">
      <h2>Add Asset</h2>
      <div class="row"><label>Exchange</label>
        <select id="exSel" onchange="onExchangeChange()"></select>
      </div>
      <div class="row" style="align-items:flex-start"><label>Symbol</label>
        <div class="dd" style="flex:1">
          <input id="symIn" placeholder="search e.g. BTC, ETH/USDT…" autocomplete="off"
                 oninput="onSymInput()" onfocus="onSymInput()" onkeydown="symKey(event)">
          <div class="dd-list" id="symList"></div>
        </div>
      </div>
      <label>Timeframes</label>
      <div class="tfgrid" id="tfGrid"></div>
      <div class="row" style="margin-top:8px"><label>Auto-update</label>
        <input type="checkbox" id="autoUpd" checked style="flex:0">
        <span class="muted" style="margin-left:auto">every</span>
        <input type="number" id="updMin" value="60" min="1" style="width:64px">
        <span class="muted">min</span>
      </div>
      <button class="btn primary" style="width:100%;margin-top:6px" onclick="addAsset()">⚡ Add &amp; Backfill</button>
      <div class="status" id="addStatus"></div>
    </div>

    <div class="card">
      <h2>Fetch Jobs</h2>
      <div id="jobs"><span class="muted">No jobs yet.</span></div>
    </div>
  </div>

  <!-- ── Main: chart + watchlist ── -->
  <div class="main">
    <div class="card">
      <h2>Chart</h2>
      <div class="chart-ctl">
        <select id="chartDs"><option value="">— select a stored dataset —</option></select>
        <label style="display:inline-flex;align-items:center;gap:4px;margin:0;color:var(--text)">
          <input type="checkbox" id="chartVol" checked style="width:auto"> volume</label>
        <button class="btn sm" onclick="renderChart()">Render</button>
        <span class="status" id="chartStatus" style="margin:0"></span>
      </div>
      <div id="chart"></div>
    </div>

    <div class="card">
      <h2>Watchlist</h2>
      <div id="wlWrap"><span class="muted">Loading…</span></div>
    </div>
  </div>
</div>

<script>
const BASE = window.parent?._veraBase || '';
let _ccxt = true;
let _exchanges = [];
let _tfAll = ["1m","5m","15m","30m","1h","4h","1d","1w"];
let _tfDefault = ["1d","1h"];
let _symActive = -1, _symItems = [];
let _pollTimer = null;

async function api(path, method='GET', body=null, timeoutMs=30000){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  let ctl=null,timer=null;
  if(typeof AbortController!=='undefined'){ctl=new AbortController();opts.signal=ctl.signal;
    timer=setTimeout(()=>{try{ctl.abort();}catch(e){}},timeoutMs);}
  try{
    const r=await fetch(BASE+path,opts);
    const t=await r.text(); if(timer)clearTimeout(timer);
    if(!r.ok) return {error:'HTTP '+r.status};
    return t.trim()?JSON.parse(t):null;
  }catch(e){ if(timer)clearTimeout(timer);
    return {error: (e&&e.name==='AbortError')?'timeout':String(e&&e.message||e)}; }
}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function setStatus(id,msg,kind){const el=document.getElementById(id);if(!el)return;el.textContent=msg;el.className='status'+(kind?' '+kind:'');}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init(){
  const r=await api('/markets/exchanges');
  if(r&&!r.error){
    _ccxt=r.ccxt; _exchanges=r.exchanges||[]; _tfAll=r.timeframes||_tfAll; _tfDefault=r.default_timeframes||_tfDefault;
  }
  if(!_ccxt){
    const w=document.getElementById('warnBar');
    w.style.display='block';
    w.innerHTML='⚠ CCXT is not installed in the backend — run <code>pip install ccxt</code> and restart. Watchlist works; fetching is disabled until then.';
  }
  const sel=document.getElementById('exSel');
  sel.innerHTML=_exchanges.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')
    || '<option value="binance">Binance</option>';
  buildTfGrid();
  await loadWatchlist();
  pollJobs();
}
function buildTfGrid(){
  const g=document.getElementById('tfGrid');
  g.innerHTML=_tfAll.map(tf=>{
    const ck=_tfDefault.includes(tf)?'checked':'';
    return `<label><input type="checkbox" value="${tf}" ${ck} style="width:auto"> ${tf}</label>`;
  }).join('');
}
function selectedTfs(){
  return Array.from(document.querySelectorAll('#tfGrid input:checked')).map(c=>c.value);
}
async function onExchangeChange(){
  // refresh supported timeframes for this exchange (best-effort)
  const ex=document.getElementById('exSel').value;
  const r=await api('/markets/timeframes?exchange='+encodeURIComponent(ex));
  if(r&&r.timeframes&&r.timeframes.length){ _tfAll=r.timeframes; buildTfGrid(); }
  document.getElementById('symIn').value=''; hideSymList();
}

// ── Symbol search (debounced) ───────────────────────────────────────────────
let _symDeb=null;
function onSymInput(){
  clearTimeout(_symDeb);
  _symDeb=setTimeout(searchSymbols, 220);
}
async function searchSymbols(){
  const ex=document.getElementById('exSel').value;
  const q=document.getElementById('symIn').value.trim();
  if(!_ccxt){ return; }
  const r=await api('/markets/symbols?exchange='+encodeURIComponent(ex)+'&query='+encodeURIComponent(q)+'&limit=60',
                    'GET',null,25000);
  if(!r||r.error){ setStatus('addStatus', r?.error||'symbol search failed','err'); return; }
  setStatus('addStatus','');
  _symItems=r.symbols||[]; _symActive=-1;
  renderSymList();
}
function renderSymList(){
  const list=document.getElementById('symList');
  if(!_symItems.length){ list.innerHTML='<div class="dd-item muted">no matches</div>'; list.style.display='block'; return; }
  list.innerHTML=_symItems.map((it,i)=>
    `<div class="dd-item${i===_symActive?' active':''}" onmousedown="pickSym(${i})">
       <span>${esc(it.symbol)}</span><span class="q">${esc(it.base)}/${esc(it.quote)}</span></div>`).join('');
  list.style.display='block';
}
function hideSymList(){ const l=document.getElementById('symList'); if(l) l.style.display='none'; }
function pickSym(i){
  const it=_symItems[i]; if(!it) return;
  document.getElementById('symIn').value=it.symbol;
  hideSymList();
}
function symKey(e){
  const list=document.getElementById('symList');
  if(list.style.display==='none') return;
  if(e.key==='ArrowDown'){ _symActive=Math.min(_symItems.length-1,_symActive+1); renderSymList(); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ _symActive=Math.max(0,_symActive-1); renderSymList(); e.preventDefault(); }
  else if(e.key==='Enter'){ if(_symActive>=0){ pickSym(_symActive); e.preventDefault(); } }
  else if(e.key==='Escape'){ hideSymList(); }
}
document.addEventListener('click',e=>{ if(!e.target.closest('.dd')) hideSymList(); });

// ── Add asset ───────────────────────────────────────────────────────────────
async function addAsset(){
  const ex=document.getElementById('exSel').value;
  const sym=document.getElementById('symIn').value.trim();
  const tfs=selectedTfs();
  if(!sym){ setStatus('addStatus','Pick a symbol','err'); return; }
  if(!tfs.length){ setStatus('addStatus','Select at least one timeframe','err'); return; }
  setStatus('addStatus','Adding '+sym+'…','');
  const r=await api('/markets/watchlist/add','POST',{
    exchange:ex, symbol:sym, timeframes:tfs,
    auto_update:document.getElementById('autoUpd').checked,
    update_interval_min:parseInt(document.getElementById('updMin').value||'60'),
    backfill:true
  });
  if(!r||r.error){ setStatus('addStatus','Error: '+(r?.error||'no response'),'err'); return; }
  setStatus('addStatus','✓ Added '+sym+(r.job_id?(' — backfill job '+r.job_id):''),'ok');
  await loadWatchlist();
  pollJobs(true);
}

// ── Watchlist ────────────────────────────────────────────────────────────────
async function loadWatchlist(){
  const r=await api('/markets/watchlist');
  const wrap=document.getElementById('wlWrap');
  if(!r||r.error){ wrap.innerHTML='<span class="status err">'+esc(r?.error||'error')+'</span>'; return; }
  const wl=r.watchlist||[];
  fillChartDatasets(wl);
  if(!wl.length){ wrap.innerHTML='<span class="muted">No assets yet — add one on the left.</span>'; return; }
  let html='<table><thead><tr><th>Asset</th><th>Timeframes / bars</th><th>Last update</th><th>Auto</th><th>Every</th><th></th></tr></thead><tbody>';
  wl.forEach(w=>{
    const tfBars=w.timeframes.map(tf=>`<span class="pill">${esc(tf)}: ${(w.counts?.[tf]??0).toLocaleString()}</span>`).join(' ');
    const status=w.last_status?(' <span class="muted">('+esc(w.last_status)+')</span>'):'';
    html+=`<tr>
      <td><b>${esc(w.symbol)}</b><br><span class="muted">${esc(w.exchange)}</span></td>
      <td>${tfBars}</td>
      <td>${esc(w.last_update||'—')}${status}</td>
      <td><span class="toggle" title="toggle auto-update" onclick="toggleAuto('${esc(w.exchange)}','${esc(w.symbol)}',${w.auto_update?0:1},${w.update_interval_min})">${w.auto_update?'🟢':'⚪'}</span></td>
      <td><input type="number" value="${w.update_interval_min}" min="1" style="width:58px"
            onchange="setInterval2('${esc(w.exchange)}','${esc(w.symbol)}',this.value,${w.auto_update?1:0})"> <span class="muted">m</span></td>
      <td style="white-space:nowrap">
        <button class="btn sm" onclick="updateNow('${esc(w.exchange)}','${esc(w.symbol)}')">↻</button>
        <button class="btn sm" onclick="chartFirst('${esc(w.exchange)}','${esc(w.symbol)}',${JSON.stringify(w.timeframes).replace(/"/g,'&quot;')})">📈</button>
        <button class="btn sm danger" onclick="removeAsset('${esc(w.exchange)}','${esc(w.symbol)}')">✕</button>
      </td></tr>`;
  });
  html+='</tbody></table>';
  wrap.innerHTML=html;
}
async function toggleAuto(ex,sym,val,interval){
  await api('/markets/watchlist/config','POST',{exchange:ex,symbol:sym,auto_update:!!val,update_interval_min:interval});
  loadWatchlist();
}
async function setInterval2(ex,sym,mins,auto){
  await api('/markets/watchlist/config','POST',{exchange:ex,symbol:sym,auto_update:!!auto,update_interval_min:parseInt(mins||'60')});
  loadWatchlist();
}
async function updateNow(ex,sym){
  setStatus('addStatus','Refreshing '+sym+'…','');
  const r=await api('/markets/update_now','POST',{exchange:ex,symbol:sym});
  if(r&&!r.error) setStatus('addStatus','✓ Update started for '+sym,'ok');
  pollJobs(true);
}
async function removeAsset(ex,sym){
  const del=confirm('Remove '+sym+' from watchlist?\n\nOK = remove and DELETE its stored OHLCV data.\nCancel = keep it.');
  if(!del) return;
  await api('/markets/watchlist/remove','POST',{exchange:ex,symbol:sym,delete_data:true});
  await loadWatchlist();
}

// ── Jobs polling ─────────────────────────────────────────────────────────────
async function pollJobs(force){
  if(_pollTimer){ clearTimeout(_pollTimer); _pollTimer=null; }
  const r=await api('/markets/jobs');
  const box=document.getElementById('jobs');
  let anyRunning=false;
  if(r&&r.jobs){
    if(!r.jobs.length){ box.innerHTML='<span class="muted">No jobs yet.</span>'; }
    else{
      box.innerHTML=r.jobs.slice(0,12).map(j=>{
        const running=(j.status==='running'||j.status==='queued'); if(running)anyRunning=true;
        const fetched=Object.entries(j.fetched||{}).map(([tf,n])=>`${tf}:${(n||0).toLocaleString()}`).join('  ')||'…';
        const errs=Object.entries(j.errors||{}).map(([tf,m])=>`${tf}: ${m}`).join('; ');
        const ico=j.status==='done'?'✓':j.status==='error'?'✕':'⏳';
        const col=j.status==='done'?'var(--ok)':j.status==='error'?'var(--err)':'var(--acc3)';
        return `<div class="jobitem">
          <div class="jt"><span><b style="color:${col}">${ico}</b> ${esc(j.symbol)} <span class="muted">${esc(j.exchange)}</span></span>
            <span class="muted">${esc(j.status)}</span></div>
          <div class="muted">${esc(fetched)}</div>
          ${running?'<div class="bar"><i></i></div>':''}
          ${errs?`<div class="status err">${esc(errs)}</div>`:''}
        </div>`;
      }).join('');
    }
  }
  if(anyRunning){
    _pollTimer=setTimeout(()=>pollJobs(), 2000);
  } else if(force){
    // one more refresh shortly after a trigger so counts settle
    _pollTimer=setTimeout(()=>{ loadWatchlist(); }, 1500);
  }
  if(!anyRunning){ loadWatchlist(); }
}

// ── Chart (TradingView Lightweight Charts) ───────────────────────────────────
let _lw=null, _lwLoading=null, _lwBound=false;
function ensureLw(){
  if(window.LightweightCharts) return Promise.resolve(true);
  if(_lwLoading) return _lwLoading;
  _lwLoading=new Promise(res=>{
    const urls=['https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js',
                'https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js'];
    (function tryLoad(i){ if(i>=urls.length){res(false);return;}
      const s=document.createElement('script'); s.src=urls[i];
      s.onload=()=>res(!!window.LightweightCharts); s.onerror=()=>tryLoad(i+1);
      document.head.appendChild(s);
    })(0);
  });
  return _lwLoading;
}
function lwCandle(c,o){ return c.addCandlestickSeries?c.addCandlestickSeries(o):c.addSeries(LightweightCharts.CandlestickSeries,o); }
function lwHist(c,o){ return c.addHistogramSeries?c.addHistogramSeries(o):c.addSeries(LightweightCharts.HistogramSeries,o); }

function fillChartDatasets(wl){
  const sel=document.getElementById('chartDs'); if(!sel) return;
  const cur=sel.value;
  let opts='<option value="">— select a stored dataset —</option>';
  wl.forEach(w=>w.timeframes.forEach(tf=>{
    const ds=`mkt.${w.exchange}.${slug(w.symbol)}.${tf}`;
    const n=w.counts?.[tf]??0;
    opts+=`<option value="${esc(ds)}">${esc(w.symbol)} · ${esc(tf)} · ${esc(w.exchange)} (${n.toLocaleString()})</option>`;
  }));
  sel.innerHTML=opts;
  if(cur) sel.value=cur;
}
function slug(symbol){ return String(symbol||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'asset'; }

function chartFirst(ex,sym,tfs){
  const tf=(tfs&&tfs.length)?(tfs.includes('1d')?'1d':tfs[0]):'1d';
  const ds=`mkt.${ex}.${slug(sym)}.${tf}`;
  const sel=document.getElementById('chartDs'); if(sel) sel.value=ds;
  renderChart();
}

async function loadBars(ds){
  let off=0, all=[], guard=0;
  while(guard++<60){
    const r=await api('/fabric/browse','POST',{dataset_id:ds,limit:200,offset:off},30000);
    const recs=r?.records||[]; if(!recs.length) break;
    all=all.concat(recs);
    if(!r.has_more || all.length>=12000) break;
    off+=recs.length;
  }
  const bars=[];
  all.forEach(rec=>{
    const d=rec.data; if(!d||typeof d!=='object') return;
    let t=d.timestamp; if(t==null) t=d.ts;
    let sec=null;
    if(typeof t==='number') sec=t>1e12?Math.floor(t/1000):Math.floor(t);
    else if(typeof t==='string'){ const ms=Date.parse(t); if(!isNaN(ms)) sec=Math.floor(ms/1000); }
    if(sec==null) return;
    const o=Number(d.open),c=Number(d.close);
    if(!isFinite(o)&&!isFinite(c)) return;
    const oo=isFinite(o)?o:c, cc=isFinite(c)?c:o;
    const h=isFinite(Number(d.high))?Number(d.high):Math.max(oo,cc);
    const l=isFinite(Number(d.low))?Number(d.low):Math.min(oo,cc);
    bars.push({time:sec,open:oo,high:h,low:l,close:cc,volume:(d.volume!=null&&isFinite(Number(d.volume)))?Number(d.volume):null});
  });
  bars.sort((a,b)=>a.time-b.time);
  const dedup=[]; let seen=null;
  bars.forEach(b=>{ if(b.time===seen) dedup[dedup.length-1]=b; else { dedup.push(b); seen=b.time; } });
  return dedup;
}

async function renderChart(){
  const ds=document.getElementById('chartDs').value;
  if(!ds){ setStatus('chartStatus','Select a dataset','err'); return; }
  setStatus('chartStatus','Loading…','');
  let bars;
  try{ bars=await loadBars(ds); }catch(e){ setStatus('chartStatus','Load error: '+e,'err'); return; }
  if(!bars.length){ setStatus('chartStatus','No bars stored yet','warn'); return; }
  const ok=await ensureLw();
  if(!ok){ setStatus('chartStatus','Chart library failed to load (offline?)','err'); return; }
  const el=document.getElementById('chart');
  if(_lw){ try{_lw.remove();}catch(e){} _lw=null; }
  _lw=LightweightCharts.createChart(el,{
    width:el.clientWidth, height:380,
    layout:{background:{color:'transparent'},textColor:'#8a7e70',fontSize:10},
    grid:{vertLines:{color:'rgba(58,53,48,.3)'},horzLines:{color:'rgba(58,53,48,.3)'}},
    rightPriceScale:{borderColor:'rgba(58,53,48,.6)'},
    timeScale:{borderColor:'rgba(58,53,48,.6)',timeVisible:true,secondsVisible:false},
    crosshair:{mode:0},
  });
  const cs=lwCandle(_lw,{upColor:'#5a9e8f',downColor:'#c9955a',borderUpColor:'#5a9e8f',
    borderDownColor:'#c9955a',wickUpColor:'#5a9e8f',wickDownColor:'#c9955a'});
  cs.setData(bars.map(b=>({time:b.time,open:b.open,high:b.high,low:b.low,close:b.close})));
  const hasVol=bars.some(b=>b.volume!=null&&b.volume>0);
  const volOn=document.getElementById('chartVol').checked;
  if(hasVol&&volOn){
    const vs=lwHist(_lw,{priceFormat:{type:'volume'},priceScaleId:'vol'});
    _lw.priceScale('vol').applyOptions({scaleMargins:{top:0.82,bottom:0}});
    vs.setData(bars.map(b=>({time:b.time,value:b.volume||0,
      color:b.close>=b.open?'rgba(90,158,143,.5)':'rgba(201,149,90,.5)'})));
  }
  _lw.timeScale().fitContent();
  if(!_lwBound){ window.addEventListener('resize',()=>{ const e=document.getElementById('chart'); if(_lw&&e)_lw.applyOptions({width:e.clientWidth}); }); _lwBound=true; }
  setStatus('chartStatus','✓ '+bars.length.toLocaleString()+' candles'+((hasVol&&volOn)?' + volume':''),'ok');
}

init();
</script>
<script src="/ui/vera-ui.js"></script>
<script src="/ui/vera-panel.js"></script>
