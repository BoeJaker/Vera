<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* vera theme boot — paint cached theme before CSS parses, avoids flash */
  (function(){try{var d=document.documentElement,S=window.localStorage;
  var t=S.getItem('vera:ui:theme');if(t)d.setAttribute('data-theme',t);
  var v=JSON.parse(S.getItem('vera:ui:themeVars')||'null');
  if(v)for(var k in v)d.style.setProperty(k,v[k]);}catch(e){}})();</script>
<meta charset="UTF-8">
<title>Vera — Agents</title>
<style>
:root{
  --bg0:#181614;--bg1:#1f1d1a;--bg2:#272421;--bg3:#302c29;
  --border:#3a3530;--border2:#4a4540;
  --acc:#5a9e8f;--acc2:#8fb87a;--acc3:#c9955a;--acc4:#9e8fa0;
  --ok:#6db87a;--err:#c96b6b;--warn:#c9a35a;
  --text:#ddd5c8;--fg:#ddd5c8;--dim:#6a6058;--dim2:#8a7e70;
  --mono:'JetBrains Mono','Fira Mono','Space Mono',monospace;
  --sans:'Inter','IBM Plex Sans',system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--text);font-family:var(--sans);font-size:12px;-webkit-font-smoothing:antialiased}
html,body,button,input,select,textarea,span,div{font-variant-emoji:text}
#shell{display:flex;height:100vh;overflow:hidden}
/* The left-hand menu is the shared one: markup per the canonical shape,
   chrome from /ui/vera-panel.css, behaviour (collapse, nav bridging) from
   /ui/vera-panel.js. Nothing about it is styled here — that is the point. */
#panes{flex:1;overflow:hidden;position:relative;min-width:0}
.pane{position:absolute;inset:0;display:none}
.pane.on{display:block}
.pane iframe{width:100%;height:100%;border:none;display:block;background:var(--bg0)}
</style>
<link rel="stylesheet" href="/ui/vera-panel.css">
</head>
<body>
<div id="shell">
  <aside id="sidebar" data-vera-lhm>
    <div id="side-head">
      <span class="ico">◆</span>
      <div><h1>Agents</h1><div class="sub">skills &middot; ontologies</div></div>
    </div>
    <nav id="nav">
      <button type="button" class="nav-btn active" data-pane="agents"     title="Agents"     onclick="show('agents',this)"><span class="gl">◆</span>Agents</button>
      <button type="button" class="nav-btn"        data-pane="skills"     title="Skills"     onclick="show('skills',this)"><span class="gl">✦</span>Skills</button>
      <button type="button" class="nav-btn"        data-pane="ontologies" title="Ontologies" onclick="show('ontologies',this)"><span class="gl">⬡</span>Ontologies</button>
      <!-- The agent registry: what an EXTERNAL agent drives Vera with. It sits
           here rather than in a tab of its own because it is a skills surface -
           it projects into and out of the two stores either side of it. -->
      <button type="button" class="nav-btn"        data-pane="registry"   title="Registry"   onclick="show('registry',this)"><span class="gl">▤</span>Registry</button>
      <!-- Agent bridges: the external agent runtimes Vera can drive. Formerly a
           top-level tab; the shell now opens it here. -->
      <button type="button" class="nav-btn"        data-pane="bridges"    title="Agent Bridges" onclick="show('bridges',this)"><span class="gl">⇄</span>Bridges</button>
    </nav>
  </aside>
  <div id="panes">
    <div class="pane on" id="pane-agents">
      <iframe id="frame-agents"     src="about:blank" allow="clipboard-read; clipboard-write; microphone"></iframe>
    </div>
    <div class="pane" id="pane-skills">
      <iframe id="frame-skills"     src="about:blank" allow="clipboard-read; clipboard-write"></iframe>
    </div>
    <div class="pane" id="pane-ontologies">
      <iframe id="frame-ontologies" src="about:blank" allow="clipboard-read; clipboard-write"></iframe>
    </div>
    <div class="pane" id="pane-registry">
      <iframe id="frame-registry"   src="about:blank" allow="clipboard-read; clipboard-write"></iframe>
    </div>
    <div class="pane" id="pane-bridges">
      <iframe id="frame-bridges"    src="about:blank" allow="clipboard-read; clipboard-write"></iframe>
    </div>
  </div>
</div>
<script src="/ui/vera-panel-bridge.js"></script>
<script>
'use strict';
// KEY FIX: base URL is always the origin of THIS page since it's served by the backend
const BASE = window.location.origin || (window.__VERA_BASE__||('http://'+location.hostname+':8999'));
const LOADED = { agents:false, skills:false, ontologies:false, registry:false, bridges:false };
let _lastThemeVars = null;

const PATHS = {
  agents:     '/ui/panels/agents-panel',
  skills:     '/ui/panels/skills-panel',
  ontologies: '/ui/panels/ontologies-panel',
  registry:   '/ui/panels/registry-panel',
  bridges:    '/agentbridge/panel',
};

function loadFrame(name) {
  if (LOADED[name]) return;
  LOADED[name] = true;
  const frame = document.getElementById('frame-' + name);
  if (!frame) return;
  frame.src = BASE + PATHS[name];
  frame.addEventListener('load', () => {
    try { frame.contentWindow.postMessage({ type:'vera:base', url:BASE }, '*'); } catch(_){}
    if (_lastThemeVars) {
      try { frame.contentWindow.postMessage({ type:'vera:theme', vars:_lastThemeVars }, '*'); } catch(_){}
    }
  }, { once:true });
}

function show(name, el) {
  document.querySelectorAll('#nav .nav-btn').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
  const pane = document.getElementById('pane-' + name);
  if (pane) pane.classList.add('on');
  loadFrame(name);
}
// The outer shell's copy of this menu — the items and which one is current —
// is published by the shared /ui/vera-panel.js off the canonical markup
// above (its title= is the label it sends), so there is no registerNav or
// setNavActive of our own to keep in step with it.

function broadcast(msg) {
  Object.keys(LOADED).forEach(name => {
    if (!LOADED[name]) return;
    const f = document.getElementById('frame-' + name);
    try { f?.contentWindow?.postMessage(msg, '*'); } catch(_){}
  });
}

window.addEventListener('message', e => {
  if (e.data?.type === 'vera:base') broadcast({ type:'vera:base', url: e.data.url||BASE });
  if (e.data?.type === 'vera:theme') {
    _lastThemeVars = e.data.vars;
    if (e.data.vars) {
      const root = document.documentElement;
      const map = {'--bg':'--bg0','--s1':'--bg1','--s2':'--bg2','--s3':'--bg3',
        '--bd':'--border','--bd2':'--border2','--t1':'--text','--t2':'--dim2',
        '--t3':'--dim','--ac':'--acc','--ac2':'--acc2','--ac3':'--acc3','--ac4':'--err','--ac5':'--acc4'};
      for (const [k,v] of Object.entries(map)) { if (e.data.vars[k]) root.style.setProperty(v, e.data.vars[k]); }
    }
    broadcast(e.data);
  }
  // A tab folded in here (Agent Bridges) is opened on its pane by the shell,
  // which repeats the request until this panel acknowledges it.
  if (e.data?.type === 'vera:estate:open' && Object.prototype.hasOwnProperty.call(PATHS, e.data.pane)) {
    show(e.data.pane, document.querySelector('#nav .nav-btn[data-pane="' + e.data.pane + '"]'));
    try { if (e.source) e.source.postMessage({ type:'vera:estate:opened', rid:e.data.rid, ok:true }, '*'); } catch(_){}
  }
});

window.addEventListener('DOMContentLoaded', () => { loadFrame('agents'); });
</script>
<script src="/ui/vera-ui.js"></script>
<script src="/ui/vera-panel.js"></script>
</body>
</html>
