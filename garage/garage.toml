# ─────────────────────────────────────────────────────────────────────────────
#  Garage single-node config — Vera data-fabric object store
#
#  DEV DEFAULTS. For any real deployment, regenerate the secrets below:
#    rpc_secret  : openssl rand -hex 32
#    admin_token : openssl rand -base64 32   (keep in sync with garage-init)
# ─────────────────────────────────────────────────────────────────────────────

metadata_dir = "/var/lib/garage/meta"
data_dir     = "/var/lib/garage/data"
db_engine    = "sqlite"

# Single node — no redundancy.
replication_factor = 1

rpc_bind_addr   = "[::]:3901"
rpc_public_addr = "garage:3901"
rpc_secret      = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

[s3_api]
# Must match FABRIC_S3_REGION (SigV4 region) used by the boto3 client.
s3_region     = "garage"
api_bind_addr = "[::]:3900"
root_domain   = ".s3.garage.localhost"

[s3_web]
bind_addr   = "[::]:3902"
root_domain = ".web.garage.localhost"
index       = "index.html"

[admin]
api_bind_addr = "[::]:3903"
admin_token   = "vera-garage-admin-change-me"
