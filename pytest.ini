[pytest]
# Operator/doc unit tests. The pure suite (perception/actions/safety/thinker/
# loop/docgen) runs anywhere; contract/panel tests self-skip without Vera's
# runtime deps. Browser-backed tests are opt-in: `pytest -m browser`.
testpaths = tests
addopts = -q -ra
markers =
    browser: exercises a real Playwright browser (skipped unless deps + browser present)
