# ═══════════════════════════════════════════════════════════════════════════════
#  Vera Orchestration Platform — Docker Compose
# ═══════════════════════════════════════════════════════════════════════════════
#
#  Services:
#    vera         – FastAPI orchestrator (port 8999)
#    redis        – Event streams, task queues, caching (port 6379)
#    postgres     – Persistent storage (port 5433)
#    chromadb     – Vector embeddings store (port 8008)
#    neo4j        – Memory graph database (ports 7474/7687)
#    garage       – S3-compatible blob storage for the data fabric (port 3900)
#    garage-init  – One-shot bootstrap (layout, access key, bucket)
#    vera-builder – Compile/build farm (arduino-cli+ESP32, PlatformIO, gcc/cmake)
#
#  Ollama GPU/CPU workers are expected to run on separate hosts and are
#  configured via environment variables (OLLAMA_GPU_URL, etc).
#
#  Usage:
#    docker compose up -d            # start everything
#    docker compose up -d --build    # rebuild vera image
#    docker compose logs -f vera     # follow orchestrator logs
#    docker compose down -v          # tear down (including volumes)
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── Vera Orchestrator ──────────────────────────────────────────────────────
  vera:
    build:
      context: .
      dockerfile: Dockerfile
    # Explicit tag so `docker compose build vera` produces the exact image the
    # worker-provisioning path (docker.worker.spawn / VERA_WORKER_IMAGE) runs —
    # 'vera:latest' does not exist on Docker Hub and must never be pulled.
    image: vera:latest
    container_name: vera-orchestrator
    ports:
      - "${ORCHESTRATOR_PORT:-8999}:8999"
    environment:
      # ── Core
      ORCHESTRATOR_HOST: "0.0.0.0"
      ORCHESTRATOR_PORT: "8999"
      BACKEND_HOST: "${BACKEND_HOST:-llm.int}"

      # ── Master key for encrypting stored cloud-calendar credentials (Fernet).
      #    SET THIS in your .env for production. If left blank, a key is
      #    auto-generated inside the container at ~/.vera/secret.key — which is
      #    EPHEMERAL and lost on rebuild, making sealed secrets in the (persisted)
      #    Redis volume undecryptable. Generate one with:
      #      python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())"
      VERA_SECRET_KEY: "${VERA_SECRET_KEY:-}"

      # ── HTTPS (secure context for the Web Serial API / webcam getUserMedia).
      #    Set TLS_ENABLED=1 to serve https:// on the same port (8999). A
      #    self-signed cert is auto-generated at /root/.vera/tls on first start
      #    (persisted via the vera-tls volume below) — browsers show a one-time
      #    "not trusted" warning. Supply your own cert by mounting it and setting
      #    TLS_CERTFILE / TLS_KEYFILE to its path inside the container.
      #    The container's own hostname often resolves to a loopback address
      #    (Debian's /etc/hosts maps it to 127.0.1.1), so the auto-generated
      #    cert's SAN list can miss the LAN IP clients actually connect
      #    through — set TLS_EXTRA_SANS (comma-sep IPs/hostnames) if a client
      #    reports "Hostname/IP does not match certificate's altnames", then
      #    delete the vera-tls volume (or the cert/key inside it) and restart.
      TLS_ENABLED: "${TLS_ENABLED:-0}"
      TLS_EXTRA_SANS: "${TLS_EXTRA_SANS:-}"

      # ── Backing services (point at compose service names)
      REDIS_URL: "redis://redis:6379"
      POSTGRES_URL: "postgresql://admin:admin@postgres:5432/postgres"
      CHROMA_HOST: "chromadb"
      CHROMA_PORT: "8000"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASS: "${NEO4J_PASS:-veraneo4j}"

      # ── Data-fabric object store (Garage S3). FABRIC_OBJECT_STORE must be
      #    non-"none" to enable it. ACCESS/SECRET are deterministic dev creds
      #    that garage-init imports — override all four in your .env together
      #    with the matching values used by the garage-init service below.
      FABRIC_OBJECT_STORE: "${FABRIC_OBJECT_STORE:-garage}"
      FABRIC_S3_ENDPOINT: "http://garage:3900"
      FABRIC_S3_ACCESS: "${FABRIC_S3_ACCESS:-GKa1b2c3d4e5f6708192a3b4c5}"
      FABRIC_S3_SECRET: "${FABRIC_S3_SECRET:-a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90}"
      FABRIC_S3_BUCKET: "${FABRIC_S3_BUCKET:-vera-data-fabric}"
      FABRIC_S3_REGION: "${FABRIC_S3_REGION:-garage}"

      # ── Ollama cluster (external hosts — override as needed)
      OLLAMA_GPU_URL: "${OLLAMA_GPU_URL:-http://192.168.0.250:11435}"
      OLLAMA_CPU_A_URL: "${OLLAMA_CPU_A_URL:-http://192.168.0.246:11435}"
      OLLAMA_CPU_B_URL: "${OLLAMA_CPU_B_URL:-http://192.168.0.247:11435}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-jaahas/qwen3.5-uncensored}"
      OLLAMA_EMBED_URL: "${OLLAMA_EMBED_URL:-http://192.168.0.246:11435}"
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"

      # ── GPU inference (Whisper / TTS / SD — external host)
      GPU_INFER_URL: "${GPU_INFER_URL:-http://192.168.0.250:8765}"

      # ── Build/compile service (vera-builder): arduino-cli + ESP32 core,
      #    PlatformIO, gcc/cmake, esptool, mpy-cross. Used by mesh.firmware.build
      #    and the build.* capabilities so Vera never needs a compiler in its image.
      VERA_BUILDER_URL: "${VERA_BUILDER_URL:-http://vera-builder:8080}"

      # ── IDE projects root (inside container)
      VERA_PROJECT_ROOT: "/data/projects"

      # ── Central VS Code (code-server) — the primary IDE surface. The vera
      #    orchestrator reverse-proxies it same-origin at /vscode/central/ so
      #    login works inside the Vera page (raw-URL iframes drop the session
      #    cookie as third-party). VSCODE_PASSWORD must match the vscode
      #    service below so the 🔑 copy/reveal helpers work.
      VSCODE_CENTRAL_URL: "${VSCODE_CENTRAL_URL:-http://vscode:8080}"
      VSCODE_PASSWORD: "${VSCODE_PASSWORD:-vera-code}"  # pragma: allowlist secret
      VSCODE_PROJECTS_VOLUME: "${VSCODE_PROJECTS_VOLUME:-vera_vera-projects}"

      # ── Tuning
      MAX_CAPS_IN_PROMPT: "${MAX_CAPS_IN_PROMPT:-25}"
      EMBED_CAPS_ON_START: "${EMBED_CAPS_ON_START:-1}"
      SYSLOG_MONITOR: "${SYSLOG_MONITOR:-1}"
    volumes:
      - vera-projects:/data/projects
      - vera-tls:/root/.vera/tls   # persist auto-generated self-signed TLS cert
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      neo4j:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - vera-net

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vera-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - vera-net

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vera-postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - vera-net

  # ── ChromaDB (vector store) ────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: vera-chromadb
    ports:
      - "${CHROMA_PORT:-8008}:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped
    networks:
      - vera-net

  # ── Neo4j (memory graph) ──────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: vera-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASS:-veraneo4j}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: "512m"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASS:-veraneo4j} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - vera-net

  # ── Garage (S3-compatible blob storage) ────────────────────────────────────
  garage:
    image: dxflrs/garage:v1.0.1
    container_name: vera-garage
    command: ["/garage", "server"]
    environment:
      # The config is bind-mounted from the host, so its permissions arrive
      # world-readable and Garage refuses to start with secrets exposed. This
      # is a single-node local cluster, so allow it rather than chmod-ing a
      # Windows/Docker-Desktop mount (which can't be made 0600 anyway).
      GARAGE_ALLOW_WORLD_READABLE_SECRETS: "true"
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"       # S3 API
      # Admin API — token-protected (garage.toml [admin].admin_token). Published
      # so a NATIVE (non-docker) orchestrator and the store-provisioning caps
      # (provision.store.garage.bootstrap) can bootstrap/inspect the node too.
      - "${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      # distroless image: the garage binary itself is the only thing we can run
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - vera-net

  # ── Garage bootstrap (one-shot) ────────────────────────────────────────────
  #  Applies a single-node layout, imports the deterministic S3 key the vera
  #  service expects, and creates + grants the data-fabric bucket — all through
  #  the garage ADMIN API (:3903) with plain curl. The previous approach drove
  #  the garage CLI via `docker exec` and needed the host docker socket, which
  #  silently fails on some hosts (Docker Desktop / hardened daemons) and left
  #  the store keyless → the orchestrator saw AccessDenied on every S3 call.
  #  GARAGE_ADMIN_TOKEN must match [admin].admin_token in garage/garage.toml.
  garage-init:
    image: curlimages/curl:8.9.1
    container_name: vera-garage-init
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_ADMIN_URL: "http://garage:3903"
      GARAGE_ADMIN_TOKEN: "${GARAGE_ADMIN_TOKEN:-vera-garage-admin-change-me}"
      S3_ACCESS_KEY: "${FABRIC_S3_ACCESS:-GKa1b2c3d4e5f6708192a3b4c5}"
      S3_SECRET_KEY: "${FABRIC_S3_SECRET:-a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90}"
      S3_BUCKET: "${FABRIC_S3_BUCKET:-vera-data-fabric}"
    volumes:
      - ./garage/init.sh:/init.sh:ro
    command: ["sh", "/init.sh"]
    restart: "no"
    networks:
      - vera-net

  # ── Central VS Code (code-server) ──────────────────────────────────────────
  #  The primary IDE surface: shares the vera-projects volume with the
  #  orchestrator so it edits the exact tree the IDE capabilities / agents work
  #  on. Embedded in the IDE tab through the orchestrator's same-origin proxy
  #  (/vscode/central/). `ide.vscode.central.ensure` adopts this container and
  #  best-effort installs the Claude Code CLI, extensions
  #  (VSCODE_CENTRAL_EXTENSIONS) and the Vera MCP bridge inside it.
  #  The docker socket is mounted so its integrated terminal can reach the
  #  per-session sandbox containers (`docker exec -it vera-sbx-… sh`) — remove
  #  that mount if you don't want the IDE container to control the host daemon.
  vscode:
    image: codercom/code-server:latest
    container_name: vera-vscode
    environment:
      PASSWORD: "${VSCODE_PASSWORD:-vera-code}"  # pragma: allowlist secret
    command: ["--bind-addr", "0.0.0.0:8080", "--auth", "password", "/home/coder/projects"]
    ports:
      - "${VSCODE_PORT:-8843}:8080"   # direct/standalone access; the Vera UI uses the proxy
    volumes:
      - vscode-data:/home/coder                       # settings + extensions persist
      - vera-projects:/home/coder/projects            # same tree as the orchestrator IDE
      - /var/run/docker.sock:/var/run/docker.sock     # reach session sandboxes
    restart: unless-stopped
    networks:
      - vera-net

  # ── Vera Builder (compilation / build farm) ────────────────────────────────
  #  A general build service: arduino-cli + the ESP32 Arduino core, PlatformIO,
  #  a C/C++/CMake/Ninja toolchain, esptool and mpy-cross behind an HTTP API
  #  (vera/build/builder_service.py). Vera reaches it at VERA_BUILDER_URL over
  #  vera-net so mesh.firmware.build and the build.* caps can compile firmware
  #  and software without a compiler in the vera image.
  #  NB: the FIRST build pulls the ESP32 toolchains (~2 GB) — large and slow, then
  #  cached. Port is published so a NATIVE (non-docker) orchestrator can use it too.
  vera-builder:
    build:
      context: ./vera/build
      dockerfile: Dockerfile
    image: vera-builder:latest
    container_name: vera-builder
    ports:
      - "${BUILDER_PORT:-8785}:8080"
    environment:
      BUILDER_DEFAULT_FQBN: "${BUILDER_DEFAULT_FQBN:-esp32:esp32:esp32}"
    volumes:
      - builder-cache:/opt/arduino
      - builder-pio:/opt/platformio
    restart: unless-stopped
    networks:
      - vera-net

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  redis-data:
  pg-data:
  chroma-data:
  neo4j-data:
  vera-projects:
  vera-tls:
  vscode-data:
  garage-meta:
  garage-data:
  builder-cache:
  builder-pio:

# ── Network ────────────────────────────────────────────────────────────────────
networks:
  vera-net:
    driver: bridge