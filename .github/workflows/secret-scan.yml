name: secret-scan

# Server-side backstop: catches secrets even if a contributor skips the local
# pre-commit hook (git commit --no-verify). Runs on every push and PR.
on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Scan tracked files for secrets
        run: python tools/secret_scan.py --all
